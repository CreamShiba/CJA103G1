<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>車友討論區 - 檢舉違規</title>
    <style>
        /* 整體背景：深邃黑 */
        body {
            background-color: #0f0f0f;
            color: #ffffff;
            font-family: 'Microsoft JhengHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 容器：亮黑質感 + 賽車紅邊條 */
        .container {
            background-color: #1a1a1a;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #333;
            border-top: 6px solid #ff0000; /* 更亮的紅色 */
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            color: #ff0000;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .form-group { margin-bottom: 25px; }

        /* 標籤：修正太透明的問題，改為亮灰色 */
        label {
            display: block;
            margin-bottom: 10px;
            color: #dddddd;
            font-weight: bold;
            font-size: 14px;
        }

        /* 輸入框：深灰色背景 + 白色文字 */
        input, select, textarea {
            width: 100%;
            padding: 14px;
            background-color: #262626;
            border: 1px solid #444;
            border-radius: 6px;
            color: #ffffff; /* 確保文字是純白 */
            font-size: 16px;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        /* 輸入框點擊效果：紅光外顯 */
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.5);
            background-color: #2d2d2d;
        }

        /* 按鈕：賽車紅漸層 */
        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #cc0000, #ff0000);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            text-transform: uppercase;
            transition: 0.4s;
            margin-top: 10px;
        }

        button:hover {
            background: linear-gradient(45deg, #ff0000, #ff4d4d);
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        /* 提示字顏色 */
        ::placeholder { color: #666666; }
    </style>
</head>
<body>
<div class="container">
    <h2>Report Center</h2>
    <form th:action="@{/reports/submit}" method="post">
        <div class="form-group">
            <label>檢舉類型</label>
            <select name="reportsType">
                <option value="廣告垃圾">廣告垃圾</option>
                <option value="人身攻擊">人身攻擊</option>
                <option value="內容不實">內容不實</option>
                <option value="其他">其他</option>
            </select>
        </div>
        <div class="form-group">
            <label>檢舉標題</label>
            <input type="text" name="reportsReason" placeholder="例如：洗版、引戰" required>
        </div>
        <div class="form-group">
            <label>詳細描述</label>
            <textarea name="reportsDescription" rows="4" placeholder="請詳細說明違規內容..." required></textarea>
        </div>
        <div class="form-group">
            <label>會員編號 (ID)</label>
            <input type="number" name="memberNo" placeholder="請輸入您的 ID" required>
        </div>
        <button type="submit">SUBMIT REPORT</button>
    </form>
</div>
</body>
</html>
