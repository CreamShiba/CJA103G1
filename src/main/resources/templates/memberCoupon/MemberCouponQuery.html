<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的優惠券 | 卡爾夏汽車百貨</title>
    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" th:href="@{/css/memberCouponStyle.css}">

    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
</head>
<body>

<!-- Header -->
<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<!-- 主要內容 -->
<div class="container">
    <!-- 側邊欄 -->
    <aside>
        <div class="sidebar-section">
            <h3 class="sidebar-title">會員中心</h3>
            <ul class="category-list" id="category-list">
                <li><a th:href="@{/pages/my-coupons}" onclick="navigateTo('coupons')">我的優惠券</a></li>
                <li><a th:href="@{/favorite/list-page}" onclick="navigateTo('favorite')">我的收藏</a></li>
                <li><a th:href="@{/pages/my-orders}">訂單查詢</a></li>
            </ul>
        </div>
    </aside>

    <!-- 主要內容區 -->
    <main class="content-area">
        <div class="coupon-container">
            <h2 class="coupon-header">我的優惠券清單</h2>

            <!-- 領取優惠券區域 -->
            <div class="claim-section">
                <input type="text" id="couponTitleInput" placeholder="請輸入優惠券名稱">
                <button class="btn-claim" onclick="claimCoupon()">立即領取</button>
                <span id="claimMsg"></span>
            </div>

            <!-- 篩選按鈕 -->
            <div class="filter-bar">
                <button class="filter-btn active" onclick="loadCoupons('all', this)">全部</button>
                <button class="filter-btn" onclick="loadCoupons('expired', this)">已過期/已使用</button>
            </div>

            <!-- 加載中 -->
            <div id="loading" class="loading">資料讀取中...</div>

            <!-- 優惠券表格 -->
            <table id="couponTable" class="coupon-table" style="display:none;">
                <thead>
                <tr>
                    <th>優惠券名稱</th>
                    <th>折扣金額</th>
                    <th>使用狀態</th>
                    <th>使用期限</th>
                </tr>
                </thead>
                <tbody id="couponBody"></tbody>
            </table>

            <!-- 無資料提示 -->
            <div id="noData" class="no-data" style="display:none;">
                目前沒有可用的優惠券。
            </div>
        </div>
    </main>
</div>

<!-- Footer -->
    <footer th:replace="~{fragments/footer :: Footer}"></footer>

<!--<script th:src="@{/js/front-end/index.js}"></script>-->
<script>


    // 頁面載入完成後
    window.onload = function() {
        loadCoupons('all');
        initUserDropdown();
    };

    // 初始化下拉選單
    function initUserDropdown() {
        // 處理右上角使用者圖示
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');
        const memberTrigger = document.getElementById('member-center-trigger');
        const memberDropdown = document.getElementById('member-dropdown');

        if (userIcon && userDropdown) {
            userIcon.onclick = function(e) {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
                memberDropdown.classList.remove('show');
            };
        }

        // 處理導航列中的「會員中心」
        if (memberTrigger && memberDropdown) {
            memberTrigger.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();
                memberDropdown.classList.toggle('show');
                userDropdown.classList.remove('show');
            };
        }

        // 全域點擊監聽：點擊選單以外區域時關閉
        document.addEventListener('click', function(event) {
            const isUserIcon = event.target.closest('#user-icon');
            const isMemberTrigger = event.target.closest('#member-center-trigger');
            const isUserDropdown = event.target.closest('#user-dropdown');
            const isMemberDropdown = event.target.closest('#member-dropdown');

            if (!isUserIcon && !isUserDropdown) {
                userDropdown.classList.remove('show');
            }

            if (!isMemberTrigger && !isMemberDropdown) {
                memberDropdown.classList.remove('show');
            }
        });
    }

    // 導航功能
    function navigateTo(page) {
        const routes = {
            'home': '/pages/front-end/index',
            'shop': '/shop',
            'installation': '/installation',
            'forum': '/forum',
            'notice': '/notice',
            'faq': '/faq',
            'category1': '/category/category1',
            'category2': '/category/category2',
            'category3': '/category/category3',
            'category4': '/category/category4',
            'category5': '/category/category5',
            'coupons': '/pages/my-coupons',
            'favorite':'/favorite/list-page'
        };

        if (routes[page]) {
            window.location.href = routes[page];
        }
    }

    // 領取優惠券
    async function claimCoupon() {
        const title = document.getElementById('couponTitleInput').value;
        const msgSpan = document.getElementById('claimMsg');

        if (!title) {
            msgSpan.innerText = '請輸入優惠券名稱';
            msgSpan.style.color = 'red';
            return;
        }

        try {
            // 修改點：不再傳遞 memberNo
            const response = await fetch(`/member/coupons/claim?couponTitle=${encodeURIComponent(title)}`, {
                method: 'POST'
            });

            if (response.status === 401) { // 未登入處理
                window.location.href = '/members/login';
                return;
            }

            const result = await response.text();
            msgSpan.innerText = result;
            msgSpan.style.color = response.ok ? '#4caf50' : 'red';

            if (response.ok) {
                loadCoupons('all');
                document.getElementById('couponTitleInput').value = '';
            }
        } catch (error) {
            console.error('Error:', error);
        }
    }

    // 加載優惠券列表
    async function loadCoupons(type, buttonElement) {
        const loading = document.getElementById('loading');
        const table = document.getElementById('couponTable');
        const body = document.getElementById('couponBody');
        const noData = document.getElementById('noData');

        // 更新篩選按鈕樣式
        if (buttonElement) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            buttonElement.classList.add('active');
        }

        loading.style.display = 'block';
        table.style.display = 'none';
        noData.style.display = 'none';

        try {
            const url = '/member/coupons/my-coupons';
            const response = await fetch(url);

            if (response.status === 401) {
                window.location.href = '/members/login';
                return;
            }

            // ✅ 修正：204 只代表後端傳回空陣列，
            // 但當前可能只是該標籤無資料，不應直接結束。
            // 改為統一用空陣列處理，後面的過濾邏輯會自動顯示「無資料」。
            let data = [];
            if (response.status !== 204) {
                data = await response.json();
            }

            // 前端校驗用的 helper：拿到每筆券的「有效狀態」
            // 若後端 status = 0 但 couponEnd 已過期，視為 2
            function getEffectiveStatus(item) {
                if (item.couponStatus === 0 && item.coupon && item.coupon.couponEnd) {
                    if (new Date() > new Date(item.coupon.couponEnd)) {
                        return 2;
                    }
                }
                return item.couponStatus;
            }

            // --- 前端過濾邏輯 ---
            let filteredData;
            if (type === 'all') {
                // 「全部」標籤：顯示未使用 (status = 0) 的券
                filteredData = data.filter(item => getEffectiveStatus(item) === 0);
            } else if (type === 'expired') {
                // ✅ 修正重點：「已過期/已使用」標籤
                // 顯示已使用 (status = 1) 或已過期 (status = 2) 的券
                filteredData = data.filter(item => {
                    const s = getEffectiveStatus(item);
                    return s === 1 || s === 2;
                });
            } else {
                filteredData = data;
            }

            // 過濾後無資料才顯示提示
            if (filteredData.length === 0) {
                loading.style.display = 'none';
                noData.style.display = 'block';
                return;
            }

            loading.style.display = 'none';
            table.style.display = 'table';
            body.innerHTML = '';

            filteredData.forEach(item => {
                let statusClass = '';
                let statusText = '';
                const couponObj = item.coupon || {};
                const now = new Date();

                // 前端校驗過期：後端排程可能遲到，
                // 所以當 status = 0（未使用）但 coupon.couponEnd 已經超過當前時間，
                // 前端直接視為已過期 (2)
                let effectiveStatus = item.couponStatus;
                if (effectiveStatus === 0 && couponObj.couponEnd) {
                    if (now > new Date(couponObj.couponEnd)) {
                        effectiveStatus = 2;
                    }
                }

                // 根據 couponStatus 設定狀態（0:未使用, 1:已使用, 2:已過期）
                if (item.couponStatus === 0) {
                    statusClass = 'status-unused';
                    statusText = '未使用';
                } else if (item.couponStatus === 1) {
                    statusClass = 'status-used';
                    statusText = '已使用';
                } else if (item.couponStatus === 2) {
                    statusClass = 'status-expired';
                    statusText = '已過期';
                }

                // 安全抓取資料，避免 undefined

                const title = couponObj.couponTitle || '未知優惠券';
                const discount = couponObj.discountValue ? `$${couponObj.discountValue}` : '-';

                // ✅ 修正：useTime 可能為 null（例如未使用過的券），加入安全判斷
                const expiryDate = item.useTime ? item.useTime.split('T')[0] : '無使用記錄';

                body.innerHTML += `
                    <tr>
                        <td><strong>${title}</strong></td>
                        <td><strong style="color:#ff3333;">${discount}</strong></td>
                        <td><span class="status-badge ${statusClass}">${statusText}</span></td>
                        <td>${expiryDate}</td>
                    </tr>
                `;
            });
        } catch (error) {
            loading.style.display = 'none';
            console.error('Error:', error);
        }
    }

</script>
</body>
</html>
