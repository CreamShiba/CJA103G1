<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的訂單 | 卡爾夏汽車百貨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <style>
        .order-container { padding: 20px; max-width: 1200px; margin: 0 auto; }
        .order-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 15px; /* 讓每一行之間有間距 */
            background-color: transparent;
        }
        .order-table th {
            display: none;
        }
        .order-table tr {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); /* 輕微陰影 */
            border-radius: 12px;
        }
        .order-table td {
            padding: 20px;
            border: none; /* 移除邊框 */
            vertical-align: middle;
        }
        .order-table td:first-child {
            border-top-left-radius: 12px;
            border-bottom-left-radius: 12px;
            font-weight: bold;
            color: #333;
        }
        .order-table td:last-child {
            border-top-right-radius: 12px;
            border-bottom-right-radius: 12px;
            text-align: right;
        }
        .status-badge {
            padding: 6px 16px;
            border-radius: 8px;
            font-weight: 500;
        }

        .status-paid {
            background-color: #e7f0ff;
            color: #007bff;
        }

        .status-completed {
            background-color: #e6f7ee;
            color: #28a745;
        }

        .status-completed-cancel {
            background-color: #dedede;
            color: #333;
        }

        .status-pending {
            background-color: #fff9e6;
            color: #ffc107;
        }
        .btn-complete {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-complete:hover {
            background-color: #218838;
        }
        .btn-detail {
            background-color: #f8f9fa;
            border: 1px solid #ddd;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-rate {
            background-color: #007bff; /* 藍色 */
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }
        .btn-rate:hover {
            background-color: #0056b3;
        }
        /* 彈窗背景 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            overflow: hidden; /* 防止背景出現雙捲軸 */
        }
        /* 彈窗內容 */
        .modal-content {
            background-color: #fefefe;
            margin: 5% auto;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 900px;
            max-height: 85vh; /* 限制最大高度為螢幕高度的 85% */
            overflow-y: auto; /* 重點：垂直方向內容過多時顯示捲軸 */
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            position: relative;
        }

        /* 讓標題區塊固定（可選：增加易讀性） */
        .modal-content h3 {
            margin-top: 0;
            position: sticky;
            top: -20px; /* 抵消 padding */
            background: white;
            padding: 15px 0;
            z-index: 10;
            border-bottom: 2px solid #eee;
        }

        /* 關閉按鈕固定在右上角 */
        .close {
            position: sticky;
            top: -10px;
            right: 0;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            z-index: 11;
            color: #888;
        }

        .close:hover {
            color: #000;
        }

        .close {
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .detail-table img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        .prod-name {
            font-weight: 500;
            color: #333;
        }
        .prod-name-cell {
            text-align: left !important;
            max-width: 200px;
        }
        .detail-table { width: 100%; border-collapse: collapse; margin-top: 15px; color: #333; }
        .detail-table th { background-color: #f8f9fa; }
        .detail-table th, .detail-table td { border: 1px solid #ddd; padding: 10px; text-align: center; }

         .container{
             max-width: 95% !important;
             padding-right: 20px;
         }

        /* 訂單日期標籤文字 */
        .order-date-label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        /* 價格加重顯示 */
        .price-text {
            font-size: 1.1em;
            font-weight: 600;
            color: #333;
        }

    </style>
</head>
<body>

<!-- Header -->
<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<!-- 主要內容 -->
<div class="container">
    <!-- 側邊欄 -->
    <aside th:replace="~{fragments/member_center_sidebar :: memberCenterSidebar}"></aside>


    <!-- 主要內容區 -->
    <main class="content-area" style="width: -webkit-fill-available;">
        <div class="order-container">
            <h2>我的訂單紀錄</h2>
            <table class="order-table">
                <thead>
                <tr>
                    <th>訂單編號</th>
                    <th>下單日期</th>
                    <th>付款方式</th>
                    <th>付款狀態</th>
                    <th>實付金額</th>
                    <th>訂單狀態</th>
                    <th>物流方式</th>
                    <th>評價</th>
                    <th></th>
                </tr>
                </thead>
                <tbody id="orderBody">
                </tbody>
            </table>
            <div id="noOrder" style="display:none; text-align:center; padding: 20px;">目前尚無訂單紀錄。</div>
        </div>

        <div id="detailModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h3>訂單明細 - <span id="modalOrdNo"></span></h3>
                <hr>
                <table class="detail-table">
                    <thead>
                    <tr>
                        <th style="width: 100px;"></th> <th>商品名稱</th>
                        <th>單價</th>
                        <th>數量</th>
                        <th>小計</th>
                    </tr>
                    </thead>
                    <tbody id="detailBody">
                    </tbody>
                </table>
                <hr>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; background: #f9f9f9; padding: 15px; border-radius: 5px; font-size: 14px;color: #333;">
                    <div><strong>收件人：</strong><span id="modalRecipient"></span></div>
                    <div><strong>物流方式：</strong><span id="modalShipMethod"></span></div>
                    <div><strong>收件地址：</strong><span id="modalAddress"></span></div>
                    <div><strong>物流單號：</strong><span id="modalShipNo"></span></div>
                </div>
                <div style="text-align: right; margin-top: 15px; color:#333;">
                    <h4>總金額：$<span id="modalTotal"></span></h4>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Footer -->
<footer th:replace="~{fragments/footer :: Footer}"></footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<!--<script th:src="@{/js/front-end/index.js}"></script>-->
<script th:inline="javascript">
    const memberNo = /*[[${session.member?.memNo}]]*/ null;

    window.addEventListener('DOMContentLoaded', () => {
        console.log('✅ 頁面載入完成，會員編號:', memberNo);
        initUserDropdown();
        if (memberNo) {
            initPage();
        } else {
            console.warn('⚠️ 未登入，無法載入訂單');
            window.location.href = '/members/login';
        }
    });
    // ✅ 新增: 全域變數
    let allRates = [];

    // ✅ 新增: 初始化函數
    async function initPage() {
        try {
            console.log('📡 開始載入評價資料...');
            const rateRes = await fetch(`/prodRate/member/${memberNo}`, {
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            });

            if (rateRes.ok) {
                allRates = await rateRes.json();
                console.log("✅ 評價載入成功，數量:", allRates.length);
                console.log("評價資料:", allRates);
            } else {
                console.warn('⚠️ 評價載入失敗:', rateRes.status);
                allRates = [];
            }

            await fetchOrders();
        } catch (err) {
            console.error("❌ 初始化失敗:", err);
            allRates = [];
            await fetchOrders();
        }
    }

    // window.onload = function() {
    //     fetchOrders();
    //     initUserDropdown();
    // };

    function initUserDropdown() {
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');
        const memberTrigger = document.getElementById('member-center-trigger');
        const memberDropdown = document.getElementById('member-dropdown');

        if (userIcon && userDropdown) {
            userIcon.onclick = (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
                if(memberDropdown) memberDropdown.classList.remove('show');
            };
        }

        if (memberTrigger && memberDropdown) {
            memberTrigger.onclick = (e) => {
                e.preventDefault();
                e.stopPropagation();
                memberDropdown.classList.toggle('show');
                if(userDropdown) userDropdown.classList.remove('show');
            };
        }

        document.addEventListener('click', () => {
            if(userDropdown) userDropdown.classList.remove('show');
            if(memberDropdown) memberDropdown.classList.remove('show');
        });
    }

    // 2. 獲取訂單清單
    async function fetchOrders() {
        const body = document.getElementById('orderBody');
        const noOrderDiv = document.getElementById('noOrder');

        try {
            // 1. 取得訂單資料
            const orderRes = await fetch('/member/orders/my-orders', {
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            });

            if (orderRes.status === 401) {
                window.location.href = '/members/login';
                return;
            }

            if (orderRes.status === 204) {
                noOrderDiv.style.display = 'block';
                body.innerHTML = '';
                return;
            }

            const orders = await orderRes.json();

            body.innerHTML = '';
            noOrderDiv.style.display = 'none';

            orders.forEach(ord => {
                // --- 狀態樣式邏輯 ---
                let statusClass = '';
                if (ord.ordStatus === '已完成' || ord.ordStatus === '已取消') {
                    statusClass = 'status-completed-cancel'; // 灰色
                } else if (ord.ordStatus === '待付款') {
                    statusClass = 'status-pending';   // 黃色
                } else if (ord.ordStatus === '已出貨') {
                    statusClass = 'status-paid';      // 綠色 (進行中)
                } else {
                    statusClass = 'status-paid';
                }

                // --- 評價按鈕邏輯 (對應 prorate 欄位) ---
                let ratingBtn = `<span style="color: #ccc;"> </span>`;

                const ordRates = allRates.filter(r => {
                    const rateOrdNo = Number(r.ordNo || r.ord_no);
                    const currentOrdNo = Number(ord.ordNo);
                    return rateOrdNo === currentOrdNo;
                });

                if  (ord.ordStatus === '已完成') {
                    const ordRates = allRates.filter(r => {
                        const rateOrdNo = Number(r.ordNo || r.ord_no);
                        const currentOrdNo = Number(ord.ordNo);
                        return rateOrdNo === currentOrdNo;
                    });

                    console.log(`📝 訂單 #${ord.ordNo} 的評價數量:`, ordRates.length);  // ✅ 移到這裡

                    if (ordRates.length === 0) {
                        // 沒有評價資料 - 顯示「去評價」
                        ratingBtn = `<button class="btn-rate" onclick="location.href='/prodRate/add-page?ordNo=${ord.ordNo}'">去評價</button>`;
                    } else {
                        // 有評價資料 - 檢查狀態
                        const statusList = ordRates.map(r => Number(r.rateStatus));
                        const allLocked = statusList.every(s => s === 2);
                        const hasDraft = statusList.some(s => s === 1);

                        console.log(`  狀態列表:`, statusList, `全部鎖定:${allLocked}, 有草稿:${hasDraft}`);  // ✅ 新增除錯訊息

                        if (allLocked) {
                            // 全部都是狀態2 - 已評價完成(鎖定)
                            ratingBtn = `<button class="btn-rate" style="background-color:#ccc;" onclick="location.href='/prodRate/add-page?ordNo=${ord.ordNo}'">查看評價</button>`;
                        } else if (hasDraft) {
                            // 有狀態1 - 可修改
                            ratingBtn = `<button class="btn-rate" style="background-color:#ffc107; color:black;" onclick="location.href='/prodRate/add-page?ordNo=${ord.ordNo}'">修改評價</button>`;
                        } else {
                            // ✅ 新增: 其他狀態(例如null) - 顯示「去評價」
                            ratingBtn = `<button class="btn-rate" onclick="location.href='/prodRate/add-page?ordNo=${ord.ordNo}'">去評價</button>`;
                        }
                    }
                }
                // --- 動作按鈕邏輯 (詳情 / 確認收貨) ---
                let actionBtn = `<button class="btn-detail" onclick="viewDetail(${ord.ordNo})">訂單詳情</button>`;

                // 新增：若訂單狀態為「已發貨」，在詳情按鈕前增加「確認收貨」按鈕
                if (ord.ordStatus === '已出貨') {
                    actionBtn = `
                    <button class="btn-complete" style="background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer;font-size: 12px;"
                            onclick="confirmReceipt(${ord.ordNo})">
                        確認收貨
                    </button>
                ` + actionBtn;
                }

                // 3. 渲染至表格
                body.innerHTML += `
                <tr>
                    <td>
                        <div style="display:flex; align-items:center;">
                            <div style="display: ruby">
                                <i class="fa-solid fa-box" style="color:#ccc;"></i
                            </div>
                            <div>
                                <div style="font-size:12px; color:#888;">Order ID</div>
                                <div style="font-weight:bold;">#${ord.ordNo}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="order-date-label">Date</span>
                        <div style="font-weight:500; color: #333; font-size: 12px;">${formatDate(ord.ordDate)}</div>
                    </td>
                    <td>
                        <span class="order-date-label">Status</span>
                        <span class="status-badge ${statusClass}">${ord.ordStatus}</span>
                    </td>
                    <td>
                        <span class="order-date-label">Price</span>
                        <div class="price-text">$${ord.ordPrice}</div>
                    </td>
                    <td>
                        <div style="display:flex; gap:10px; justify-content:flex-end; align-items:center;">
                            ${ratingBtn}
                            ${actionBtn}
                        </div>
                    </td>
                </tr>`;
            });
        } catch (err) {
            console.error('fetchOrders 發生錯誤:', err);
            body.innerHTML = `<tr><td colspan="9" style="color:red;text-align:center;">讀取失敗: ${err.message}</td></tr>`;
        }
    }

    // 3. 查看明細
    async function viewDetail(ordNo) {
        try {
            const res = await fetch(`/member/orders/detail/${ordNo}`, {
                headers: {
                    'Accept': 'application/json'
                }
            });

            if (!res.ok) {
                throw new Error(`HTTP ${res.status}: 無法取得明細`);
            }

            const contentType = res.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                const responseText = await res.text();
                console.error('明細 API 返回非 JSON:', responseText.substring(0, 200));
                throw new Error("伺服器返回格式錯誤");
            }

            const order = await res.json();
            document.getElementById('modalOrdNo').innerText = '#' + order.ordNo;
            document.getElementById('modalRecipient').innerText = order.ordRecipient || '未填寫';
            document.getElementById('modalAddress').innerText = order.ordAddress || '未填寫';
            document.getElementById('modalShipMethod').innerText = order.ordShipMethod || '未指定';
            document.getElementById('modalShipNo').innerText = order.ordShipNo || '尚未提供物流單號';
            document.getElementById('modalTotal').innerText = order.ordPrice;

            const detailBody = document.getElementById('detailBody');
            detailBody.innerHTML = '';

            if (order.ordDetails && order.ordDetails.length > 0) {
                order.ordDetails.forEach(item => {
                    // 同步後端屬性名稱：若商品物件在 Java 是 productProd，這裡請對應修改
                    const pName =  item.productProd ? item.productProd.productName : `商品#${item.prodNo}`;
                    const imgSrc = `/favorite/showImage?prodNo=${item.prodNo}`;

                    detailBody.innerHTML += `
                    <tr>
                        <td><img src="${imgSrc}"
                            onerror="this.style.display='none'; this.parentElement.innerHTML='<div style=\\'width:80px;height:80px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;border-radius:4px;\\'>無圖片</div>'">
                        </td>
                        <td style="text-align:left;">${pName}</td>
                        <td>$${item.price}</td>
                        <td>${item.qty}</td>
                        <td>$${item.price * item.qty}</td>
                    </tr>`;
                });
            }
            document.getElementById('detailModal').style.display = 'block';
        } catch (err) {
            console.error('viewDetail 錯誤:', err);
            alert('讀取失敗: ' + err.message);
        }
    }

    // 4. 確認收貨
    async function confirmReceipt(ordNo) {
        // 使用 SweetAlert2 取代原生 confirm
        Swal.fire({
            title: '確定要確認收貨嗎？',
            text: "點擊確認後，訂單狀態將更改為「已完成」。",
            icon: 'question',
            showCancelButton: true,
            confirmButtonColor: '#28a745',
            cancelButtonColor: '#6c757d',
            confirmButtonText: '是的，我已收到！',
            cancelButtonText: '取消'
        }).then(async (result) => {
            if (result.isConfirmed) {
                try {
                    const res = await fetch(`/member/orders/${ordNo}/complete`, {
                        method: 'PATCH',
                        headers: { 'Accept': 'application/json' }
                    });

                    if (res.ok) {
                        // 成功提示
                        Swal.fire({
                            title: '訂單完成！',
                            text: '感謝您的購買，快去給商品評價吧！',
                            icon: 'success',
                            timer: 2000,
                            showConfirmButton: false
                        });
                        // 重新刷洗資料
                        await initPage(); // 建議呼叫 initPage 同步評價與訂單
                    } else {
                        Swal.fire('發生錯誤', '更新失敗，請稍後再試。', 'error');
                    }
                } catch (err) {
                    console.error('confirmReceipt 錯誤:', err);
                    Swal.fire('網路錯誤', err.message, 'error');
                }
            }
        });
    }

    // 5. 輔助工具
    function closeModal() {
        document.getElementById('detailModal').style.display = 'none';
    }

    function formatDate(dateStr) {
        return dateStr ? dateStr.replace('T', ' ').substring(0, 16) : '--';
    }

    function navigateTo(page) {
        const routes = { 'home': '/', 'shop': '/shop', 'coupons': '/pages/my-coupons', 'favorite':'/favorite/list-page' };
        if(routes[page]) window.location.href = routes[page];
    }

    // 點擊彈窗外部關閉
    window.onclick = function(event) {
        const modal = document.getElementById('detailModal');
        if (event.target == modal) {
            closeModal();
        }
    }

    </script>
</body>
</html>
