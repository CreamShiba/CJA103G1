<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>編輯文章 - 卡爾夏後台</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/4.2.1/css/bootstrap.min.css}"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        body { background-color: #f8f9fa; padding-top: 50px; }
        .edit-container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header-title { border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 25px; color: #333; }
        .btn-save { background-color: #007bff; border: none; padding: 10px 30px; }
        .btn-cancel { margin-left: 10px; }
        .info-readonly { background-color: #e9ecef; color: #495057; }
    </style>
</head>
<body>
<div class="container">
    <div class="edit-container">
        <h2 class="header-title"><i class="fa-solid fa-pen-to-square"></i> 編輯文章內容</h2>

        <form th:action="@{/admin/forum/article/update}" th:object="${post}" method="post">
            <input type="hidden" th:field="*{postId}" />

            <input type="hidden" name="member.memNo" th:value="${post.member?.memNo}" />

            <div class="row">
                <div class="col-md-6 form-group">
                    <label>作者暱稱 (不可修改)</label>
                    <input type="text" th:value="${post.member?.memUsername ?: '未知用戶'}" class="form-control info-readonly" readonly />
                </div>
                <div class="col-md-6 form-group">
                    <label>原始發布時間</label>
                    <input type="text" th:value="${#dates.format(post.postDate, 'yyyy-MM-dd HH:mm:ss')}" class="form-control info-readonly" readonly />
                </div>
            </div>

            <div class="form-group">
                <label>文章分類</label>
                <select class="form-control" th:field="*{categories.categoryId}">
                    <option th:each="cat : ${allCategories}" th:value="${cat.categoryId}" th:text="${cat.name}">載入中...</option>
                </select>
            </div>

            <div class="form-group">
                <label>文章標題</label>
                <input type="text" th:field="*{title}" class="form-control" required />
            </div>

            <div class="form-group">
                <label>文章內容</label>
                <textarea th:field="*{postTxt}" class="form-control" rows="8" required></textarea>
            </div>

            <div class="form-group" style="width: 250px;">
                <label>手動調整按讚數</label>
                <div class="input-group">
                    <div class="input-group-prepend"><span class="input-group-text"><i class="fa-solid fa-thumbs-up"></i></span></div>
                    <input type="number" th:field="*{postLike}" class="form-control" />
                </div>
            </div>

            <div class="form-group">
                <label><i class="fa-solid fa-images"></i> 現有圖片管理</label>
                <div id="image-manager" class="d-flex flex-wrap border p-3 rounded bg-light">
                    <div th:each="img : ${post.postImages}" th:id="'img-container-' + ${img.imageId}" class="position-relative m-2 text-center" style="width: 120px;">
                        <img th:src="@{${img.url}}" class="img-thumbnail" style="width: 100px; height: 100px; object-fit: cover;">
                        <button type="button" class="btn btn-danger btn-sm position-absolute" style="top: -5px; right: 5px; border-radius: 50%; width: 25px; height: 25px; padding: 0;" th:onclick="|deleteImage(${img.imageId})|">&times;</button>
                    </div>
                </div>
            </div>

            <hr>
            <div class="text-right">
                <a th:href="@{/admin/forum/article}" class="btn btn-light btn-cancel">取消返回</a>
                <button type="submit" class="btn btn-primary btn-save">儲存變更</button>
            </div>
        </form>
    </div>
</div>
<script th:inline="javascript">
    function deleteImage(imageId) {
        if (!confirm("確定要永久刪除這張圖片嗎？")) return;
        fetch('/admin/images/delete/' + imageId, { method: 'DELETE' })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    const element = document.getElementById('img-container-' + imageId);
                    if (element) { element.style.opacity = "0"; setTimeout(() => element.remove(), 500); }
                } else { alert("刪除失敗：" + data.message); }
            }).catch(err => alert("系統錯誤"));
    }
</script>
</body>
</html>
