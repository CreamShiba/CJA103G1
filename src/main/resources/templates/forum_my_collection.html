<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的文章收藏 | 卡爾夏論壇</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <link rel="stylesheet" th:href="@{/css/favorite.css}">
    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">

    <style>
        /* =========================================
           1. 全域暗黑風格 (還原你的截圖)
        ========================================= */
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #3a0000 40%, #000000 100%);
            color: #fff;
            min-height: 100vh;
        }

        /* 讓容器排版正確 */
        .container {
            max-width: 1200px !important;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        /* 標題區域 (置中 + 紅色) */
        .page-header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #ff3333; /* 標題下的紅線 */
            padding-bottom: 20px;
        }

        .page-header h1 {
            color: #ff3333;
            font-size: 32px;
            margin-bottom: 10px;
            border-left: none; /* 移除原本側邊的線 */
            padding-left: 0;
        }

        .page-header p {
            color: #888;
            font-size: 14px;
        }

        /* =========================================
           2. 統計卡片 (還原截圖的方框樣式)
        ========================================= */
        .stats {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            flex: 1;
            background-color: rgba(255, 255, 255, 0.05); /* 半透明黑 */
            border: 1px solid #444; /* 灰色邊框 */
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            color: #fff;
            box-shadow: none; /* 移除原本陰影 */
        }

        .stat-number {
            font-size: 36px;
            color: #ff3333; /* 數字紅色 */
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #ccc;
            font-size: 14px;
        }

        /* =========================================
           3. 表格與內容區 (暗黑化)
        ========================================= */
        .content-area {
            flex-grow: 1;
            background: transparent; /* 移除白底 */
        }

        /* 表格樣式覆寫 */
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background-color: #222;
            color: #ff3333;
            padding: 15px;
            text-align: left;
            border-bottom: 2px solid #444;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #333;
            color: #ddd;
        }

        /* 連結文字顏色 */
        a { text-decoration: none; color: inherit; transition: .3s; }
        a:hover { color: #ff3333; }

        /* 空狀態樣式 */
        .empty-state {
            text-align: center;
            padding: 60px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            border: 1px solid #333;
            color: #888;
        }

        /* =========================================
           4. 側邊欄 (深色風格)
        ========================================= */
        .custom-sidebar {
            width: 250px;
            flex-shrink: 0;
            background: rgba(26, 26, 26, 0.8);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .sidebar-menu-title {
            color: #fff;
            border-bottom: 2px solid #ff3333;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
            font-size: 18px;
        }

        .sidebar-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 15px;
            margin-bottom: 10px;
            background-color: #222;
            color: #aaa;
            border-radius: 6px;
            border-left: 3px solid transparent;
        }

        .sidebar-btn:hover {
            background-color: #333;
            color: #fff;
            border-left: 3px solid #ff3333;
        }

        .sidebar-btn.active {
            background-color: #ff3333;
            color: white;
            border-left: 3px solid #cc0000;
        }

        /* 強制顯示 Header 下拉選單 */
        .dropdown-menu.show {
            display: block !important;
            opacity: 1 !important;
            visibility: visible !important;
            top: 100% !important;
            background-color: #222 !important; /* 暗色背景 */
            border: 1px solid #444 !important;
        }
        .dropdown-menu a { color: #ccc !important; }
        .dropdown-menu a:hover { background-color: #ff3333 !important; color: white !important; }

        /* 返回按鈕 */
        .btn-back { color: #888; margin-top: 20px; display: inline-block; }
        .btn-back:hover { color: #fff; }
    </style>
</head>

<body>

<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="container">

    <aside class="custom-sidebar">
        <div class="sidebar-menu-title">
            <i class="fas fa-compass"></i> 快速導覽
        </div>

        <a href="/forum" class="sidebar-btn">
            <i class="fas fa-comments"></i> 討論區首頁
        </a>

        <a href="/chat" class="sidebar-btn">
            <i class="fas fa-paper-plane"></i> 私訊中心
        </a>

        <a href="/forum/my-collection" class="sidebar-btn active">
            <i class="fas fa-bookmark"></i> 我的文章收藏
        </a>
    </aside>

    <main class="content-area">
        <div class="page-header">
            <h1>我的收藏清單</h1>
            <p>您已收藏的文章</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" th:text="${myFavPosts.size()}">0</div>
                <div class="stat-label">收藏文章</div>
            </div>

        </div>

        <div id="articles-section" style="display: block;">

            <div th:if="${not #lists.isEmpty(myFavPosts)}">
                <table>
                    <thead>
                    <tr>
                        <th>文章標題</th>
                        <th>發布時間</th>
                        <th style="width: 150px;">操作</th>
                    </tr>
                    </thead>
                    <tbody id="article-table-body">
                    <tr th:each="post : ${myFavPosts}" th:id="'post-row-' + ${post.postId}">
                        <td>
                            <a th:href="@{/forum/detail(postId=${post.postId})}">
                                <div class="item-info">
                                    <div class="item-details">
                                        <h4 th:text="${post.title}" style="margin: 0; font-size: 16px;">文章標題</h4>
                                        <span style="color: #ff3333; font-size: 12px;" th:text="${post.categories.name}">分類</span>
                                    </div>
                                </div>
                            </a>
                        </td>
                        <td>
                            <div style="color: #888;" th:text="${#dates.format(post.postDate, 'yyyy-MM-dd')}"></div>
                        </td>
                        <td>
                            <button type="button" class="btn btn-delete"
                                    style="background: transparent; border: 1px solid #d9534f; color: #d9534f; padding: 5px 10px; border-radius: 4px; cursor: pointer;"
                                    th:onclick="'deleteArticle(' + ${post.postId} + ')'">
                                <i class="fas fa-trash"></i> 取消
                            </button>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(myFavPosts)}" class="empty-state">
                <i class="fas fa-heart-broken" style="font-size: 50px; color: #555; margin-bottom: 20px;"></i>
                <div class="empty-title" style="color: #ccc; font-size: 18px; margin-bottom: 10px;">沒有收藏的文章</div>
                <a href="/forum" style="color: #ff3333; text-decoration: underline;">前往論壇逛逛</a>
            </div>
        </div>

        <div style="text-align: center;">
            <a href="/forum" class="btn-back">
                <i class="fas fa-arrow-left"></i> 返回論壇首頁
            </a>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footer :: Footer}"></footer>

<script>
    // 1. 刪除文章功能
    function deleteArticle(postId) {
        if (!confirm('確定要取消收藏這篇文章嗎？')) return;

        fetch('/forum/favorite/' + postId, {
            method: 'POST'
        })
            .then(res => res.text())
            .then(data => {
                if (data === 'removed' || data === 'success') {
                    const row = document.getElementById('post-row-' + postId);
                    if (row) {
                        row.style.opacity = '0';
                        setTimeout(() => {
                            row.remove();
                            const tbody = document.getElementById('article-table-body');
                            if (tbody && tbody.children.length === 0) {
                                location.reload();
                            }
                        }, 300);
                    }
                } else {
                    alert('取消失敗，請稍後重試');
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生連線錯誤');
            });
    }

    // 🟢 2. Header 下拉選單修復 (包含論壇與會員選單)
    document.addEventListener('DOMContentLoaded', function() {
        console.log("Header Logic Initialized");

        // 取得所有觸發按鈕與下拉選單
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');

        const memberTrigger = document.getElementById('member-center-trigger');
        const memberDropdown = document.getElementById('member-dropdown');

        // 🟢 關鍵：加入論壇選單的控制
        const forumTrigger = document.getElementById('forum-center-trigger');
        const forumDropdown = document.getElementById('forum-dropdown');

        // 通用切換函數
        function toggleDropdown(trigger, targetDropdown, others = []) {
            if (trigger && targetDropdown) {
                trigger.addEventListener('click', function(e) {
                    e.preventDefault();
                    e.stopPropagation();

                    // 切換目標選單
                    targetDropdown.classList.toggle('show');

                    // 關閉其他選單
                    others.forEach(d => {
                        if(d) d.classList.remove('show');
                    });
                });
            }
        }

        // 綁定事件
        toggleDropdown(userIcon, userDropdown, [memberDropdown, forumDropdown]);
        toggleDropdown(memberTrigger, memberDropdown, [userDropdown, forumDropdown]);
        toggleDropdown(forumTrigger, forumDropdown, [userDropdown, memberDropdown]);

        // 點擊空白處關閉所有選單
        document.addEventListener('click', function(e) {
            const allDropdowns = [userDropdown, memberDropdown, forumDropdown];
            const allTriggers = [userIcon, memberTrigger, forumTrigger];

            let clickedInside = false;

            // 檢查點擊是否在任何觸發器或下拉選單內
            allTriggers.forEach(t => { if(t && t.contains(e.target)) clickedInside = true; });
            allDropdowns.forEach(d => { if(d && d.contains(e.target)) clickedInside = true; });

            if (!clickedInside) {
                allDropdowns.forEach(d => { if(d) d.classList.remove('show'); });
            }
        });
    });
</script>
</body>
</html>
