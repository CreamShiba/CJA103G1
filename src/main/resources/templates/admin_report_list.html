<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>論壇檢舉管理 - 卡爾夏 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* 🟢 100% 完整保留原始樣式 */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f5f7fa; color: #333; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100%; }
        .sidebar { width: 260px; background-color: #ffffff; border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; z-index: 10; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 24px; height: 12px; background-color: #0066cc; border-radius: 4px; }
        .sidebar-header h2 { font-size: 18px; font-weight: bold; color: #1a1a1a; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; padding-top: 20px; }
        .sidebar-nav ul { list-style: none; padding: 0; margin: 0; }
        .menu-link, .menu-item a { display: flex; align-items: center; padding: 12px 24px; color: #555; text-decoration: none; font-size: 15px; transition: 0.2s; justify-content: space-between; cursor: pointer; }
        .menu-link i:first-child, .menu-item a i:first-child { margin-right: 10px; width: 20px; text-align: center; }
        .menu-link:hover, .menu-item a:hover { background-color: #f0f7ff; color: #0066cc; }
        .submenu { list-style: none; background-color: #fafafa; display: none; padding: 0; margin: 0; }
        .has-submenu.open .submenu { display: block; }
        .has-submenu.open .arrow { transform: rotate(180deg); }
        .submenu a { padding: 12px 24px 12px 58px; font-size: 14px; display: block; color: #666; text-decoration: none; }
        .submenu a.active { background-color: #e0f2f1; color: #00796b; font-weight: bold; border-right: 3px solid #00796b; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background-color: white; padding: 15px 40px; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 20px; color: #00796b; font-weight: bold; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; background-color: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .content-body { padding: 20px 40px; overflow-y: auto; flex-grow: 1; }
        .admin-table { width: 100%; border-collapse: collapse; background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .admin-table th { background-color: #f8f9fa; padding: 12px 15px; text-align: left; font-size: 14px; color: #666; border-bottom: 2px solid #eee; }
        .admin-table td { padding: 12px 15px; border-bottom: 1px solid #f0f0f0; font-size: 14px; vertical-align: middle; }
        .action-group { display: flex; gap: 8px; }
        .btn-mini { padding: 4px 8px; border-radius: 4px; font-size: 12px; cursor: pointer; border: 1px solid transparent; transition: 0.2s; display: flex; align-items: center; gap: 4px; background: none; }
        .btn-take-down { color: #d9534f; border-color: #ebccd1; background-color: #f2dede; }
        .btn-take-down:hover { background-color: #d9534f; color: white; }
        .btn-reject { color: #666; border-color: #ccc; background-color: #eee; }
        .btn-reject:hover { background-color: #999; color: white; }
    </style>
</head>
<body>
<div class="app-container">
    <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='report')}"></aside>
    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">論壇檢舉管理 (綜合系統)</h2>
            <div class="user-profile">
                <span>Admin User</span>
                <div class="avatar"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="content-body">
            <table class="admin-table">
                <thead>
                <tr>
                    <th>案號</th>
                    <th>文章 ID</th>
                    <th>檢舉理由</th>
                    <th>狀態</th>
                    <th style="width: 180px;">管理操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="report : ${reportList}">
                    <td th:text="${report.reportsNo}"></td>
                    <td th:text="${report.forumPost != null ? '#' + report.forumPost.postId : 'N/A'}"></td>
                    <td th:text="${report.reportsReason}"></td>
                    <td>
                        <span th:text="${report.status}"
                              th:style="${report.status == '待處理' ? 'color: #d9534f; font-weight: bold;' : 'color: #666;'}">
                        </span>
                    </td>
                    <td>
                        <div class="action-group" th:if="${report.status == '待處理'}">
                            <form th:action="@{/admin/forum/report/process}" method="post" onsubmit="return confirm('確定下架此文章？')">
                                <input type="hidden" name="reportsNo" th:value="${report.reportsNo}" />
                                <input type="hidden" name="status" value="已下架" />
                                <button type="submit" class="btn-mini btn-take-down">
                                    <i class="fas fa-arrow-down"></i> 下架
                                </button>
                            </form>

                            <form th:action="@{/admin/forum/report/process}" method="post" onsubmit="return confirm('確定駁回此檢舉？')">
                                <input type="hidden" name="reportsNo" th:value="${report.reportsNo}" />
                                <input type="hidden" name="status" value="已駁回" />
                                <button type="submit" class="btn-mini btn-reject">
                                    <i class="fas fa-times"></i> 駁回
                                </button>
                            </form>
                        </div>
                        <span th:unless="${report.status == '待處理'}" style="color: #999; font-size: 12px;">處理完畢</span>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(reportList)}">
                    <td colspan="5" style="text-align: center; color: #999; padding: 30px;">目前沒有檢舉紀錄</td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</div>
<script>
    function toggleMenu(element) {
        const parentLi = element.closest('.has-submenu');
        if (parentLi) { parentLi.classList.toggle('open'); }
    }
</script>
<script th:src="@{/js/back-end/admin_index.js}"></script>
</body>
</html>
