<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Autopile Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../static/css/back-end/admin_index.css" th:href="@{/css/back-end/admin_index.css}">
    <link rel="stylesheet" th:href="@{/css/back-end/announcement-index.css}">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"></div>
            <h2>卡爾夏 <span class="badge">ADMIN</span></h2>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="menu-item has-submenu"><!-- 改下拉選單加"has-submenu" -->
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>
                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 帳號管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">會員帳號管理</a></li><!--a標籤加class="active"表示已選擇-->
                        <li><a th:href="@{/admins/listAll}">管理員帳號管理</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu"
                    th:classappend="${activePage == 'announcement' || activePage == 'faq'} ? 'open' : ''">

                    <a class="submenu-toggle">
                        <span><i class="fas fa-edit"></i> 內容管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a th:href="@{/admins/announcement}"
                               th:classappend="${activePage == 'announcement'} ? 'active' : ''">
                                公告列表
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/admins/faq}"
                               th:classappend="${activePage == 'faq'} ? 'active' : ''">
                                FAQ 列表
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fas fa-star"></i> 評論管理</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fas fa-headset"></i> 客服管理</a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <form th:action="@{/admins/logout}" method="post" id="logoutForm">
                <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">
                    <i class="fas fa-sign-out-alt"></i> 登出 (Logout)
                </a>
            </form>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">公告管理</h2>
            <div class="user-profile">
                <span>Admin</span>
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </header>

        <div class="content-area">
            <div class="page-header-section">
                <h1>
                    <i class="fas fa-bullhorn"></i>
                    公告列表
                </h1>
                <button class="add-btn" onclick="openAddModal()">
                    <i class="fas fa-plus"></i>
                    新增公告
                </button>
            </div>

            <div class="announcements-table">
                <table>
                    <thead>
                    <tr>
                        <th style="width: 50px;">#</th>
                        <th>標題</th>
                        <th style="width: 100px;">狀態</th>
                        <th style="width: 150px;">建立時間</th>
                        <th style="width: 150px;">更新時間</th>
                        <th style="width: 200px;">操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${announcements == null || announcements.isEmpty()}">
                        <td colspan="6" class="empty-state">
                            <i class="fas fa-inbox"></i>
                            <p>目前沒有公告</p>
                        </td>
                    </tr>

                    <tr th:each="ann, stat : ${announcements}" th:if="${announcements != null && !announcements.isEmpty()}">
                        <td th:text="${stat.count}">1</td>
                        <td><strong th:text="${ann.title}">標題</strong></td>
                        <td>
                            <span th:class="'status-badge ' + (${ann.status} == '發佈' ? 'published' : 'draft')"
                                  th:text="${ann.status}">發佈</span>
                        </td>
                        <td>
                            <span th:text="${ann.create_time != null ? #temporals.format(ann.create_time, 'yyyy/MM/dd 下午 HH:mm') : '-'}">
                                1970/01/01 上午 08:00
                            </span>
                        </td>
                        <td>
                            <span th:text="${ann.update_time != null ? #temporals.format(ann.update_time, 'yyyy/MM/dd 下午 HH:mm') : '-'}">
                                2026/01/12 下午 03:29
                            </span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <button class="btn btn-edit"
                                        th:attr="data-id=${ann.announcement_no}, data-title=${ann.title}, data-content=${ann.content}, data-status=${ann.status}"
                                        onclick="openEditModal(this)">
                                    <i class="fas fa-edit"></i> 編輯
                                </button>

                                <form th:action="@{/admins/announcement/toggle-status}" method="post" style="display: inline;">
                                    <input type="hidden" name="id" th:value="${ann.announcement_no}">
                                    <button type="submit" class="btn btn-toggle"
                                            th:title="${ann.status == '發佈' ? '設為草稿' : '發佈'}">
                                        <i class="fas fa-sync-alt"></i>
                                    </button>
                                </form>

                                <form th:action="@{/admins/announcement/delete}"
                                      method="post"
                                      style="display: inline;"
                                      onsubmit="return confirm('確定要刪除此公告嗎？此操作無法復原。');">
                                    <input type="hidden" name="id" th:value="${ann.announcement_no}">
                                    <button type="submit" class="btn btn-delete">
                                        <i class="fas fa-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<!-- 新增/編輯 Modal -->
<div id="modal-overlay" class="modal-overlay">
    <div class="modal">
        <div class="modal-header">
            <h2 id="modal-title">新增公告</h2>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>

        <!-- 新增表單 -->
        <form id="add-form" th:action="@{/admins/announcement/create}" method="post" style="display: none;">
            <div class="modal-body">
                <div class="form-group">
                    <label for="add-title">公告標題 *</label>
                    <input type="text" id="add-title" name="title" required placeholder="請輸入公告標題">
                </div>

                <div class="form-group">
                    <label for="add-content">公告內容 *</label>
                    <textarea id="add-content" name="content" required placeholder="請輸入公告內容"></textarea>
                </div>

                <div class="form-group">
                    <label for="add-status">狀態 *</label>
                    <select id="add-status" name="status" required>
                        <option value="草稿">草稿</option>
                        <option value="發佈">發佈</option>
                        <option value="歸檔">歸檔</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" class="btn-save">新增</button>
            </div>
        </form>

        <!-- 編輯表單 -->
        <form id="edit-form" th:action="@{/admins/announcement/update}" method="post" style="display: none;">
            <div class="modal-body">
                <input type="hidden" id="edit-id" name="id">

                <div class="form-group">
                    <label for="edit-title">公告標題 *</label>
                    <input type="text" id="edit-title" name="title" required placeholder="請輸入公告標題">
                </div>

                <div class="form-group">
                    <label for="edit-content">公告內容 *</label>
                    <textarea id="edit-content" name="content" required placeholder="請輸入公告內容"></textarea>
                </div>

                <div class="form-group">
                    <label for="edit-status">狀態 *</label>
                    <select id="edit-status" name="status" required>
                        <option value="草稿">草稿</option>
                        <option value="發佈">發佈</option>
                        <option value="歸檔">歸檔</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeModal()">取消</button>
                <button type="submit" class="btn-save">更新</button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/back-end/admin_index.js}"></script>
<script th:src="@{/js/back-end/announcement-index.js}"></script>

</body>
</html>
