<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Autopile Management</title>
    <link rel="stylesheet" th:href="@{/css/back-end/admin_login.css}">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1 class="logo">
                卡爾夏後台
                <span class="badge">管理員</span>
            </h1>
            <p>Management System Dashboard</p>
        </div>
        <div th:if="${not #lists.isEmpty(errorMsgs)}"
             class="error-messages-container">
            <div th:each="msg : ${errorMsgs}" th:text="${msg}"
                 style="margin-bottom: 5px;"></div>
        </div>

        <form th:action="@{/admins/login}" method="post">

            <div th:if="${param.error}" style="color: red; text-align: center; margin-bottom: 10px;">
                帳號或密碼錯誤
            </div>
            <div th:if="${param.logout}" style="color: green; text-align: center; margin-bottom: 10px;">
                您已成功登出
            </div>

            <div class="form-group">
                <label for="admin-username">Account (帳號)</label>
                <input type="text" id="admin-username" name="adminAcc"
                       th:value="${adminAcc}" placeholder="請輸入管理員帳號"
                       required autocomplete="off">
            </div>

            <div class="form-group">
                <label for="admin-password">Password (密碼)</label>
                <input type="password" id="admin-password" name="adminPwd"
                       placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="submit-btn">登入</button>

            <!-- <div class="form-footer">
                <a href="#">Forgot password?</a>
                <a href="index.html" class="back-link">← Back to Main Store</a>
            </div> -->
        </form>
    </div>

</body>
</html>
