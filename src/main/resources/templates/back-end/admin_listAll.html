<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - 卡爾夏 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/admin_listAll.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/admin_sidebar.css}">
</head>
<body>

    <div class="app-container">

        <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='listAll')}"></aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 class="page-title">管理員帳號管理</h2>
                <div class="user-profile">
                    <span th:text="${session.admin.adminName}">Admin</span>
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>

            <div class="content-body">
                    <div class="card">
                        <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                            <h3>管理者列表</h3>

                            <form th:action="@{/admins/search}" method="get" style="display: flex; gap: 10px;">
                                <input type="text" name="keyword" th:value="${keyword}"
                                       placeholder="輸入管理員名稱..."
                                       class="form-input"
                                       style="padding: 5px; border: 1px solid #ddd; border-radius: 4px;">

                                <button type="submit" class="btn-primary" style="padding: 5px 15px; cursor: pointer;">
                                    <i class="fas fa-search"></i> 搜尋
                                </button>

                                <a th:href="@{/admins/listAll}" class="btn"
                                   style="background:#ddd; color:#333; text-decoration:none; padding: 5px 15px; border-radius: 4px; display: flex; align-items: center;">
                                    重置
                                </a>
                            </form>
                        </div>
                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>姓名</th>
                                    <th>帳號</th>
                                    <th>信箱</th>
                                    <th>創建日期</th>
                                    <th>更新日期</th>
                                    <th>資料編輯</th>
                                    <th>狀態</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body">
                                <tr th:each="a : ${adminPage}">
                                    <td style="display: flex; align-items: center; gap: 10px; border-bottom: none;">
                                        <span th:text="${a.adminName}"></span>
                                    </td>
                                    <td th:text="${a.adminAcc}"></td>
                                    <td th:text="${a.adminEmail}"></td>
                                    <td th:text="${#dates.format(a.adminCreatedAt,'yyyy-MM-dd')}"></td>
                                    <td th:text="${#dates.format(a.adminUpdatedAt,'yyyy-MM-dd')}"></td>

                                    <td>
                                        <a th:href="@{/admins/edit(adminNo=${a.adminNo})}" class="action-link">
                                            <i class="fas fa-edit"></i> 編輯資料
                                        </a>
                                    </td>
                                    <td th:text="${a.adminStatus == 1 ? '正常' : '停權'}"></td>
                                </tr>
                                </tbody>
                        </table>
                    </div>

                    <div class="card-footer" style="display: flex; justify-content: space-between; align-items: center;">

                        <div class="pagination-container" th:if="${adminPage.totalPages > 0}">
                            <ul class="pagination" style="list-style: none; display: flex; gap: 10px; padding: 0;">

                                <li th:classappend="${adminPage.first} ? 'disabled'">
                                    <a th:href="@{${keyword != null && keyword != '' ? '/admins/search' : '/admins/listAll'}(page=${adminPage.first ? 0 : adminPage.number - 1}, keyword=${keyword})}"
                                       style="text-decoration: none; padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">
                                        &laquo; 上一頁
                                    </a>
                                </li>

                                <li>
                                    <span th:text="${'第 ' + (adminPage.number + 1) + ' 頁 / 共 ' + adminPage.totalPages + ' 頁'}"></span>
                                </li>

                                <li th:classappend="${adminPage.last} ? 'disabled'">
                                    <a th:href="@{${keyword != null && keyword != '' ? '/admins/search' : '/admins/listAll'}(page=${adminPage.last ? adminPage.number : adminPage.number + 1}, keyword=${keyword})}"
                                       style="text-decoration: none; padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px;">
                                        下一頁 &raquo;
                                    </a>
                                </li>
                            </ul>
                        </div>

                        <button class="btn-primary" th:onclick="|window.location.href='@{/admins/add}'|">+ 新增管理者</button>
                    </div>
                </div>

            </div>
        </main>
    </div>
    <script th:src="@{/js/back-end/admin_index.js}"></script>
</body>
</html>
