<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯車種類別 - 卡爾夏 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/prodcategory/prod_category.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/admin_sidebar.css}">
</head>
<body>

<div class="app-container">

    <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='prodcate')}"></aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">編輯商品類別</h2>
            <div class="user-profile"><span>Admin</span><div class="avatar"><i class="fas fa-user"></i></div></div>
        </header>

        <div class="content-body">
            <div class="card">
                <div class="card-header">
                    <h3 th:text="'編輯資訊 (編號: ' + *{productCategoryNo} + ')' "th:object="${prodCategoryVO}"></h3>
                </div>

                <div class="form-container">
                    <form th:action="@{/admins/prodcate/update}" th:object="${prodCategoryVO}" method="post">

                        <input type="hidden" th:field="*{productCategoryNo}" />

                        <div class="form-row">
                            <label for="carName">商品分類名稱</label>
                            <input type="text" id="carName" th:field="*{productCategoryName}">
                            <span class="error-msg" th:if="${#fields.hasErrors('productCategoryName')}" th:errors="*{productCategoryName}"></span>
                        </div>

                        <div class="form-actions">
                            <a th:href="@{/admins/prodcate/list}" class="btn-secondary">取消</a>
                            <button type="submit" class="btn-primary">保存修改</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
