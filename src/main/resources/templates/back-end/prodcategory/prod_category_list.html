<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品類別管理 - 卡爾夏 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/prodcategory/prod_category.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/admin_sidebar.css}">
</head>
<body>

<div class="app-container">

    <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='prodcate')}"></aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">商品類別管理</h2>
            <div class="user-profile">
                <span>Admin</span>
                <div class="avatar"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="content-body">

            <div class="card">
                <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <h3>商品類別列表</h3>

                    <form th:action="@{/admins/prodcate/list}" method="get" style="display: flex; gap: 10px;">
                        <input type="text" name="keyword" th:value="${keyword}"
                               placeholder="輸入類別名稱..."
                               class="form-input"
                               style="padding: 5px; border: 1px solid #ddd; border-radius: 4px;">

                        <button type="submit" class="btn-primary" style="padding: 5px 15px; cursor: pointer;">
                            <i class="fas fa-search"></i> 搜尋
                        </button>

                        <a th:href="@{/admins/prodcate/list}" class="btn"
                           style="background:#ddd; color:#333; text-decoration:none; padding: 5px 15px; border-radius: 4px; display: flex; align-items: center;">
                            重置
                        </a>
                    </form>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>編號</th>
                            <th>商品類別名稱</th>
                            <th>操作</th>
                            <th style="width: 150px;"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="prod : ${prodList}">
                            <td th:text="${prod.productCategoryNo}"></td>
                            <td th:text="${prod.productCategoryName}"></td>
                            <td class="action-cell">
                                <a th:href="@{/admins/prodcate/edit/{id}(id=${prod.productCategoryNo})}" class="action-link">
                                    <i class="fas fa-edit"></i> 編輯
                                </a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(prodList)}">
                            <td colspan="5" style="text-align:center; color:#888;">目前沒有任何商品類別資料</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer">
                    <button class="btn-primary" th:onclick="|window.location.href='@{add}'|">
                        <i class="fas fa-plus"></i> 新增商品類別
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    document.querySelectorAll('.submenu-toggle').forEach(item => {
        item.addEventListener('click', event => {
            item.parentElement.classList.toggle('open');
        });
    });
</script>
</body>
</html>
