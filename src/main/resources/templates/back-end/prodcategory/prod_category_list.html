<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商品類別管理 - 卡爾夏 Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/prodcategory/prod_category.css}">
</head>
<body>

<div class="app-container">

    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon"></div>
            <h2>卡爾夏 <span class="badge">ADMIN</span></h2>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="menu-item">
                    <a href="#"><i class="fas fa-tachometer-alt"></i> 儀錶板</a>
                </li>
                <li class="menu-item has-submenu open">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-car"></i> 分類管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">車種類別管理</a></li>
                        <li><a href="#" class="active">商品類別管理</a></li>
                    </ul>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="#"><i class="fas fa-sign-out-alt"></i> 登出 (Logout)</a>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">商品類別管理</h2>
            <div class="user-profile">
                <span>Admin</span>
                <div class="avatar"><i class="fas fa-user"></i></div>
            </div>
        </header>

        <div class="content-body">

            <div class="card">
                <div class="card-header">
                    <h3>商品類別列表</h3>
                </div>

                <div class="table-container">
                    <table class="data-table">
                        <thead>
                        <tr>
                            <th>編號</th>
                            <th>商品類別名稱</th>
                            <th style="width: 150px;"></th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="prod : ${prodList}">
                            <td th:text="${prod.productCategoryNo}"></td>
                            <td th:text="${prod.productCategoryName}"></td>
                            <td class="action-cell">
                                <a th:href="@{/admins/prodcate/edit/{id}(id=${prod.productCategoryNo})}" class="action-link">
                                    <i class="fas fa-edit"></i> 編輯
                                </a>

                                <form th:action="@{/admins/prodcate/delete/{id}(id=${prod.productCategoryNo})}" method="post" style="display:inline;" onsubmit="return confirm('確定要刪除嗎？');">
                                    <button type="submit" class="delete-btn-icon">
                                        <i class="fas fa-trash-alt"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(prodList)}">
                            <td colspan="5" style="text-align:center; color:#888;">目前沒有任何商品類別資料</td>
                        </tr>
                        </tbody>
                    </table>
                </div>

                <div class="card-footer">
                    <button class="btn-primary" th:onclick="|window.location.href='@{add}'|">
                        <i class="fas fa-plus"></i> 新增商品類別
                    </button>
                </div>
            </div>

        </div>
    </main>
</div>

<script>
    document.querySelectorAll('.submenu-toggle').forEach(item => {
        item.addEventListener('click', event => {
            item.parentElement.classList.toggle('open');
        });
    });
</script>
</body>
</html>
