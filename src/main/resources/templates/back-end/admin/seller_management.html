<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>賣家管理 - Karshop Admin</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <link rel="stylesheet" th:href="@{/css/back-end/admin/seller_management.css}">
  <link rel="stylesheet" th:href="@{/css/fragments/admin_sidebar.css}">

</head>
<body>

<div class="app-container">

  <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='sellers')}"></aside>

  <main class="main-content">
    <header class="top-bar">
      <h2 class="page-title">帳號管理 / 賣家管理</h2>
      <div class="user-profile">
        <span>Admin</span>
        <div class="avatar"><i class="fas fa-user"></i></div>
      </div>
    </header>

    <div class="content-card">

      <form th:action="@{/admin/sellers}" method="get" class="search-area">
        <input type="text" name="keyword" th:value="${keyword}" class="form-input" placeholder="輸入賣家名稱或Email..." style="width: 250px;">

        <select name="status" class="form-input">
          <option value="">-- 所有狀態 --</option>
          <option value="待審核" th:selected="${status == '待審核'}">待審核</option>
          <option value="已開通" th:selected="${status == '已開通'}">已開通</option>
          <option value="未通過" th:selected="${status == '未通過'}">未通過</option>
          <option value="停權" th:selected="${status == '停權'}">停權</option>
        </select>

        <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 搜尋</button>
        <a th:href="@{/admin/sellers}" class="btn" style="background:#ddd; color:#333; text-decoration:none;">重置</a>
      </form>

      <table class="admin-table">
        <thead>
        <tr>
          <th>ID</th>
          <th>商店名稱</th> <th>聯絡人</th>   <th>Email</th>
          <th>狀態</th>
          <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="seller : ${sellerList}">
          <td th:text="${seller.sellerNo}">101</td>

          <td th:text="${seller.shopName != null ? seller.shopName : '未設定'}" style="font-weight:bold;">Karshop</td>

          <td th:text="${seller.sellerName}">王小明</td>

          <td th:text="${seller.sellerEmail}">abc@gmail.com</td>

          <td>
            <span th:if="${seller.sellerStatus == '待審核'}" class="status-badge status-wait">待審核</span>
            <span th:if="${seller.sellerStatus == '已開通'}" class="status-badge status-ok">已開通</span>
            <span th:if="${seller.sellerStatus == '未通過'}" class="status-badge" style="background:#f0f0f0; color:#666; border:1px solid #ccc;">未通過</span>
            <span th:if="${seller.sellerStatus == '停權'}" class="status-badge status-block">停權</span>
          </td>
          <td>
            <button type="button" class="btn btn-sm btn-info"
                    th:data-id="${seller.sellerNo}"
                    th:data-shop="${seller.shopName}"
                    th:data-contact="${seller.sellerName}"
                    th:data-email="${seller.sellerEmail}"
                    th:data-phone="${seller.phone}"
                    th:data-address="${seller.address}"
                    th:data-desc="${seller.description}"
                    th:data-image="${seller.imagePath}"
                    th:data-tax="${seller.sellerTaxId}"
                    th:data-bank="${seller.bankAccount}"
                    th:data-status="${seller.sellerStatus}"
                    th:data-verified="${seller.verified}"
                    th:data-time="${seller.createTime}"
                    onclick="openAuditModal(this)">
              <i class="fas fa-file-contract"></i>
              <span th:text="${seller.sellerStatus == '待審核' ? '審核' : '詳情'}"></span>
            </button>
          </td>
        </tr>
        </tbody>
      </table>

      <div id="auditModal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="width: 700px;">
          <div class="modal-header">
            <h3 id="modalTitle">賣家資料審核</h3>
            <span class="close-btn" onclick="closeAuditModal()">&times;</span>
          </div>

          <div class="modal-body">

            <div style="display: flex; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px dashed #eee;">
              <div style="width: 120px; text-align: center;">
                <img id="m_image" src="" alt="賣場頭像"
                     style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #eee; background: #f0f0f0;">
                <div id="m_verified_badge" style="margin-top: 5px; font-size: 12px; color: #28a745; display: none;">
                  <i class="fas fa-check-circle"></i> 已實名認證
                </div>
              </div>

              <div style="flex: 1;">
                <div style="font-size: 12px; color: #888;">商店名稱</div>
                <div id="m_shopName" style="font-size: 20px; font-weight: bold; color: #333; margin-bottom: 5px;"></div>

                <div style="font-size: 12px; color: #888;">賣場描述</div>
                <div id="m_description" style="font-size: 14px; color: #666; background: #f9f9f9; padding: 8px; border-radius: 4px; min-height: 40px;"></div>
              </div>
            </div>

            <div class="info-grid">
              <div class="info-item">
                <label>賣家編號</label>
                <span id="m_sellerNo"></span>
              </div>
              <div class="info-item">
                <label>申請時間</label>
                <span id="m_createTime"></span>
              </div>

              <div class="info-item">
                <label>聯絡人姓名</label>
                <span id="m_contactName"></span>
              </div>
              <div class="info-item">
                <label>聯絡電話</label>
                <span id="m_phone"></span>
              </div>

              <div class="info-item full-width">
                <label>通訊地址</label>
                <span id="m_address"></span>
              </div>

              <div class="info-item">
                <label>聯絡信箱</label>
                <span id="m_email"></span>
              </div>
              <div class="info-item">
                <label>統一編號 (Tax ID)</label>
                <span id="m_taxId"></span>
              </div>

              <div class="info-item full-width">
                <label>銀行帳號 (撥款用)</label>
                <span id="m_bankAccount" style="color: #0066cc; font-family: monospace; font-size: 1.1em;"></span>
              </div>

              <div class="info-item">
                <label>目前狀態</label>
                <span id="m_status" class="status-badge"></span>
              </div>
            </div>

            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

            <div class="action-area" style="text-align: right;">

              <form id="formApprove" th:action="@{/admin/sellers/updateStatus}" method="post" style="display: inline-block;">
                <input type="hidden" name="sellerNo" id="input_sellerNo_approve">
                <input type="hidden" name="status" value="已開通">
                <button type="submit" class="btn btn-success" onclick="return confirm('確定資料無誤，允許開通？')">
                  <i class="fas fa-check-circle"></i> 通過
                </button>
              </form>

              <form id="formReject" th:action="@{/admin/sellers/updateStatus}" method="post" style="display: inline-block;">
                <input type="hidden" name="sellerNo" id="input_sellerNo_reject">
                <input type="hidden" name="status" value="未通過"> <button type="submit" class="btn" style="background: #ff9800; color: white;" onclick="return confirm('確定要駁回此申請？賣家將可修改資料重送。')">
                <i class="fas fa-times-circle"></i> 駁回申請
              </button>
              </form>

              <form id="formBan" th:action="@{/admin/sellers/updateStatus}" method="post" style="display: inline-block;">
                <input type="hidden" name="sellerNo" id="input_sellerNo_ban">
                <input type="hidden" name="status" value="停權">
                <button type="submit" class="btn btn-danger" onclick="return confirm('確定要停權此賣家？')">
                  <i class="fas fa-ban"></i> 停權
                </button>
              </form>

              <button type="button" class="btn" onclick="closeAuditModal()" style="background: #eee; color: #555; margin-left: 10px;">取消</button>
            </div>

          </div>
        </div>
      </div>

      <div th:if="${#lists.isEmpty(sellerList)}" style="text-align:center; padding: 40px; color: #999;">
        <i class="fas fa-inbox" style="font-size: 30px; margin-bottom: 10px;"></i>
        <p>沒有符合條件的賣家資料</p>
      </div>
    </div>

  </main>
</div>

<script th:src="@{/js/back-end/admin/seller_management.js}"></script>

</body>
</html>
