<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>訂單詳情 | 賣家中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/seller/listOneOrder.css}">
</head>
<body>

<div class="container">

    <div class="header-section">
        <div>
            <a th:href="@{/product/dashboard(tab=orders)}" class="btn-back">
                <i class="fas fa-arrow-left"></i> 返回訂單列表
            </a>
            <div style="margin-top: 10px; display: flex; align-items: baseline;">
                <h1 class="order-title">訂單詳情</h1>
                <span th:text="'#' + ${ordVO.ordNo}" class="order-id">#408</span>
            </div>
        </div>

        <span th:text="${ordVO.ordStatus}"
              th:classappend="${
                  ordVO.ordStatus == '待出貨' ? 'processing' :
                  (ordVO.ordStatus == '已出貨' ? 'shipped' :
                  (ordVO.ordStatus == '已完成' ? 'success' :
                  'danger'))
              }"
              class="status-badge"
              style="font-size: 16px; padding: 8px 16px;">
        </span>
    </div>

    <div class="info-grid">
        <div class="info-card">
            <div class="card-title"><i class="far fa-calendar-alt"></i> 訂單資訊</div>
            <div class="info-row">
                <span class="info-label">下單日期</span>
                <span th:text="${#temporals.format(ordVO.ordDate, 'yyyy-MM-dd HH:mm')}" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">買家會員 ID</span>
                <span th:text="${ordVO.member.memberNo}" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">優惠券編號</span>
                <span th:text="${ordVO.couponNo != null ? ordVO.couponNo : '-'}" class="info-value"></span>
            </div>
        </div>

        <div class="info-card">
            <div class="card-title"><i class="fas fa-truck"></i> 物流配送</div>
            <div class="info-row">
                <span class="info-label">配送方式</span>
                <span th:text="${ordVO.ordShipMethod}" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">物流單號</span>
                <span th:text="${ordVO.ordShipNo != null ? ordVO.ordShipNo : '尚未產生'}"
                      class="info-value"
                      th:style="${ordVO.ordShipNo == null ? 'color: #aaa;' : ''}"></span>
            </div>
            <div class="info-row">
                <span class="info-label">收件人</span>
                <span th:text="${ordVO.ordRecipient}" class="info-value"></span>
            </div>
            <div class="info-row" style="flex-direction: column; gap:5px;">
                <span class="info-label">收件地址</span>
                <span th:text="${ordVO.ordAddress}" class="info-value" style="text-align: left; line-height: 1.4;"></span>
            </div>
        </div>

        <div class="info-card">
            <div class="card-title"><i class="far fa-credit-card"></i> 付款詳情</div>
            <div class="info-row">
                <span class="info-label">付款方式</span>
                <span th:text="${ordVO.ordPaymentMethod}" class="info-value"></span>
            </div>
            <div class="info-row">
                <span class="info-label">付款狀態</span>
                <span th:text="${ordVO.ordPaymentStatus}"
                      th:classappend="${ordVO.ordPaymentStatus == '已付款' ? 'success' : 'danger'}"
                      class="status-badge">
                </span>
            </div>
        </div>
    </div>

    <h3 style="margin-bottom: 15px; font-size: 18px;">商品明細</h3>
    <div class="product-section">
        <table class="detail-table">
            <thead>
            <tr>
                <th style="width: 50%;">商品名稱</th>
                <th style="width: 15%; text-align: center;">單價</th>
                <th style="width: 15%; text-align: center;">數量</th>
                <th style="width: 20%; text-align: right;">小計</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="orderDetail : ${ordVO.orderDetail}">
                <td>
                    <div class="product-info">
                        <div class="img-box">
                            <img th:src="@{/product/displayMain(prodNo=${orderDetail.product.prodNo})}"
                                 class="product-img">
                        </div>

                        <span th:text="${orderDetail.product.prodName}"></span>
                    </div>
                </td>
                <td th:text="${'$' + #numbers.formatInteger(orderDetail.price, 1, 'COMMA')}" style="text-align: center;"></td>
                <td th:text="${orderDetail.quantity}" style="text-align: center;"></td>
                <td th:text="${'$' + #numbers.formatInteger(orderDetail.price * orderDetail.quantity, 1, 'COMMA')}" style="text-align: right;"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="summary-section">
        <div class="summary-box">

            <div class="summary-row">
                <span class="info-label">商品總額</span>
                <span th:text="${'$' + #numbers.formatInteger(ordVO.originPrice, 1, 'COMMA')}" class="info-value"></span>
            </div>
            <div class="summary-row">
                <span class="info-label">折扣金額</span>
                <span th:text="'- $' + ${#numbers.formatInteger(ordVO.discountPrice, 1, 'COMMA')}"
                      class="info-value highlight-red"></span>
            </div>

            <div class="summary-row" style="border-bottom: 1px dashed var(--border-color); padding-bottom: 15px; margin-bottom: 15px;">
                <span class="info-label" style="color: #fff;">訂單總金額</span>
                <span th:text="${'$' + #numbers.formatInteger(ordVO.ordPrice, 1, 'COMMA')}"
                      class="info-value" style="font-weight: bold;"></span>
            </div>

            <div class="summary-row">
                <span class="info-label">平台手續費 (5%)</span>
                <span th:text="'- $' + ${#numbers.formatInteger(ordVO.platformFee, 1, 'COMMA')}"
                      class="info-value" style="color: #ff5252;"></span>
            </div>

            <div class="summary-row total">
                <span>預計實收金額</span>
                <span th:text="${'$' + #numbers.formatInteger(ordVO.sellerNetIncome, 1, 'COMMA')}"
                      class="highlight-green"></span>
            </div>

        </div>
    </div>

</div>

</body>
</html>
