<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>商品詳情 | 賣家中心</title>
   <link rel="stylesheet" th:href="@{/back-end/css/listOneProduct.css}">
</head>
<body>

<div class="detail-card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
        <h2>商品詳情明細</h2>
        <a th:href="@{/product/dashboard(tab=products)}" class="btn btn-secondary">← 返回列表</a>
    </div>

    <div class="info-group">
        <div class="label">商品名稱 Product Name</div>
        <div class="value" th:text="${productVO.prodName}"></div>
    </div>

    <div style="display: flex; gap: 40px;">
        <div class="info-group" style="flex: 1;">
            <div class="label">價格 Price</div>
            <div class="value" th:text="'$ ' + ${productVO.prodPrice}"></div>
        </div>
        <div class="info-group" style="flex: 1;">
            <div class="label">庫存 Stock</div>
            <div class="value" th:text="${productVO.prodQty}"></div>
        </div>
    </div>

    <div class="info-group">
        <div class="label">商品描述 Description</div>
        <div class="value" style="white-space: pre-wrap;" th:text="${productVO.prodDesc}"></div>
    </div>

    <div class="info-group" style="border-bottom: none;">
        <div class="label">商品圖片 Gallery</div>
        <div class="gallery">
            <th:block th:each="piVO : ${productVO.productImage}">
                <div class="img-box">
                    <img th:src="@{/product/displayDetail(imgNo=${piVO.imgNo})}" alt="商品圖">
                </div>
            </th:block>
        </div>
    </div>

    <div class="btn-group">
        <a th:href="@{/product/getOne_For_Update(prodNo=${productVO.prodNo})}" class="btn btn-primary">再次編輯</a>
        <a th:href="@{/product/dashboard}" class="btn btn-secondary">回首頁</a>
    </div>
</div>

</body>
</html>
