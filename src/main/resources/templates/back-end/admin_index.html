<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Autopile Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="../../static/css/back-end/admin_index.css" th:href="@{/css/back-end/admin_index.css}">
</head>

<body>

    <div class="app-container">

        <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='home')}"></aside>

        <main class="main-content">
            <header class="top-bar">
                <h2 class="page-title">頁首頭</h2>
                <div class="user-profile">
                    <span th:text="${session.admin.adminName}">Admin</span>
                    <div class="avatar">
                        <i class="fas fa-user"></i>
                    </div>
                </div>
            </header>
        </main>
    </div>

    <script th:src="@{/js/back-end/admin_index.js}"></script>
</body>

</html>
