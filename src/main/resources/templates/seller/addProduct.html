<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>新增商品 | 賣家中心</title>
    <style>
        /* --- 1. 核心變數 --- */
        :root {
            --bg-dark-top: #050505;
            --bg-dark-bottom: #1a0505;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --accent-purple: #7d5fff;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        /* --- 2. 全局樣式 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }

        body {
            background: linear-gradient(180deg, var(--bg-dark-top) 0%, var(--bg-dark-bottom) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* --- 3. Header --- */
        .top-bar {
            height: 70px;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; border-bottom: 1px solid var(--border-color);
            background: rgba(0,0,0,0.3); backdrop-filter: blur(10px);
        }
        .brand-area { display: flex; align-items: center; gap: 10px; font-weight: bold; font-size: 18px; }
        .logo-icon { width: 12px; height: 12px; background: var(--accent-purple); border-radius: 50%; box-shadow: 0 0 10px var(--accent-purple); }
        .user-profile { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 8px; }
        .user-avatar { width: 30px; height: 30px; background: #333; border-radius: 50%; border: 1px solid var(--border-color); }

        /* --- 4. Main Content --- */
        .main-content {
            flex: 1; display: flex; justify-content: center; align-items: flex-start;
            padding: 40px 20px;
        }

        .form-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 40px;
            width: 100%; max-width: 600px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s ease;
        }

        .form-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 30px; padding-bottom: 15px; border-bottom: 1px solid var(--border-color);
        }
        .form-header h2 { font-size: 24px; font-weight: 600; margin: 0; }

        .btn-back {
            text-decoration: none; color: var(--text-secondary); font-size: 14px;
            padding: 6px 12px; border: 1px solid var(--border-color); border-radius: 4px;
            transition: all 0.2s; display: flex; align-items: center; gap: 5px;
        }
        .btn-back:hover { color: #fff; border-color: var(--accent-purple); background: rgba(125, 95, 255, 0.1); }

        /* --- 5. Form Elements --- */
        .form-group { margin-bottom: 25px; }

        .form-control {
            width: 100%; padding: 12px 15px; background: #0a0a0a;
            border: 1px solid var(--border-color); border-radius: 6px;
            color: #fff; font-size: 14px; transition: all 0.3s ease; margin-top: 8px;
        }
        .form-control:focus { outline: none; border-color: var(--accent-purple); box-shadow: 0 0 0 2px rgba(125, 95, 255, 0.2); }

        /* 新增：Textarea 專用樣式 */
        textarea.form-control {
            min-height: 120px; /* 預設高度 */
            resize: vertical;  /* 允許使用者垂直拉伸，但不允許水平拉伸破壞版面 */
            line-height: 1.5;
        }

        /* File Upload Styling */
        input[type="file"] {
            margin-top: 8px; padding: 10px; background: rgba(255,255,255,0.02);
            border-radius: 6px; border: 1px dashed var(--border-color);
            width: 100%; color: var(--text-secondary); cursor: pointer;
        }
        input[type="file"]::file-selector-button {
            background: #333; border: none; color: white; padding: 6px 10px;
            margin-right: 15px; border-radius: 4px; cursor: pointer; transition: 0.2s;
        }
        input[type="file"]::file-selector-button:hover { background: var(--accent-purple); }

        /* Image Preview Styles */
        #preview-container {
            display: flex; flex-wrap: wrap; gap: 15px; margin-top: 15px;
        }
        .preview-img-box {
            position: relative; width: 100px; height: 100px; border-radius: 8px; overflow: hidden;
            border: 1px solid var(--border-color); background: #000; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            animation: fadeIn 0.3s ease;
        }
        .preview-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .btn-remove-img {
            position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
            background: rgba(255, 0, 0, 0.7); color: white; border: none; border-radius: 50%;
            font-size: 12px; font-weight: bold; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s; z-index: 10;
        }
        .btn-remove-img:hover { background: red; transform: scale(1.1); }

        /* Submit Button */
        .btn-submit {
            width: 100%; padding: 15px; background: var(--accent-purple);
            color: white; border: none; border-radius: 6px;
            font-size: 16px; font-weight: bold; cursor: pointer;
            transition: all 0.3s ease; margin-top: 10px; text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-submit:hover { background: #6c4ce5; box-shadow: 0 0 20px rgba(125, 95, 255, 0.4); transform: translateY(-2px); }

        /* --- 6. Footer --- */
        .site-footer {
            background: #080101; border-top: 1px solid var(--border-color); padding: 40px; margin-top: auto;
            display: flex; justify-content: space-between; flex-wrap: wrap; gap: 40px;
        }
        .footer-brand { display: flex; align-items: center; gap: 15px; font-size: 24px; font-weight: bold; color: #fff; min-width: 200px; }
        .toggle-icon { width: 40px; height: 20px; background: #fff; border-radius: 20px; position: relative; }
        /*.toggle-icon::after { content: ''; position: absolute; left: 2px; top: 2px; width: 16px; height: 16px; background: #000; border-radius: 50%; }*/
        .footer-links { display: flex; gap: 80px; flex-wrap: wrap; }
        .footer-col { display: flex; flex-direction: column; gap: 15px; }
        .footer-col h4 { color: #fff; font-size: 16px; font-weight: 600; margin-bottom: 5px; }
        .footer-col a { color: #a0a0a0; text-decoration: none; font-size: 14px; transition: color 0.2s; }
        .footer-col a:hover { color: #fff; text-decoration: underline; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="brand-area" onclick="location.href='/seller/index'" style="cursor: pointer;">
        <div class="logo-icon"></div> SELLER CENTER
    </div>
    <div class="user-profile">
        <div class="user-avatar"></div>
        <span>賣家帳號</span>
    </div>
</header>

<main class="main-content">

    <div class="form-card">
        <div class="form-header">
            <h2>新增商品 Add Product</h2>
            <a th:href="@{/product/dashboard}" class="btn-back">← 返回列表</a>
        </div>

        <form th:action="@{/product/insert}" th:object="${productVO}" method="post" enctype="multipart/form-data">

            <div class="form-group">
                <label style="color:#ccc; font-size:14px;">商品名稱 Product Name</label>
                <input type="text" class="form-control" th:field="*{prodName}" placeholder="請輸入商品名稱" required/>
            </div>

            <div class="form-group">
                <label style="color:#ccc; font-size:14px;">商品價格 Price</label>
                <input type="number" class="form-control" th:field="*{prodPrice}" placeholder="請輸入價格" required/>
            </div>

            <div class="form-group">
                <label style="color:#ccc; font-size:14px;">商品資訊 Description</label>
                <textarea class="form-control" th:field="*{prodDesc}" placeholder="請輸入商品詳細資訊..." required></textarea>
            </div>

            <div class="form-group">
                <label style="color:#ccc; font-size:14px;">上傳圖片 Upload Image</label>
                <input type="file" name="upFile" id="fileInput" multiple accept="image/*"/>
                <div id="preview-container"></div>
            </div>

            <button type="submit" class="btn-submit">確認上架 Submit</button>
        </form>
    </div>

</main>

<footer class="site-footer">
    <div class="footer-brand">
        <div class="toggle-icon"></div>
        <span>卡爾夏</span>
    </div>
    <div class="footer-links">
        <div class="footer-col">
            <h4>Shop</h4>
            <a href="#">Shop Parts</a>
            <a href="#">Wholesale</a>
        </div>
        <div class="footer-col">
            <h4>The Company</h4>
            <a href="#">About Us</a>
            <a href="#">FAQ</a>
        </div>
        <div class="footer-col">
            <h4>Contact Us</h4>
            <a href="#">info@mysite.com</a>
        </div>
        <div class="footer-col">
            <h4>Follow Us</h4>
            <a href="#">Instagram</a>
        </div>
    </div>
</footer>

<script>
    const fileInput = document.getElementById('fileInput');
    const previewContainer = document.getElementById('preview-container');

    const dataTransfer = new DataTransfer();

    fileInput.addEventListener('change', function(e) {
        const files = e.target.files;

        if (files) {
            Array.from(files).forEach(file => {
                if (file.type.match('image.*')) {

                    dataTransfer.items.add(file);

                    const imgBox = document.createElement('div');
                    imgBox.className = 'preview-img-box';

                    const img = document.createElement('img');
                    const reader = new FileReader();
                    reader.onload = function(event) {
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn-remove-img';
                    removeBtn.innerHTML = '×';

                    removeBtn.onclick = function(evt) {
                        evt.preventDefault();
                        imgBox.remove();
                        updateFileInput(file.name);
                    };

                    imgBox.appendChild(img);
                    imgBox.appendChild(removeBtn);
                    previewContainer.appendChild(imgBox);
                }
            });
        }
        fileInput.files = dataTransfer.files;
    });

    function updateFileInput(fileNameToRemove) {
        const newDataTransfer = new DataTransfer();
        Array.from(dataTransfer.files).forEach(file => {
            if (file.name !== fileNameToRemove) {
                newDataTransfer.items.add(file);
            }
        });
        dataTransfer.items.clear();
        Array.from(newDataTransfer.files).forEach(file => dataTransfer.items.add(file));
        fileInput.files = dataTransfer.files;
    }
</script>

</body>
</html>
