<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>修改會員資料 | 卡爾夏管理系統</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary-dark: #2c3e50;
            --accent-blue: #3498db;
            --bg-gray: #f8f9fa;
            --error-color: #e74c3c;
        }

        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-gray);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .edit-card {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
        }

        .card-header {
            background: var(--primary-dark);
            color: white;
            padding: 20px 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
        }

        .card-header h2 {
            margin: 0;
        }

        /* 表單必須是 flex 容器 */
        form {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        /* 可滾動的內容區域 */
        .card-body {
            padding: 30px;
            overflow-y: auto;
            overflow-x: hidden;
            flex: 1;
            min-height: 0;
        }

        /* 自訂滾動條樣式 */
        .card-body::-webkit-scrollbar {
            width: 8px;
        }

        .card-body::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        .card-body::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 4px;
        }

        .card-body::-webkit-scrollbar-thumb:hover {
            background: #a8a8a8;
        }

        /* 佈局佈置 */
        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .full-width {
            grid-column: span 2;
        }

        /* 表單元素 */
        .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 0.9em;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            transition: 0.3s;
            font-size: 0.95em;
        }

        input:focus, select:focus {
            border-color: var(--accent-blue);
            outline: none;
            box-shadow: 0 0 5px rgba(52,152,219,0.3);
        }

        /* 唯讀樣式 */
        .readonly-field {
            background: #eee;
            cursor: not-allowed;
            color: #777;
        }

        .info-text {
            padding: 12px;
            color: #666;
            font-size: 0.95em;
            border-left: 4px solid #ddd;
            background: #fdfdfd;
            border-radius: 5px;
        }

        /* 頭像上傳區 */
        .avatar-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            background: #fcfcfc;
            border-radius: 10px;
            border: 1px dashed #ccc;
        }

        .avatar-preview {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 15px;
        }

        /* 錯誤訊息 */
        .error-msg {
            background-color: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
            display: flex;
            gap: 10px;
            align-items: flex-start;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 0.8em;
            margin-top: 5px;
            display: block;
        }

        /* 按鈕區塊 - 固定在底部 */
        .btn-group {
            margin: 0;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
            border-top: 1px solid #eee;
            padding: 20px 30px;
            background-color: #fdfdfd;
            flex-shrink: 0;
        }

        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.95em;
        }

        .btn-save {
            background: var(--accent-blue);
            color: white;
        }

        .btn-cancel {
            background: #95a5a6;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* 響應式調整 */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .edit-card {
                max-height: 95vh;
            }

            .card-body {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .btn-group {
                padding: 15px 20px;
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }

        select[name="accountStatus"][value="0"] { border-left: 5px solid #95a5a6; }
        select[name="accountStatus"][value="1"] { border-left: 5px solid #2ecc71; }
        select[name="accountStatus"][value="2"] { border-left: 5px solid #e74c3c; }
    </style>
</head>
<body>

<div class="edit-card">
    <div class="card-header">
        <i class="fas fa-id-card fa-lg"></i>
        <h2>編輯會員資料</h2>
    </div>

    <form th:action="@{/memberInfo/update}" th:object="${member}" method="post" enctype="multipart/form-data">
        <div class="card-body">
            <input type="hidden" th:field="*{memberNo}" />
            <input type="hidden" th:field="*{ratingAmount}" />
            <input type="hidden" th:field="*{ratingStar}" />
            <input type="hidden" th:field="*{registrationTime}" />

            <div class="form-grid">
                <div class="form-group">
                    <label>會員帳號 (不可修改)</label>
                    <input type="text" th:field="*{memberAccount}" class="readonly-field" readonly />
                </div>

                <div class="form-group">
                    <label>會員暱稱</label>
                    <input type="text" th:field="*{memberUsername}" class="form-control"  />
                    <span class="error-msg" th:if="${#fields.hasErrors('memberUsername')}" th:errors="*{memberUsername}"></span>
                </div>

                <div class="form-group">
                    <label>會員姓名</label>
                    <input type="text" th:field="*{memberName}" class="form-control">
                    <span class="error-msg" th:if="${#fields.hasErrors('memberName')}" th:errors="*{memberName}"></span>
                </div>

                <div class="form-group">
                    <label>修改密碼 (若不修改請留空)</label>
                    <input type="password" name="memberPassword" placeholder="4-10位英數字" autocomplete="new-password">
                    <span class="error-msg" th:if="${#fields.hasErrors('memberPassword')}" th:errors="*{memberPassword}"></span>
                </div>

                <div class="form-group">
                    <label>電子郵件</label>
                    <input type="email" th:field="*{memberEmail}">
                    <span class="error-msg" th:if="${#fields.hasErrors('memberEmail')}" th:errors="*{memberEmail}"></span>
                </div>

                <div class="form-group">
                    <label>電話號碼</label>
                    <input type="text" th:field="*{memberPhone}" placeholder="0912345678">
                    <span class="error-msg" th:if="${#fields.hasErrors('memberPhone')}" th:errors="*{memberPhone}"></span>
                </div>

                <div class="form-group full-width">
                    <div class="avatar-section">
                        <img id="editImagePreview" class="avatar-preview"
                             th:src="*{memberImage != null} ? @{'/memberInfo/image/' + *{memberNo}} : 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22%3E%3Crect fill=%22%23ddd%22 width=%22150%22 height=%22150%22/%3E%3C/svg%3E'"
                             alt="Member Avatar"
                             onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22150%22 height=%22150%22%3E%3Crect fill=%22%23e0e0e0%22 width=%22150%22 height=%22150%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 font-size=%2230%22 fill=%22%23999%22 text-anchor=%22middle%22 dy=%22.3em%22%3E無圖片%3C/text%3E%3C/svg%3E'" />

                        <label for="imageUpload" class="btn" style="background:#f1f1f1; color:#333; font-size:14px; cursor:pointer;">
                            <i class="fas fa-camera"></i> 更換會員頭像
                        </label>
                        <input type="file" id="imageUpload" name="imageFile" style="display: none;" accept="image/*" onchange="previewImage(this)">
                    </div>
                </div>

                <div class="form-group full-width">
                    <label>聯絡地址</label>
                    <input type="text" th:field="*{address}" style="width: 100%;">
                    <span class="error-msg" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
                </div>

                <div class="form-group">
                    <label>帳號狀態</label>
                    <select th:field="*{accountStatus}">
                        <option value="0">⚪ 未認證</option>
                        <option value="1">🟢 已認證</option>
                        <option value="2">🔴 停權</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>賣家權限</label>
                    <select th:field="*{sellerStatus}">
                        <option value="0">一般會員</option>
                        <option value="1">已認證賣家</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>技師權限狀態</label>
                    <select th:field="*{engineerStatus}">
                        <option value="0">一般會員</option>
                        <option value="1">已認證技師</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>註冊時間</label>
                    <div class="info-text" th:text="${#dates.format(member.registrationTime, 'yyyy-MM-dd HH:mm:ss')}"></div>
                </div>

                <div class="form-group">
                    <label>評價紀錄</label>
                    <div class="info-text">
                        ⭐ <span th:text="${member.ratingStar}">0</span> 分
                        (共 <span th:text="${member.ratingAmount}">0</span> 次評價)
                    </div>
                </div>

            </div>
        </div>

        <div class="btn-group">
            <a th:href="@{/memberInfo/manage}" class="btn btn-cancel">
                <i class="fas fa-times"></i> 取消返回
            </a>
            <button type="submit" class="btn btn-save">
                <i class="fas fa-save"></i> 儲存所有修改
            </button>
        </div>
    </form>
</div>

<script>
    // 圖片即時預覽邏輯
    function previewImage(input) {
        if (input.files && input.files[0]) {
            // 檢查檔案大小 (例如限制 5MB)
            if (input.files[0].size > 5 * 1024 * 1024) {
                alert('檔案大小不能超過 5MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('editImagePreview').src = e.target.result;
            }
            reader.onerror = function() {
                alert('檔案讀取失敗');
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

</body>
</html>
