<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>優惠券管理 - Autopile Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/back-end/admin_index.css}">
    <link rel="stylesheet" th:href="@{/css/couponStyle.css}">

    <link rel="stylesheet" th:href="@{/css/fragments/admin_sidebar.css}">
</head>
<body>
<div class="app-container">

    <!-- 側邊欄 -->
    <aside th:replace="~{fragments/admin_sidebar :: adminSidebar(activePage='coupon')}"></aside>

    <!-- 主內容區 -->
    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">🎟️ 優惠券管理系統</h2>
            <div class="user-profile">
                <span>Admin</span>
                <div class="avatar">
                    <i class="fas fa-user"></i>
                </div>
            </div>
        </header>

        <div class="content-area scrollbar-styled">

            <!-- 優惠券列表 -->
            <section id="coupon-list" class="page-section">
                <h1><i class="fas fa-list"></i> 優惠券列表</h1>

                <div class="page-actions">
                    <a th:href="@{/coupon/admin#coupon-query}" class="btn btn-query">🔍 查詢優惠券</a>
                    <a th:href="@{/coupon/admin#coupon-add}" class="btn btn-add">➕ 新增優惠券</a>
                </div>

                <table>
                    <thead>
                    <tr>
                        <th>優惠券編號</th>
                        <th>優惠券名稱</th>
                        <th>優惠內容</th>
                        <th>折價金額</th>
                        <th>開始時間</th>
                        <th>結束時間</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${coupons}">
                        <td th:text="${c.couponNo}"></td>
                        <td th:text="${c.couponTitle}"></td>
                        <td th:text="${c.couponContent}"></td>
                        <td th:text="${c.discountValue}"></td>
                        <td th:text="${#temporals.format(c.couponStart, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${#temporals.format(c.couponEnd, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <span th:if="${c.couponStatus == 1}" style="color: #28a745; font-weight: bold;">有效</span>
                            <span th:if="${c.couponStatus == 0}" style="color: #999999; font-weight: bold;">停用</span>
                            <span th:if="${c.couponStatus != 1 && c.couponStatus != 0}" th:text="${c.couponStatus}"></span>
                        </td>
                        <td>
                            <a th:href="@{/coupon/update-page/{no}(no=${c.couponNo})}" class="btn-edit"
                               style="background-color: #ffc107; color: black; padding: 5px 10px; text-decoration: none; border-radius: 4px;">修改</a>

                            <form th:action="@{/coupon/delete}" method="post" style="display:inline;"
                                  onsubmit="return confirm('確定要刪除這筆優惠券嗎？');">
                                <input type="hidden" name="couponNo" th:value="${c.couponNo}">
                                <button type="submit" class="btn-delete" style="background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;font-size: 0.8em;">刪除</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
                <div class="pagination-container" th:if="${couponPage.totalPages > 1}" style="margin-top: 20px; text-align: center;">
                    <ul class="pagination" style="display: inline-flex; list-style: none; gap: 10px;">

                        <li th:class="${couponPage.first} ? 'disabled'">
                            <a th:href="@{/coupon/admin(p=${couponPage.number - 1})}" th:if="${!couponPage.first}" class="btn-page">上一頁</a>
                        </li>

                        <li th:each="i : ${#numbers.sequence(0, couponPage.totalPages - 1)}">
                            <a th:href="@{/coupon/admin(p=${i})}"
                               th:text="${i + 1}"
                               th:classappend="${i == couponPage.number} ? 'active-page' : ''"
                               class="btn-page"></a>
                        </li>

                        <li th:class="${couponPage.last} ? 'disabled'">
                            <a th:href="@{/coupon/admin(p=${couponPage.number + 1})}" th:if="${!couponPage.last}" class="btn-page">下一頁</a>
                        </li>
                    </ul>
                </div>
            </section>
<!--            <div class="page-actions" style="margin-top: 20px; display: flex; justify-content: center;">-->
<!--                <button type="button" class="btn-cancel" onclick="history.back()">-->
<!--                    <i class="fas fa-arrow-left"></i> 返回前頁-->
<!--                </button>-->
<!--            </div>-->

            <!-- 複合查詢 -->
            <section id="coupon-query" class="page-section" style="display:none;">
                <h1><i class="fas fa-search"></i>查詢優惠券</h1>

                <div class="search-box">
                    <h2>查詢條件</h2>
                    <form th:action="@{/coupon/listByCompositeQuery}" method="post">
                        <div class="row">
                            <label>優惠券名稱:</label>
                            <input type="text" name="title" placeholder="例如：週年慶">
                        </div>
                        <div class="row">
                            <label>優惠券內容:</label>
                            <input type="text" name="content">
                        </div>

                        <div class="row">
                            <label>開始日期:</label>
                            <input type="date" name="start">
                        </div>
                        <div class="row">
                            <label>結束日期:</label>
                            <input type="date" name="end">
                        </div>
                        <div class="btn-row">
                            <button type="submit">開始查詢</button>
                            <button type="reset">重設條件</button>
                        </div>
                    </form>
                </div>

                <div class="back-link">
                    <a th:href="@{/coupon/admin}" class="nav-link">回優惠券列表</a>
                </div>

            </section>

            <!-- 新增優惠券 -->
            <section id="coupon-add" class="page-section" style="display:none;">
                <h1><i class="fas fa-plus-circle"></i> 新增優惠券</h1>

                <div class="form-container">
                    <form th:action="@{/coupon/insert}" th:object="${coupon}" method="post">

                        <div th:if="${errorMessage}" class="error-msg" th:text="${errorMessage}"></div>

                        <div class="row">
                            <label>管理員編號</label>
                            <input type="number" th:field="*{admNo}" placeholder="請輸入管理員編號">

                            <span th:if="${#fields.hasErrors('admNo')}" th:errors="*{admNo}" class="error"></span>
                        </div>
                        <div class="row">
                            <label>優惠券標題</label>
                            <input type="text" th:field="*{couponTitle}" maxlength="30" placeholder="最多30字，例如：新春大放送">
                            <span th:if="${#fields.hasErrors('couponTitle')}" th:errors="*{couponTitle}" class="error"></span>
                        </div>

                        <div class="row">
                            <label>優惠內容</label>
                            <textarea th:field="*{couponContent}" rows="4" maxlength="200" placeholder="最多200字，請輸入詳細優惠規則..."></textarea>
                            <span th:if="${#fields.hasErrors('couponContent')}" th:errors="*{couponContent}" class="error"></span>
                        </div>

                        <div class="row">
                            <label>折價金額</label>
                            <input type="number" th:field="*{discountValue}" placeholder="請輸入折價金額">
                            <span th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}" class="error"></span>
                        </div>

                        <div class="row">
                            <label>開始時間</label>
                            <input type="datetime-local" th:field="*{couponStart}">
                            <span th:if="${#fields.hasErrors('couponStart')}" th:errors="*{couponStart}" class="error"></span>
                        </div>

                        <div class="row">
                            <label>結束時間</label>
                            <input type="datetime-local" th:field="*{couponEnd}">
                            <span th:if="${#fields.hasErrors('couponEnd')}" th:errors="*{couponEnd}" class="error"></span>
                        </div>

                        <div class="btn-row">
                            <button type="submit" class="btn-submit">確認新增</button>
                            <button type="reset" class="btn-reset">重設</button>
                            <a href="#coupon-list" class="btn btn-cancel">取消</a>
                        </div>
                    </form>
                </div>
            </section>


        </div>
    </main>
</div>

<script th:inline="javascript">
    // 側邊欄子選單切換邏輯
    document.querySelectorAll('.submenu-toggle').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();
            const parent = this.parentElement;

            // 切換 open 類別
            parent.classList.toggle('open');

            // (選用) 如果希望點開一個時關閉其他，可以加入以下這段：

            document.querySelectorAll('.menu-item.has-submenu').forEach(item => {
                if (item !== parent) item.classList.remove('open');
            });

        });
    });
    // 頁面載入時的邏輯
    window.onload = function() {
        // 取得 Thymeleaf 傳來的訊號，若無則預設為 false
        const showAddSection = [[${showAddSection ?: false}]];

        if (showAddSection) {
            // 如果後端說要顯示新增區塊
            switchToSection('#coupon-add');
            // 同時把網址 Hash 改掉，避免使用者重新整理又跑回列表
            window.location.hash = '#coupon-add';
        } else {
            // 一般情況：讀取 URL hash 或預設顯示列表
            const hash = window.location.hash || '#coupon-list';
            switchToSection(hash);
        }
    };

    // 頁面切換函數 (保持你原本的邏輯)
    function switchToSection(targetId) {
        const target = document.querySelector(targetId);

        if (target) {
            // 如果在當前 DOM 找到目標 (表示在 /coupon/admin 頁面)
            document.querySelectorAll('.page-section').forEach(s => s.style.display = 'none');
            target.style.display = 'block';

            // 更新側邊欄與按鈕的 active 狀態
            updateActiveStatus(targetId);
        } else {
            // 如果找不到目標 (表示在 /listByCompositeQuery 或其他頁面)
            // 強制導回主管理頁面並帶上 hash
            window.location.href = '/coupon/admin' + targetId;
        }
    }

    function updateActiveStatus(targetId) {
        const couponLinks = document.querySelectorAll('.menu-item.has-submenu .submenu a[href*="coupon"]');

        couponLinks.forEach(a => {
            a.classList.remove('active');
            const href = a.getAttribute('href');

            // 判斷連結是否匹配當前的 targetId (例如 #coupon-query)
            if (href.includes(targetId)) {
                a.classList.add('active');
            }
            // 如果是回到列表頁且沒有 hash
            else if (targetId === '#coupon-list' && !href.includes('#')) {
                a.classList.add('active');
            }
        });
    }

    // 點擊事件監聽 (確保取消按鈕也被處理)
    document.querySelectorAll('.submenu a, .page-actions a, .btn-cancel, .back-link a').forEach(link => {
        link.addEventListener('click', function(e) {
            const href = this.getAttribute('href');
            if (href && href.includes('#')) {
                const hash = href.substring(href.indexOf('#'));
                if (hash.startsWith('#coupon-')) {
                    // 如果在主頁面，執行切換
                    if (window.location.pathname.endsWith('/coupon/admin')) {
                        e.preventDefault();
                        switchToSection(hash);
                        window.location.hash = hash;
                    }
                }
            }
        });
    });

    // 跳轉頁面
    function handleRouting() {
        const showAddSection = [[${showAddSection ?: false}]];
        const hash = window.location.hash;

        if (showAddSection) {
            switchToSection('#coupon-add');
            history.replaceState(null, null, '#coupon-add'); // 優雅更換 Hash 不觸發 reload
        } else if (hash) {
            switchToSection(hash);
        } else {
            switchToSection('#coupon-list');
        }
    }

    window.addEventListener('load', handleRouting);
    window.addEventListener('hashchange', function() {
        const hash = window.location.hash || '#coupon-list';
        switchToSection(hash);
    });
    document.addEventListener('click', function(e) {
        const link = e.target.closest('a[href*="#"]');
        if (link) {
            const href = link.getAttribute('href');
            const hashIndex = href.indexOf('#');
            const hash = href.substring(hashIndex);

            // 如果是內部錨點跳轉
            if (hash.startsWith('#coupon-')) {
                // 判斷當前 URL 路徑
                if (window.location.pathname.includes('listByCompositeQuery')) {
                    // 如果在查詢結果頁，不執行預防行為，讓瀏覽器直接跳轉回 /coupon/admin#...
                    return;
                } else {
                    // 如果在主頁面，執行平滑切換
                    e.preventDefault();
                    switchToSection(hash);
                    window.location.hash = hash;
                }
            }
        }
    });

    document.addEventListener("DOMContentLoaded", function() {
        const couponLinks = document.querySelectorAll('.menu-item.has-submenu .submenu a[href*="coupon"]');
        const currentPath = window.location.pathname;
        const currentHash = window.location.hash;

        function setActive(targetHashOrPath) {
            couponLinks.forEach(link => {
                const href = link.getAttribute('href');
                link.classList.remove('active');

                // 判斷邏輯：如果連結的 href 包含當前的 Hash，或是當前在查詢結果頁且連結是「查詢」
                if (currentHash && href.includes(currentHash)) {
                    link.classList.add('active');
                } else if (currentPath.includes('listByCompositeQuery') && href.includes('#coupon-query')) {
                    link.classList.add('active');
                } else if (!currentHash && !currentPath.includes('listByCompositeQuery') && href.endsWith('/coupon/admin')) {
                    // 預設列表亮起
                    if (href.indexOf('#') === -1) link.classList.add('active');
                }
            });
        }

        setActive();

        // 監聽點擊
        couponLinks.forEach(link => {
            link.addEventListener('click', function() {
                couponLinks.forEach(item => item.classList.remove('active'));
                this.classList.add('active');
            });
        });
    });

        // 2. 處理頁面重新整理時，根據網址 Hash 自動選取
        const currentHash = window.location.hash;
        if (currentHash) {
            couponLinks.forEach(link => {
                if (link.getAttribute('href').includes(currentHash)) {
                    couponLinks.forEach(item => item.classList.remove('active'));
                    link.classList.add('active');
                }
            });
        }


</script>
</body>
</html>
