<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>優惠券查詢結果</title>
    <link rel="stylesheet" th:href="@{/css/couponStyle.css}">

</head>
<body>

<h2 style="text-align: center;">優惠券查詢結果</h2>

<table th:if="${not #lists.isEmpty(coupons)}">
    <thead>
    <tr>
        <th>優惠券編號</th>
        <th>優惠券名稱</th>
        <th>優惠內容</th>
        <th>折價金額</th>
        <th>開始時間</th>
        <th>結束時間</th>
        <th>操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="coupon : ${coupons}">
        <td th:text="${coupon.couponNo}"></td>
        <td th:text="${coupon.couponTitle}"></td>
        <td th:text="${coupon.couponContent}"></td>
        <td th:text="${coupon.discountValue}"></td>
        <td th:text="${#temporals.format(coupon.couponStart, 'yyyy-MM-dd HH:mm')}"></td>
        <td th:text="${#temporals.format(coupon.couponEnd, 'yyyy-MM-dd HH:mm')}"></td>

        <td>
            <a th:href="@{/coupon/update-page/{no}(no=${coupon.couponNo})}"
               style="background-color: #ffc107; color: black; padding: 5px 10px; text-decoration: none; border-radius: 4px;">修改</a>

            <form th:action="@{/coupon/delete}" method="post" style="display:inline;"
                  onsubmit="return confirm('確定要刪除這筆查詢結果嗎？');">
                <input type="hidden" name="couponNo" th:value="${coupon.couponNo}">
                <button type="submit" style="background-color: #dc3545; color: white; padding: 5px 10px; border: none; border-radius: 4px; cursor: pointer;">刪除</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

<div class="no-data" th:if="${#lists.isEmpty(coupons)}">
    <h3>查無符合條件的優惠券資料</h3>
</div>

<div class="back-link">
    <a th:href="@{/coupon/select-page}">重新查詢</a> |
    <a th:href="@{/coupon/list-page}">回完整列表</a>
</div>

</body>
</html>
