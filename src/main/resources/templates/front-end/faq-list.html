<!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>卡爾夏汽車百貨</title>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
	<link rel="stylesheet" th:href="@{/css/front-end/faq-list.css}">
	<link rel="stylesheet" th:href="@{/css/front-end/index2.css}">
	<link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
	<link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
</head>
<body>

<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="faq-container">
	<div class="page-header">
		<h1>❓ 常見問題</h1>
		<p>快速找到您需要的答案</p>
	</div>

	<!-- 空狀態 -->
	<div th:if="${faqs == null || faqs.isEmpty()}" class="empty-state">
		<div style="font-size: 64px;">🔭</div>
		<p>目前沒有已發佈的常見問題</p>
	</div>

	<!-- FAQ 列表 -->
	<div th:if="${faqs != null && !faqs.isEmpty()}">
		<div th:each="faq, stat : ${faqs}"
			 class="faq-card"
			 th:id="'faq-' + ${stat.index}">

			<div class="faq-header" th:onclick="'toggleFaq(' + ${stat.index} + ')'">
				<h3 class="faq-question">
					<span class="question-icon">Q</span>
					<span th:text="${faq.question}">問題內容</span>
				</h3>
				<span class="faq-toggle" th:id="'toggle-' + ${stat.index}">▼</span>
			</div>

			<div class="faq-answer" th:id="'answer-' + ${stat.index}">
				<p th:text="${faq.answer}">答案內容</p>
			</div>

			<div class="faq-meta">
                <span>
                    📅 發佈時間:
                    <span th:text="${#temporals.format(faq.create_date, 'yyyy/MM/dd HH:mm')}">2024/01/01 10:00</span>
                </span>
				<span class="faq-badge" th:text="${faq.status}">發佈</span>
			</div>
		</div>
	</div>
</div>

<footer th:replace="~{/fragments/footer :: Footer}"></footer>

<script th:src="@{/js/front-end/index2.js}"></script>
<script>
	// 切換 FAQ 展開/收合
	function toggleFaq(index) {
		const card = document.getElementById('faq-' + index);
		if (card) {
			card.classList.toggle('active');
		}
	}
</script>

</body>
</html>
