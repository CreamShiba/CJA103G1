<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${productVO.prodName} + ' | Karshop 卡爾夏'"></title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/product/productDetail.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
</head>
<body>

<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="container">

    <aside th:replace="~{fragments/front_sidebar :: frontSidebar}"></aside>

    <div class="main-content-wrapper">

        <div class="product-image-section">
            <div class="main-image-box">
                <img id="mainImg"
                     th:if="${not #lists.isEmpty(productVO.productImage)}"
                     th:src="@{/product/displayDetail(imgNo=${productVO.productImage[0].imgNo})}"
                     alt="Product Image">
                <div th:if="${#lists.isEmpty(productVO.productImage)}" style="color: #666;">
                    暫無圖片
                </div>
            </div>

            <div class="thumbnail-container" th:if="${not #lists.isEmpty(productVO.productImage)}">
                <div class="thumb-box"
                     th:each="piVO, iterStat : ${productVO.productImage}"
                     th:classappend="${iterStat.index == 0} ? 'active'"
                     onclick="switchImage(this)">
                    <img th:src="@{/product/displayDetail(imgNo=${piVO.imgNo})}">
                </div>
            </div>
        </div>

        <div class="product-info-section" style="display: block; position: relative; border: none !important; min-height: auto !important; height: auto !important;">

            <div class="info-header">
                <div class="breadcrumb" style="color: #888; font-size: 14px; margin-bottom: 10px;">
                    <a th:href="@{/product/all}">首頁</a> / 商品詳情 / <span th:text="${productVO.prodName}"></span>
                </div>

                <h1 class="product-title" th:text="${productVO.prodName}" style="font-size: 2rem; font-weight: bold; margin-bottom: 10px;">商品名稱</h1>

                <div class="product-rating-detail" style="display: flex; align-items: center; color: #ffc107; margin-bottom: 15px;">
            <span style="font-weight: bold; margin-right: 5px;"
                  th:text="${productVO.ratingAmount > 0 ? #numbers.formatDecimal(productVO.ratingStar * 1.0 / productVO.ratingAmount, 1, 1) : '0.0'}">4.8</span>
                    <i class="fas fa-star"></i>
                    <span class="rating-count-detail" style="color: #888; font-size: 13px; margin-left: 8px;"
                          th:text="'(' + ${productVO.ratingAmount} + ' 則評價)'"></span>
                </div>
            </div>

            <div style="margin-bottom: 20px;">
                <div th:if="${productVO.carCategory != null}"
                     style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px solid #444; padding: 8px 15px; border-radius: 6px;">
                    <i class="fas fa-car" style="color: #00e676; margin-right: 8px;"></i>
                    <span style="color: #aaa; margin-right: 5px;">適用車款:</span>
                    <span th:text="${productVO.carCategory.fullName}" style="font-weight: bold; color: #fff;"></span>
                </div>
                <div th:if="${productVO.carCategory == null}"
                     style="display: inline-flex; align-items: center; background: rgba(255,255,255,0.05); border: 1px dashed #666; padding: 8px 15px; border-radius: 6px;">
                    <i class="fas fa-tools" style="margin-right: 8px; color: #aaa;"></i>
                    <span style="color: #aaa;">全車系通用</span>
                </div>
            </div>

            <div class="info-body-wrapper" style="display: block;">

                <div class="seller-info-box" style="display: flex; align-items: center; gap: 15px; padding: 15px; background: rgba(255,255,255,0.03); border-radius: 8px; margin-bottom: 20px;">
                    <a th:href="@{/shop(sellerNo=${productVO.seller.sellerNo})}">
                        <img th:src="${productVO.seller.imagePath != null && productVO.seller.imagePath != '' ? productVO.seller.imagePath : 'https://ui-avatars.com/api/?name=' + (productVO.seller.shopName != null && productVO.seller.shopName != '' ? productVO.seller.shopName : productVO.seller.sellerName) + '&background=random'}"
                             alt="賣家頭像"
                             style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; border: 2px solid #333;" />
                    </a>
                    <div style="flex: 1;">
                        <div style="font-size: 11px; color: #888;">SELLER</div>
                        <a th:href="@{/shop(sellerNo=${productVO.seller.sellerNo})}"
                           th:text="${productVO.seller.shopName != null && productVO.seller.shopName != '' ? productVO.seller.shopName : productVO.seller.sellerName}"
                           style="font-size: 15px; font-weight: bold; color: #fff;">賣場名稱</a>
                    </div>
                    <a th:href="@{/shop(sellerNo=${productVO.seller.sellerNo})}"
                       style="font-size: 13px; background: #333; color: white; padding: 6px 15px; border-radius: 20px;">
                        逛逛 <i class="fas fa-arrow-right"></i>
                    </a>
                </div>

                <div class="product-desc-box" style="margin-bottom: 20px; padding-top: 20px; border-top: 1px dashed #333;">
                    <p th:text="${productVO.prodDesc}" style="color: #ccc; line-height: 1.8; margin: 0; white-space: pre-line;"></p>
                </div>

                <div class="buying-zone" style="margin-top: 20px;">

                    <div style="text-align: right; margin-bottom: 5px;">
                        <button type="button" class="report-btn" onclick="openReportModal()">
                            <i class="fas fa-exclamation-circle"></i> 檢舉商品
                        </button>
                    </div>

                    <div class="price-tag" style="font-size: 36px; color: #ff5252; font-weight: bold; margin-bottom: 15px;">
                        <span th:text="${'$' + #numbers.formatInteger(productVO.prodPrice, 1, 'COMMA')}">$999</span>
                    </div>

                    <div th:if="${productVO.seller.sellerStatus != '已開通'}"
                         style="background: rgba(255, 82, 82, 0.1); border: 1px solid #ff5252; border-radius: 8px; padding: 15px; text-align: center;">
                        <h3 style="color: #ff5252; margin: 0 0 5px 0; font-size: 16px;"><i class="fas fa-ban"></i> 暫停販售</h3>
                        <p style="color: #ccc; margin: 0; font-size: 13px;">此賣家目前處於停權狀態，該商品暫時無法購買。</p>
                    </div>

                    <div th:if="${productVO.seller.sellerStatus == '已開通'}" class="active-buying-area">

                        <div style="margin-bottom: 15px; color: #00e676; font-size: 13px;" th:if="${productVO.prodQty > 0}">
                            <i class="fas fa-check-circle"></i> 現貨充足 (剩餘 <span th:text="${productVO.prodQty}"></span>)
                        </div>

                        <form th:action="@{/cart/add}" method="post" style="display: flex; align-items: center; gap: 10px;">
                            <input type="hidden" name="prodNo" th:value="${productVO.prodNo}" />

                            <div class="qty-selector" th:if="${productVO.prodQty > 0}" style="display: flex; border: 1px solid #444; border-radius: 4px; height: 48px;">
                                <button type="button" onclick="updateQty(-1)" style="background: #222; border: none; color: white; width: 30px;">-</button>
                                <input type="number" name="qty" id="qtyInput" value="1" min="1" th:max="${productVO.prodQty}" readonly
                                       style="background: #111; border: none; color: white; width: 40px; text-align: center;" />
                                <button type="button" onclick="updateQty(1)" style="background: #222; border: none; color: white; width: 30px;">+</button>
                            </div>

                            <button type="submit" class="add-cart-btn" th:if="${productVO.prodQty > 0}"
                                    style="background: transparent; border: 1px solid #7c4dff; color: #7c4dff; height: 48px; padding: 0 20px; border-radius: 6px; cursor: pointer; white-space: nowrap;">
                                <i class="fas fa-cart-plus"></i> 加入購物車
                            </button>

                            <button type="submit" name="buyNow" value="true" class="buy-now-btn" th:if="${productVO.prodQty > 0}"
                                    style="background: #ff5722; border: none; color: white; height: 48px; padding: 0 20px; border-radius: 6px; cursor: pointer; font-weight: bold; white-space: nowrap;">
                                直接購買
                            </button>

                            <button type="button" disabled th:if="${productVO.prodQty <= 0}"
                                    style="background: #333; color: #888; height: 48px; width: 100%; border: none; border-radius: 6px;">
                                暫無庫存
                            </button>

                            <button type="button" id="favBtn" class="fav-btn-large"
                                    th:classappend="${isFavorite} ? 'active'"
                                    th:data-prodno="${productVO.prodNo}"
                                    style="background: transparent; border: 1px solid #444; color: #aaa; width: 48px; height: 48px; border-radius: 6px; cursor: pointer;">
                                <i id="favIcon" th:class="${isFavorite} ? 'fas fa-heart' : 'far fa-heart'"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        </div> <div class="full-width-review-section" style="margin-top: 40px; background: rgba(255,255,255,0.02); padding: 30px; border-radius: 12px; border: 1px solid #333;">
    <h3 style="color: #fff; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--accent-purple, #7c4dff); display: inline-block;">
        商品評價 (<span th:text="${productVO.ratingAmount}">0</span>)
    </h3>

    <div th:if="${#lists.isEmpty(productVO.buyerRatings)}" style="color: #888; font-size: 14px; text-align: center; padding: 20px;">
        <i class="far fa-comment-dots" style="font-size: 30px; margin-bottom: 10px; display: block;"></i>
        尚無評價，快來成為第一個評論的人吧！
    </div>

    <div class="review-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px;">
        <div th:each="rate : ${productVO.buyerRatings}"
             style="background: #1e1e1e; padding: 20px; border-radius: 8px; border: 1px solid #444;">

            <div style="display: flex; justify-content: space-between; margin-bottom: 10px;">
                <div style="color: #ccc; font-weight: bold; display: flex; align-items: center; gap: 8px;">
                    <div style="width: 30px; height: 30px; background: #333; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                        <i class="fas fa-user" style="font-size: 14px; color: #888;"></i>
                    </div>
                    <span th:text="${#strings.substring(rate.member.memAcc, 0, 2) + '****'}">User</span>
                </div>
                <div style="color: #666; font-size: 12px;"
                     th:text="${#temporals.format(rate.ratingDate, 'yyyy-MM-dd HH:mm')}">
                </div>
            </div>

            <div style="color: #ffc107; margin-bottom: 12px; font-size: 14px;">
                <i th:each="i : ${#numbers.sequence(1, rate.score)}" class="fas fa-star"></i>
                <i th:if="${rate.score < 5}" th:each="i : ${#numbers.sequence(rate.score + 1, 5)}" class="far fa-star" style="color: #444;"></i>
            </div>

            <div th:text="${rate.comment}" style="color: #eee; line-height: 1.6; font-size: 14px; background: #111; padding: 10px; border-radius: 6px;">
                評價內容...
            </div>
        </div>
    </div>
</div>

</div>
</div>

<footer th:replace="~{fragments/footer :: Footer}"></footer>

<div id="reportModal" class="modal-overlay">
    <div class="modal-box">
        <div class="modal-header" style="margin-bottom: 20px;">
            <h3 class="modal-title" style="margin: 0;">檢舉商品</h3>
            <span style="font-size: 13px; color: #666;">請協助我們維護商城環境</span>
        </div>

        <form th:action="@{/reports/submit}" method="post" id="reportForm">
            <input type="hidden" name="prodNo" th:value="${productVO.prodNo}">
            <input type="hidden" name="sellerNo" th:value="${productVO.seller.sellerNo}">
            <input type="hidden" name="source" value="productDetail">

            <div class="form-group">
                <label class="form-label">檢舉類別</label>
                <input type="hidden" name="reportsType" value="商品">
                <input type="text" class="form-input" value="商品" disabled
                       style="background: #222; color: #888; cursor: not-allowed;">
            </div>

            <div class="form-group">
                <label for="reportsReason" class="form-label">檢舉原因 <span style="color: #ff3333;">*</span></label>
                <select id="reportsReason" name="reportsReason" class="form-input" required>
                    <option value="">-- 請選擇原因 --</option>
                    <option value="廣告不實">廣告不實</option>
                    <option value="分類錯誤">分類錯誤</option>
                    <option value="重覆刊登">重覆刊登</option>
                    <option value="山寨品/高仿">山寨品/高仿</option>
                    <option value="商品敘述與實物不符">商品敘述與實物不符</option>
                    <option value="商品有瑕疵">商品有瑕疵</option>
                </select>
            </div>

            <div class="form-group">
                <label for="reportsDescription" class="form-label">詳細描述</label>
                <textarea id="reportsDescription" name="reportsDescription" class="modal-textarea"
                          placeholder="請補充說明具體細節 (選填)..."></textarea>
            </div>

            <div class="modal-actions">
                <button type="button" class="modal-close" onclick="closeReportModal()">取消</button>
                <button type="button" class="modal-submit" onclick="submitReportForm()">送出檢舉</button>
            </div>
        </form>
    </div>
</div>

<div th:if="${message}" id="flashMessage" class="flash-toast">
    <i class="fas fa-check-circle"></i>
    <span th:text="${message}"></span>
    <button onclick="this.parentElement.style.display='none'" class="flash-close">&times;</button>
</div>

<script th:src="@{/js/front-end/product/productDetail.js}"></script>
</body>
</html>
