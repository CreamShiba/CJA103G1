<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>系統通知 - 卡爾夏汽車百貨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/notifications.css}">
    <link rel="stylesheet" th:href="@{/css/front-end/index2.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
    <link rel="stylesheet" th:href="@{/css/memberCouponStyle.css}">
</head>
<body style="background-color: #1a1a1a; color: #eee;">
<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="container" style="display: flex; gap: 20px; max-width: 1200px; margin: 40px auto; padding: 0 20px;">
    <aside th:replace="~{fragments/member_center_sidebar :: memberCenterSidebar}"></aside>

    <main class="content-area" style="flex: 1; min-width: 0;">
        <div class="coupon-container" style="background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 8px; border: 1px solid #333;">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff3333; padding-bottom: 15px; margin-bottom: 20px;">
                <h2 class="coupon-header" style="margin: 0; color: #fff; border: none;">📬 系統通知</h2>
                <div th:if="${unreadCount != null and unreadCount > 0}">
                    <span style="background: #ff3333; color: white; padding: 4px 12px; border-radius: 20px; font-size: 14px;"
                          th:text="'尚未閱讀 ' + ${unreadCount} + ' 則'"></span>
                </div>
            </div>

            <div th:if="${unreadCount != null and unreadCount > 0}" style="margin-bottom: 20px; text-align: right;">
                <form method="post" th:action="@{/members/notifications/mark-all-read}">
                    <button type="submit" style="background: rgba(255,51,51,0.2); color: #ff3333; border: 1px solid #ff3333; padding: 5px 15px; border-radius: 5px; cursor: pointer;">
                        ✓ 全部標為已讀
                    </button>
                </form>
            </div>

            <div class="notifications-scroll-area" style="max-height: 600px; overflow-y: auto; padding-right: 10px;">
                <div class="coupon-list">
                    <div th:each="message : ${notifications}" class="coupon-card"
                         th:style="${message.message_status} ? 'margin-bottom: 15px; padding: 20px; border: 1px solid #444; border-radius: 8px; background: rgba(255,255,255,0.02);' : 'margin-bottom: 15px; padding: 20px; border: 1px solid #ff3333; border-radius: 8px; background: rgba(255,51,51,0.05);'">

                        <div class="coupon-info">
                            <h3 th:text="${message.message_content}" style="color: #fff; margin-bottom: 10px; font-size: 1.1em;">通知內容</h3>
                            <div style="color: #888; font-size: 0.85em;">
                                <i class="far fa-clock"></i>
                                <span th:text="${message.message_time != null ? #temporals.format(message.message_time, 'yyyy-MM-dd HH:mm') : '時間未知'}"></span>
                            </div>
                        </div>

                        <div style="margin-top: 15px; display: flex; justify-content: space-between; align-items: center;">
                            <span th:if="${message.message_status}" style="color: #666; font-size: 13px;">✓ 已讀取</span>
                            <div th:unless="${message.message_status}">
                                <span style="color: #ff3333; font-weight: bold; font-size: 13px; margin-right: 10px;">● 新通知</span>
                                <form th:action="@{/members/notifications/mark-read}" method="post" style="display: inline;">
                                    <input type="hidden" name="id" th:value="${message.message_no}"/>
                                    <button type="submit" style="background: #ff3333; color: white; border: none; padding: 5px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;">標為已讀</button>
                                </form>
                            </div>
                        </div>
                    </div><div th:if="${notifications == null or #lists.isEmpty(notifications)}" style="text-align: center; padding: 80px 20px; color: #666;">
                    <p style="font-size: 50px; margin-bottom: 10px;">📭</p>
                    <p>目前沒有任何系統通知</p>
                </div>
                </div>
            </div>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footer :: Footer}"></footer>
<script th:src="@{/js/front-end/index2.js}"></script>
</body>
</html>
