<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡爾夏汽車百貨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/announcement-list.css}">
    <link rel="stylesheet" th:href="@{/css/front-end/index2.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
</head>
<body>

    <header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="announcements-container">
    <div class="page-header">
        <h1>📢 最新公告</h1>
        <p>掌握最新消息與優惠活動</p>
    </div>

    <!-- 空狀態 -->
    <div th:if="${announcements == null || announcements.isEmpty()}" class="empty-state">
        <div>🔭</div>
        <p>目前沒有已發布的公告</p>
    </div>

    <!-- 公告列表 -->
    <div th:if="${announcements != null && !announcements.isEmpty()}">
        <div th:each="ann : ${announcements}" class="announcement-card">
            <div class="announcement-header">
                <h2 class="announcement-title" th:text="${ann.title}">公告標題</h2>
                <span class="announcement-badge" th:text="${ann.status}">發布</span>
            </div>

            <div class="announcement-content" th:text="${ann.content}">
                公告內容
            </div>

            <div class="announcement-footer">
                <div class="announcement-time">
                    <span>
                        📅 發布時間:
                        <span th:text="${#temporals.format(ann.create_time, 'yyyy/MM/dd HH:mm')}">2024/01/01 10:00</span>
                    </span>
                    <span th:if="${ann.update_time != null && !#temporals.format(ann.update_time, 'yyyy-MM-dd HH:mm').equals(#temporals.format(ann.create_time, 'yyyy-MM-dd HH:mm'))}">
                        ✏️ 更新時間:
                        <span th:text="${#temporals.format(ann.update_time, 'yyyy/MM/dd HH:mm')}">2024/01/02 10:00</span>
                    </span>
                </div>
            </div>
        </div>
    </div>
</div>

    <footer th:replace="~{/fragments/footer :: Footer}"></footer>

    <script th:src="@{/js/front-end/index2.js}"></script>

</body>
</html>
