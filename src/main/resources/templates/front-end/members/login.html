<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登入|卡爾夏</title>
    <link rel="stylesheet" th:href="@{/css/front-end/members/login.css}">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1 class="logo">卡爾夏</h1>
            <p>Welcome back</p>
        </div>
        <div th:if="${successMsg}" class="md-card"
             style="margin-bottom: 16px; padding: 16px; border-left: 4px solid;">
            <p th:text="${successMsg}"
               style="margin: 0; color:red;"></p>
        </div>
        <div th:if="${not #lists.isEmpty(errorMsgs)}"
             class="error-messages-container">
            <div class="error-message" th:each="message : ${errorMsgs}"
                 th:text="${message}"></div>
        </div>
        <div th:if="${errorMsg} and ${#lists.isEmpty(errorMsgs)}"
             class="error-messages-container">
            <div class="error-message" th:text="${errorMsg}"></div>
        </div>

        <form method="post" th:action="@{/members/login}" id="login-form">
            <div class="form-group">
                <label for="account">Account</label>
                <input type="text" id="account" name="memAcc" placeholder="請輸入帳號" required th:value="${memAcc}">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="memPwd" placeholder="請輸入密碼" required>
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <div class="form-footer">
                <a th:href="@{/members/forgotPassword}">忘記密碼?</a>
                <a th:href="${session.location != null ? session.location : '/members/home'}">返回</a>
                <a th:href="@{/members/register}">註冊帳號</a>
            </div>
        </form>
    </div>

</body>
</html>
