<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - 卡爾夏</title>
    <link rel="stylesheet" th:href="@{/css/front-end/members/register.css}">
</head>
<body>

<div class="register-container">
    <div class="register-header">
        <h1 class="logo">卡爾夏</h1>
        <p>Create your account</p>
    </div>
    <div class="avatar-preview-container top-center">
        <img id="avatarPreview" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23555555' width='48px' height='48px'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3Cpath d='M0 0h24v24H0z' fill='none'/%3E%3C/svg%3E" alt="Avatar Preview">
    </div>

    <div class="error-box" th:if="${not #lists.isEmpty(errorMsgs)}">
        <ul>
            <li th:each="msg : ${errorMsgs}" th:text="${msg}"></li>
        </ul>
    </div>

    <form method="post" th:action="@{/members/register}" th:object="${membersVO}" enctype="multipart/form-data">

        <div class="form-row">
            <div class="form-group half">
                <label for="memAcc">Account *</label>
                <input type="text" id="memAcc" th:field="*{memAcc}" placeholder="設定帳號 (6-10碼英數)">
            </div>
            <div class="form-group half">
                <label for="memPwd">Password *</label>
                <input type="password" id="memPwd" th:field="*{memPwd}" placeholder="設定密碼 (4-10碼英數)">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group half">
                <label for="memName">Name *</label>
                <input type="text" id="memName" th:field="*{memName}" placeholder="真實姓名">
            </div>
            <div class="form-group half">
                <label for="memUsername">Nickname *</label>
                <input type="text" id="memUsername" th:field="*{memUsername}" placeholder="顯示暱稱">
            </div>
        </div>

        <div class="form-group">
            <label for="memEmail">Email *</label>
            <input type="email" id="memEmail" th:field="*{memEmail}" placeholder="example@email.com">
        </div>

        <div class="form-group">
            <label for="memMobile">Mobile Phone *</label>
            <input type="text" id="memMobile" th:field="*{memMobile}" placeholder="09xxxxxxxx">
        </div>

        <div class="form-group">
            <label>Address *</label>

            <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                <select id="citySelect" class="form-control" style="flex: 1;" >
                    <option value="">請選擇縣市</option>
                </select>

                <select id="areaSelect" class="form-control" style="flex: 1;" >
                    <option value="">請選擇區域</option>
                </select>
            </div>

            <input type="text" id="detailAddr" placeholder="請輸入街道、巷弄、門牌樓層" style="margin-bottom: 0;">

            <input type="hidden" id="memAddr" th:field="*{memAddr}">
        </div>
        <div class="form-group">
            <label for="memAvatar">Avatar Profile</label>
            <input type="file" id="memAvatar" name="memAvatar" accept="image/*" class="file-input">
            <p class="help-text">支援 jpg, png 格式，建議尺寸 200x200</p>
        </div>
        <button type="submit" class="submit-btn">Register</button>

        <div class="form-footer">
            <span>已經是會員了? <a th:href="@{/login}">登入</a></span>
            <a th:href="@{/members/home}">回到首頁</a>
        </div>
    </form>
</div>
<script>

        "基隆市": ["仁愛區", "信義區", "中正區", "中山區", "安樂區", "暖暖區", "七堵區"],

        "新竹市": ["東區", "北區", "香山區"],

        "苗栗縣": ["竹南鎮", "頭份市", "三灣鄉", "南庄鄉", "獅潭鄉", "後龍鎮", "通霄鎮", "苑裡鎮", "苗栗市", "造橋鄉", "頭屋鄉", "公館鄉", "大湖鄉", "泰安鄉", "銅鑼鄉", "三義鄉", "西湖鄉", "卓蘭鎮"],
        "臺中市": ["中區", "東區", "南區", "西區", "北區", "北屯區", "西屯區", "南屯區", "太平區", "大里區", "霧峰區", "烏日區", "豐原區", "后里區", "石岡區", "東勢區", "和平區", "新社區", "潭子區", "大雅區", "神岡區", "大肚區", "沙鹿區", "龍井區", "梧棲區", "清水區", "大甲區", "外埔區", "大安區"],
        "彰化縣": ["彰化市", "芬園鄉", "花壇鄉", "秀水鄉", "鹿港鎮", "福興鄉", "線西鄉", "和美鎮", "伸港鄉", "員林市", "社頭鄉", "永靖鄉", "埔心鄉", "溪湖鎮", "大村鄉", "埔鹽鄉", "田中鎮", "北斗鎮", "田尾鄉", "埤頭鄉", "溪州鄉", "竹塘鄉", "二林鎮", "大城鄉", "芳苑鄉", "二水鄉"],
        "南投縣": ["南投市", "中寮鄉", "草屯鎮", "國姓鄉", "埔里鎮", "仁愛鄉", "名間鄉", "集集鎮", "水里鄉", "魚池鄉", "信義鄉", "竹山鎮", "鹿谷鄉"],
        "雲林縣": ["斗南鎮", "大埤鄉", "虎尾鎮", "土庫鎮", "褒忠鄉", "東勢鄉", "臺西鄉", "崙背鄉", "麥寮鄉", "斗六市", "林內鄉", "古坑鄉", "莿桐鄉", "西螺鎮", "二崙鄉", "北港鎮", "水林鄉", "口湖鄉", "四湖鄉", "元長鄉"],
        "嘉義市": ["東區", "西區"],
        "嘉義縣": ["番路鄉", "梅山鄉", "竹崎鄉", "阿里山鄉", "中埔鄉", "大埔鄉", "水上鄉", "鹿草鄉", "太保市", "朴子市", "東石鄉", "六腳鄉", "新港鄉", "民雄鄉", "大林鎮", "溪口鄉", "義竹鄉", "布袋鎮"],
        "臺南市": ["中西區", "東區", "南區", "北區", "安平區", "安南區", "永康區", "歸仁區", "新化區", "左鎮區", "玉井區", "楠西區", "南化區", "仁德區", "關廟區", "龍崎區", "官田區", "麻豆區", "佳里區", "西港區", "七股區", "將軍區", "學甲區", "北門區", "新營區", "後壁區", "白河區", "東山區", "六甲區", "下營區", "柳營區", "鹽水區", "善化區", "大內區", "山上區", "新市區", "安定區"],
        "高雄市": ["新興區", "前金區", "苓雅區", "鹽埕區", "鼓山區", "旗津區", "前鎮區", "三民區", "楠梓區", "小港區", "左營區", "仁武區", "大社區", "東沙群島", "南沙群島", "岡山區", "路竹區", "阿蓮區", "田寮區", "燕巢區", "橋頭區", "梓官區", "彌陀區", "永安區", "湖內區", "鳳山區", "大寮區", "林園區", "鳥松區", "大樹區", "旗山區", "美濃區", "六龜區", "內門區", "杉林區", "甲仙區", "桃源區", "那瑪夏區", "茂林區", "茄萣區"],
        "屏東縣": ["屏東市", "三地門鄉", "霧臺鄉", "瑪家鄉", "九如鄉", "里港鄉", "高樹鄉", "鹽埔鄉", "長治鄉", "麟洛鄉", "竹田鄉", "內埔鄉", "萬丹鄉", "潮州鎮", "泰武鄉", "來義鄉", "萬巒鄉", "崁頂鄉", "新埤鄉", "南州鄉", "林邊鄉", "東港鎮", "琉球鄉", "佳冬鄉", "新園鄉", "枋寮鄉", "枋山鄉", "春日鄉", "獅子鄉", "車城鄉", "牡丹鄉", "恆春鎮", "滿州鄉"],
        "宜蘭縣": ["宜蘭市", "頭城鎮", "礁溪鄉", "壯圍鄉", "員山鄉", "羅東鎮", "三星鄉", "大同鄉", "五結鄉", "冬山鄉", "蘇澳鎮", "南澳鄉"],
        "花蓮縣": ["花蓮市", "新城鄉", "秀林鄉", "吉安鄉", "壽豐鄉", "鳳林鎮", "光復鄉", "豐濱鄉", "瑞穗鄉", "萬榮鄉", "玉里鎮", "卓溪鄉", "富里鄉"],
        "臺東縣": ["臺東市", "綠島鄉", "蘭嶼鄉", "延平鄉", "卑南鄉", "鹿野鄉", "關山鎮", "海端鄉", "池上鄉", "東河鄉", "成功鎮", "長濱鄉", "太麻里鄉", "金峰鄉", "大武鄉", "達仁鄉"],
        "澎湖縣": ["馬公市", "西嶼鄉", "望安鄉", "七美鄉", "白沙鄉", "湖西鄉"],
        "金門縣": ["金沙鎮", "金湖鎮", "金寧鄉", "金城鎮", "烈嶼鄉", "烏坵鄉"],
        "連江縣": ["南竿鄉", "北竿鄉", "莒光鄉", "東引鄉"]
    };

    // 2. 取得 DOM 元素
    const citySelect = document.getElementById('citySelect');
    const areaSelect = document.getElementById('areaSelect');
    const detailAddr = document.getElementById('detailAddr');
    const memAddrHidden = document.getElementById('memAddr');

    // 3. 初始化：填入縣市選項
    function initCityOptions() {
        for (const city in taiwanPlaces) {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
        }
    }

    // 4. 工具函式：根據縣市更新區域選項
    function updateAreaOptions(selectedCity) {
        areaSelect.innerHTML = '<option value="">請選擇區域</option>';
        if (selectedCity && taiwanPlaces[selectedCity]) {
            taiwanPlaces[selectedCity].forEach(area => {
                const option = document.createElement('option');
                option.value = area;
                option.textContent = area;
                areaSelect.appendChild(option);
            });
        }
    }

    // 5. 核心邏輯：從隱藏欄位回填 (Restore) 地址到選單
    function restoreAddress() {
        const fullAddr = memAddrHidden.value;

        // 如果沒有值，直接結束
        if (!fullAddr) return;

        let remainingAddr = fullAddr;
        let foundCity = "";
        let foundArea = "";

        // (A) 找縣市
        // 我們遍歷所有縣市名稱，看地址是否以某個縣市開頭
        for (const city in taiwanPlaces) {
            if (remainingAddr.startsWith(city)) {
                foundCity = city;
                // 將縣市從字串中切掉
                remainingAddr = remainingAddr.substring(city.length);
                break;
            }
        }

        // 如果找到縣市，就設定選單並產生區域選項
        if (foundCity) {
            citySelect.value = foundCity;
            updateAreaOptions(foundCity);

            // (B) 找區域 (只找該縣市底下的區域)
            const areas = taiwanPlaces[foundCity];
            for (const area of areas) {
                if (remainingAddr.startsWith(area)) {
                    foundArea = area;
                    // 將區域從字串中切掉
                    remainingAddr = remainingAddr.substring(area.length);
                    break;
                }
            }

            if (foundArea) {
                areaSelect.value = foundArea;
            }
        }

        // (C) 剩下的就是詳細地址
        detailAddr.value = remainingAddr;
    }

    // 6. 監聽器設定
    citySelect.addEventListener('change', function() {
        updateAreaOptions(this.value);
        updateHiddenAddr(); // 縣市變更也要更新 hidden
    });

    areaSelect.addEventListener('change', updateHiddenAddr);
    detailAddr.addEventListener('input', updateHiddenAddr);

    function updateHiddenAddr() {
        const city = citySelect.value;
        const area = areaSelect.value;
        const detail = detailAddr.value;
        // 組合字串存回 hidden input
        memAddrHidden.value = (city || "") + (area || "") + (detail || "");
    }

    // 7. 程式進入點：初始化並嘗試回填
    initCityOptions();
    restoreAddress(); // 這裡會讀取 Thymeleaf 填入的 value 並拆解回去

</script>
<script th:src="@{/js/front-end/members/register.js}"></script>

</body>
</html>
