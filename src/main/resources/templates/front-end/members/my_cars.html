<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Garage - Autopile</title>

    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" th:href="@{/css/front-end/members/profile.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<header>
    <div class="top-bar">
        <div>XXXXXXXXXXXXXXXXXXXXXXXXXX</div>
        <div class="top-icons">
            <div class="search-box">
                <input type="text" placeholder="Search..." style="background: transparent; border: none; color: white; width: 100%; outline: none;">
                <span>🔍</span>
            </div>
            <div class="user-dropdown-container">
                <span id="user-icon" style="cursor: pointer;">👤</span>
            </div>
            <span id="cart">🛒</span>
        </div>
    </div>
    <div class="main-header">
        <div class="logo">卡爾夏</div>
        <nav class="nav-links">
            <a href="#">商城</a> <a href="#">安裝區</a> <a href="#">論壇</a> <a href="#">公告</a>
        </nav>
    </div>
</header>

<div class="container">

    <aside>
        <div class="sidebar-section">
            <h3 class="sidebar-title">會員中心</h3>
            <ul class="category-list">
                <li><a th:href="@{/members/profile}">個人資料</a></li>
                <li><a href="#">我的訂單</a></li>
                <li><a href="#">預約紀錄</a></li>
                <li class="active">個人汽車</li>
                <li>
                    <form th:action="@{/members/logout}" method="post" id="logoutForm" style="display: inline;">
                        <a href="javascript:void(0);" onclick="document.getElementById('logoutForm').submit();">登出</a>
                    </form>
                </li>
            </ul>
        </div>
    </aside>

    <main class="main-section">
        <div class="profile-container">

            <div class="profile-header">
                <h2 class="title">我的車庫</h2>
                <p class="subtitle">Manage your vehicles here</p>
            </div>

            <div class="car-list-container">

                <div th:if="${#lists.isEmpty(myCars)}" style="text-align: center; padding: 40px; color: #666;">
                    <i class="fas fa-warehouse" style="font-size: 48px; margin-bottom: 10px;"></i>
                    <p>您的車庫目前空空如也...</p>
                </div>

                <div class="car-item" th:each="car : ${myCars}">
                    <div class="car-info">
                        <div class="car-icon-box">
                            <i class="fas fa-car"></i>
                        </div>
                        <div class="car-text">
                            <h4>
                                <span th:text="${car.carCategory.make}">Toyota</span>
                                <span th:text="${car.carCategory.carName}">Altis</span>
                            </h4>

                            <p>
                                生產年份: <span th:text="${car.carCategory.prodInterval}">2010-2015</span>
                            </p>
                        </div>
                    </div>

                    <div class="car-actions">
                        <form th:action="@{/members/cars/delete}" method="post" onsubmit="return confirm('確定要將這輛愛車移出車庫嗎？');">
                            <input type="hidden" name="memberCarNo" th:value="${car.memberCarNo}">
                            <button type="submit" class="btn-delete">
                                <i class="fas fa-trash-alt"></i> 移除
                            </button>
                        </form>
                    </div>
                </div>

            </div>

            <div class="add-car-section">
                <div class="section-header">
                    <h3>新增愛車</h3>
                </div>

                <form th:action="@{/members/cars/add}" method="post" th:object="${newCar}" class="add-car-form">
                    <div class="form-group">
                        <label style="color: #aaa; font-size: 12px; display: block; margin-bottom: 8px; letter-spacing: 1px;">選擇車型 MODEL</label>

                        <select th:field="*{carCategory.carCategoryNo}" class="custom-select" required>
                            <option value="" disabled selected>請選擇您的車款...</option>

                            <option th:each="cat : ${carCategories}"
                                    th:value="${cat.carCategoryNo}"
                                    th:text="|${cat.make} - ${cat.carName} (${cat.prodInterval})|">
                                Toyota - Altis (2010-2015) </option>
                        </select>
                    </div>

                    <div class="form-group">
                        <button type="submit" class="btn-add">
                            <i class="fas fa-plus-circle"></i> 加入車庫
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </main>
</div>

<footer>
    <div class="footer-col"><div class="footer-logo logo">卡爾夏</div></div>
</footer>

</body>
</html>
