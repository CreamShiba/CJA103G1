<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile - 卡爾夏</title>

    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" th:href="@{/css/front-end/members/update.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body>

<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="container">

    <aside th:replace="~{fragments/member_center_sidebar :: memberCenterSidebar}"></aside>

    <main class="main-section">
        <div class="profile-container">

            <div class="profile-header">
                <h2 class="title">編輯個人資料</h2>
                <p class="subtitle">Update your personal details</p>
            </div>

            <div th:if="${errorMsgs}" class="error-box">
                <ul>
                    <li th:each="msg : ${errorMsgs}" th:text="${msg}">Error Message</li>
                </ul>
            </div>

            <form th:action="@{/members/update}" method="post" enctype="multipart/form-data" th:object="${membersVO}">

                <input type="hidden" th:field="*{memNo}">

                <div class="avatar-section">
                    <div class="avatar-wrapper">
                        <img id="avatarPreview"
                             th:src="${membersVO.memAvatar != null and not #lists.isEmpty(membersVO.memAvatar)} ? @{/members/DBGifReader(memNo=${membersVO.memNo},type='memAvatar')} : @{/images/user.png}"
                             onerror="this.src='/images/user.png'"
                             alt="Avatar Preview" />

                        <input type="file" id="imageUpload" name="memAvatarFile" accept="image/*" onchange="previewImage(this)">

                        <label for="imageUpload" class="upload-icon">
                            <i class="fas fa-camera"></i>
                        </label>
                    </div>
                    <p class="hint-text">點擊相機圖示更換頭像</p>
                </div>

                <div class="info-grid">

                    <div class="form-group">
                        <label>會員帳號 (不可修改)</label>
                        <input type="text" th:field="*{memAcc}" class="form-control readonly" readonly>
                    </div>

                    <div class="form-group">
                        <label>會員密碼</label>
                        <input type="text" th:field="*{memPwd}" class="form-control" placeholder="請輸入密碼">
                    </div>

                    <div class="form-group">
                        <label>顯示暱稱</label>
                        <input type="text" th:field="*{memUsername}" class="form-control" placeholder="請輸入暱稱">
                    </div>

                    <div class="form-group">
                        <label>真實姓名</label>
                        <input type="text" th:field="*{memName}" class="form-control" placeholder="請輸入姓名">
                    </div>

                    <div class="form-group">
                        <label>手機號碼</label>
                        <input type="text" th:field="*{memMobile}" class="form-control" placeholder="09xxxxxxxx">
                    </div>

                    <div class="form-group">
                        <label>電子信箱</label>
                        <input type="email" th:field="*{memEmail}" class="form-control" placeholder="name@example.com">
                    </div>

                    <div class="form-group full-width">
                        <label>聯絡地址</label>

                        <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                            <select id="citySelect" class="form-control" style="flex: 1;">
                                <option value="">請選擇縣市</option>
                            </select>

                            <select id="areaSelect" class="form-control" style="flex: 1;">
                                <option value="">請選擇區域</option>
                            </select>
                        </div>

                        <input type="text" id="detailAddr" class="form-control" placeholder="請輸入街道、巷弄、門牌樓層">

                        <input type="hidden" id="memAddr" th:field="*{memAddr}">
                    </div>

                </div>

                <div class="action-footer">
                    <button type="submit" class="save-btn">
                        <i class="fas fa-save"></i> 儲存變更
                    </button>
                    <a th:href="@{/members/view}" class="cancel-btn">取消</a>
                </div>

            </form>
        </div>
    </main>
</div>

<footer>
    <div class="footer-col"><div class="footer-logo logo">卡爾夏</div></div>
    <div class="footer-col"><h4>Shop</h4><ul><li>Shop Parts</li><li>Wheels & Tires</li></ul></div>
    <div class="footer-col"><h4>Support</h4><ul><li>Installation</li><li>FAQ</li></ul></div>
    <div class="footer-col"><h4>Company</h4><ul><li>About Us</li><li>Contact</li></ul></div>
    <div class="footer-col"><h4>Newsletter</h4><input type="text" placeholder="Enter email" style="width:100%; padding:8px;"></div>
</footer>

<script>
    function previewImage(input) {
        if (input.files && input.files[0]) {
            var reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('avatarPreview').src = e.target.result;
            }
            reader.readAsDataURL(input.files[0]);
        }
    }
</script>

        "金門縣": ["金沙鎮", "金湖鎮", "金寧鄉", "金城鎮", "烈嶼鄉", "烏坵鄉"],
        "連江縣": ["南竿鄉", "北竿鄉", "莒光鄉", "東引鄉"]

    const citySelect = document.getElementById('citySelect');
    const areaSelect = document.getElementById('areaSelect');
    const detailAddr = document.getElementById('detailAddr');
    const memAddrHidden = document.getElementById('memAddr');

    // 1. 初始化縣市選單
    function initCityOptions() {
        for (const city in taiwanPlaces) {
            const option = document.createElement('option');
            option.value = city;
            option.textContent = city;
            citySelect.appendChild(option);
        }
    }

    // 2. 更新區域選單
    function updateAreaOptions(selectedCity) {
        areaSelect.innerHTML = '<option value="">請選擇區域</option>';
        if (selectedCity && taiwanPlaces[selectedCity]) {
            taiwanPlaces[selectedCity].forEach(area => {
                const option = document.createElement('option');
                option.value = area;
                option.textContent = area;
                areaSelect.appendChild(option);
            });
        }
    }

    // 3. 核心：初始化地址 (從 Hidden Input 反解回選單)
    function initAddress() {
        const fullAddr = memAddrHidden.value;
        if (!fullAddr) return;

        let remainingAddr = fullAddr;
        let foundCity = "";
        let foundArea = "";

        // 嘗試匹配縣市
        for (const city in taiwanPlaces) {
            if (remainingAddr.startsWith(city)) {
                foundCity = city;
                remainingAddr = remainingAddr.substring(city.length);
                break;
            }
        }

        if (foundCity) {
            citySelect.value = foundCity;
            updateAreaOptions(foundCity); // 產生對應區域選單

            // 嘗試匹配區域
            const areas = taiwanPlaces[foundCity];
            for (const area of areas) {
                if (remainingAddr.startsWith(area)) {
                    foundArea = area;
                    remainingAddr = remainingAddr.substring(area.length);
                    break;
                }
            }

            if (foundArea) {
                areaSelect.value = foundArea;
            }
        }

        // 剩下的字串就是詳細地址
        detailAddr.value = remainingAddr;
    }

    // 4. 監聽變更事件 (組合地址回填 hidden)
    function updateHiddenAddr() {
        const city = citySelect.value;
        const area = areaSelect.value;
        const detail = detailAddr.value;
        memAddrHidden.value = (city || "") + (area || "") + (detail || "");
    }

    citySelect.addEventListener('change', function() {
        updateAreaOptions(this.value);
        updateHiddenAddr();
    });

    areaSelect.addEventListener('change', updateHiddenAddr);
    detailAddr.addEventListener('input', updateHiddenAddr);

    // 5. 執行初始化
    initCityOptions();
    initAddress(); // 這裡會把資料庫抓出來的地址自動填回去

</script>

</html>
