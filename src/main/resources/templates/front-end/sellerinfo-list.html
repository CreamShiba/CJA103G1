<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編輯賣家資料 - 卡爾夏汽車百貨</title>
    <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/sellerinfo-list.css}">
</head>
<body>

<div class="apply-container">
    <!-- 標題區 -->
    <div class="apply-header">
        <button class="back-btn" onclick="window.location.href='/members/home'">
            <i class="fas fa-arrow-left"></i> 返回首頁
        </button>

        <div class="header-content">
            <h1>
                <i class="fas fa-store"></i>
                編輯賣家資料
            </h1>
            <p>管理您的店鋪資訊與帳號設定</p>

            <!-- ✅ 狀態徽章 - 新增「未通過」狀態 -->
            <span th:class="'status-badge status-' + ${seller.status}"
                  th:text="${seller.status == '待審核' ? '待審核' :
                           (seller.status == '已開通' ? '已開通' :
                           (seller.status == '未通過' ? '未通過' :
                           (seller.status == '停權' ? '停權' : '未知狀態')))}">
            </span>

            <!-- 評價顯示 -->
            <div class="rating-display">
                <i class="fas fa-star"></i>
                <span th:text="${avgRating != null ? avgRating : '0.0'}">0.0</span>
                <span class="rating-count">
                    (<span th:text="${seller.rating_amount != null ? seller.rating_amount : 0}">0</span> 則評價)
                </span>
            </div>
        </div>
    </div>

    <div class="form-content">
        <!-- 提示訊息 -->
        <div th:if="${success}" class="alert alert-success">
            <i class="fas fa-check-circle"></i> <span th:text="${success}"></span>
        </div>
        <div th:if="${error}" class="alert alert-error">
            <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
        </div>

        <!-- ✅ 待審核提示 -->
        <div th:if="${seller.status == '待審核'}" class="alert alert-info">
            <i class="fas fa-info-circle"></i> 您的賣家申請正在審核中,審核通過後即可開始販售商品
        </div>

        <!-- ✅ 未通過提示（新增） -->
        <div th:if="${seller.status == '未通過'}" class="alert alert-warning">
            <i class="fas fa-exclamation-triangle"></i>
            <strong>您的賣家申請未通過審核</strong><br>
            請根據以下原因修改資料後重新提交：<br>
            <span style="color: #d32f2f; font-weight: bold;">
                <!-- 這裡可以加入後台設定的未通過原因，如果有的話 -->
                <!-- th:text="${seller.rejection_reason}" -->
                請確認店鋪資料完整、聯絡資訊正確、銀行帳戶無誤。修改後點擊「儲存變更」，系統將自動重新送出審核。
            </span>
        </div>

        <!-- ✅ 停權提示 -->
        <div th:if="${seller.status == '停權'}" class="alert alert-error">
            <i class="fas fa-ban"></i> 您的賣家帳號已被停權,如有疑問請聯繫客服
        </div>

        <form th:action="@{/members/seller/update}" th:object="${seller}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{seller_no}" />

            <!-- 店鋪資料 -->
            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-store"></i> 店鋪資料
                </h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>賣家編號</label>
                        <input type="text" th:value="${seller.seller_no}" readonly>
                    </div>
                    <div class="form-group">
                        <label>店鋪名稱 <span class="required">*</span></label>
                        <input type="text" th:field="*{shop_name}" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>賣家姓名 <span class="required">*</span></label>
                        <input type="text" th:field="*{seller_name}" required>
                    </div>
                    <div class="form-group">
                        <label>審核狀態</label>
                        <!-- ✅ 狀態對應文字 -->
                        <input type="text"
                               th:value="${seller.status == '待審核' ? '待審核' :
                                         (seller.status == '已開通' ? '已開通' :
                                         (seller.status == '未通過' ? '未通過' :
                                         (seller.status == '停權' ? '停權' : '未知狀態')))}"
                               readonly>
                    </div>
                </div>

                <div class="form-group">
                    <label>統一編號</label>
                    <input type="text" th:field="*{seller_tax_id}"
                           placeholder="請輸入統一編號(選填，8位數字)"
                           maxlength="8"
                           pattern="[0-9]{8}">
                    <small style="color: #666; font-size: 12px;">若為公司或行號請填寫，個人賣家可不填</small>
                </div>

                <div class="form-group">
                    <label>店鋪簡介</label>
                    <textarea th:field="*{description}" placeholder="介紹一下您的店鋪特色..."></textarea>
                </div>
            </div>

            <!-- 聯絡資訊 -->
            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-address-card"></i> 聯絡資訊
                </h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>聯絡電話 <span class="required">*</span></label>
                        <input type="tel" th:field="*{phone}" required placeholder="0912-345-678">
                    </div>
                    <div class="form-group">
                        <label>電子郵件 <span class="required">*</span></label>
                        <input type="email" th:field="*{email}" required placeholder="example@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>店鋪地址</label>
                    <input type="text" th:field="*{address}" placeholder="請輸入完整地址(選填)">
                </div>
            </div>

            <!-- 收款帳戶 -->
            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-piggy-bank"></i> 收款帳戶
                </h3>

                <div class="form-row">
                    <div class="form-group">
                        <label>銀行名稱 <span class="required">*</span></label>
                        <input type="text" th:field="*{bank_name}" required placeholder="例如: 玉山銀行">
                    </div>
                    <div class="form-group">
                        <label>銀行代碼 <span class="required">*</span></label>
                        <input type="text" th:field="*{bank_code}" required placeholder="例如: 808" maxlength="10">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>銀行帳號 <span class="required">*</span></label>
                        <input type="text" th:field="*{bank_account}" required placeholder="請輸入完整帳號">
                    </div>
                    <div class="form-group">
                        <label>戶名 <span class="required">*</span></label>
                        <input type="text" th:field="*{account_holder}" required placeholder="請輸入戶名">
                    </div>
                </div>
            </div>

            <!-- 店鋪圖片 -->
            <div class="form-section">
                <h3 class="section-title">
                    <i class="fas fa-image"></i> 店鋪圖片
                </h3>

                <div class="image-section">
                    <!-- 現有圖片 -->
                    <img th:src="@{${seller.image_path}(v=${#dates.createNow().getTime()})}"
                         alt="店鋪圖片"
                         style="width: 150px; height: 150px; object-fit: cover; display: block !important; visibility: visible !important;">

                    <!-- 預覽新圖片 -->
                    <div class="image-preview" id="image-preview">
                        <img id="preview-img" alt="預覽圖片">
                        <p style="margin-top: 10px; color: #666; font-size: 14px;">新圖片預覽</p>
                    </div>

                    <!-- 上傳按鈕 -->
                    <div class="form-group">
                        <label for="file-input" class="upload-label">
                            <i class="fas fa-upload"></i>
                            <span id="upload-text" th:text="${seller.image_path != null and seller.image_path != '' ? '更換圖片' : '選擇圖片'}">選擇圖片</span>
                        </label>
                        <input type="file" id="file-input" name="file" accept="image/*" style="display: none;">
                    </div>

                    <p class="upload-hint">
                        支持 JPG, PNG, GIF 格式<br>
                        建議尺寸: 500x500px,最大 5MB
                    </p>
                </div>
            </div>

            <!-- 按鈕 -->
            <div class="btn-group">
                <button th:if="${seller.status == '已開通'}"
                        type="button" class="btn btn-info"
                        onclick="window.location.href='/product/dashboard'">
                    <i class="fas fa-tachometer-alt"></i> 前往賣家中心
                </button>

                <button th:if="${seller.status != '已開通'}"
                        type="button" class="btn btn-secondary"
                        onclick="window.location.href='/members/home'">
                    <i class="fas fa-home"></i> 返回商城首頁
                </button>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i>
                    <span th:text="${seller.status == '未通過' ? '重新送審' : '儲存變更'}">儲存變更</span>
                </button>
            </div>
        </form>
    </div>
</div>

<script th:src="@{/js/front-end/sellerinfo-list.js}"></script>

</body>
</html>
