<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>購物車 - 卡爾夫汽車百貨</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/front-end/cart-list.css}">
  <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
</head>
<body>

<header>
  <div class="top-bar">
    <div>XXXXXXXXXXXXXXXXXXXXXXXXXX</div>
    <div class="top-icons">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search..."
               style="background: transparent; border: none; color: white; width: 100%; outline: none;">
        <span>🔍</span>
      </div>
      <div class="user-dropdown-container">
        <span id="user-icon" style="cursor: pointer;">👤</span>
        <div id="user-dropdown" class="dropdown-menu">

          <th:block th:if="${session.member == null}">
            <a th:href="@{/members/login}">登入</a>
            <a th:href="@{/members/register}">註冊</a>
          </th:block>

          <th:block th:if="${session.member != null}">
                      <span style="display:block; padding: 12px 16px; color: #888; font-size: 14px; border-bottom: 1px solid #333;"
                            th:text="'Hi, ' + ${session.member.memUsername}">
                         Hi, 會員
                      </span>

            <a th:href="@{/members/view}">編輯個人資料</a>
            <a href="#">我的訂單</a>
            <form th:action="@{/members/logout}" method="post" id="logoutForm">
              <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">
                登出 (Logout)
              </a>
            </form>
          </th:block>
        </div>
      </div>
      <span id="cart-icon" th:onclick="|window.location.href='@{/cart/list}'|" style="cursor: pointer; position: relative;"> 🛒
      </span>
    </div>
  </div>

  <div class="main-header">
    <div class="logo" th:onclick="|window.location.href='@{/shop}'|" style="cursor: pointer;">卡爾夫</div>
    <nav class="nav-links">
      <a th:href="@{/shop}">商城</a>
      <a href="#">安裝廠</a>
      <a href="#">論壇</a>
      <a th:href="@{/members/announcement}">公告</a>
      <a th:href="@{/members/faq}">常見問題</a>
    </nav>
  </div>
</header>

<div class="cart-main">
  <a th:href="@{/shop}" class="back-link">
    <i class="fas fa-arrow-left"></i> 返回商城
  </a>

  <div th:if="${success}" class="alert alert-success"><span th:text="${success}"></span></div>
  <div th:if="${error}" class="alert alert-error"><span th:text="${error}"></span></div>

  <div class="cart-header">
    <h1><i class="fas fa-shopping-cart"></i> 我的購物車</h1>
    <div class="select-all-container">
      <input type="checkbox" id="selectAll" onclick="toggleAll(this)">
      <label for="selectAll" style="color: white; cursor: pointer;"> 全選商品</label>
    </div>
  </div>

  <div th:if="${itemCount > 0}">
    <div th:each="item : ${cartItems}" class="cart-item"
         th:attr="data-price=${productMap.get(item.prod_no)?.prodPrice}, data-prod-no=${item.prod_no}">

      <div class="item-checkbox">
        <input type="checkbox" name="selectedItems"
               th:value="${item.prod_no}"
               class="item-check"
               th:attr="data-qty=${item.quantity}"
               onclick="updateSummary()">
      </div>

      <div class="item-image">
        <th:block th:with="product=${productMap.get(item.prod_no)}">
          <img th:if="${product != null and product.productImage != null}"
               th:src="@{'/product/showImage/' + ${item.prod_no}}" alt="商品圖片">
          <i th:if="${product == null || product.productImage == null}" class="fas fa-car"></i>
        </th:block>
      </div>

      <div class="item-info">
        <th:block th:with="product=${productMap.get(item.prod_no)}">
          <div class="item-name" th:text="${product?.prodName}">商品名稱</div>
          <div class="item-price">NT$ <span class="unit-price" th:text="${product?.prodPrice}">0</span></div>

          <div class="stock-warning" th:if="${product != null and item.quantity > product.prodQty}">
            <i class="fas fa-exclamation-triangle"></i> 庫存不足 (剩 <span th:text="${product.prodQty}"></span>)
          </div>
        </th:block>
      </div>

      <div class="quantity-controls">
        <button type="button" class="qty-btn" th:onclick="|changeQty(${item.prod_no}, ${item.quantity - 1})|" th:disabled="${item.quantity <= 1}">−</button>
        <input type="number" class="qty-input" th:value="${item.quantity}" readonly>
        <button type="button" class="qty-btn" th:onclick="|changeQty(${item.prod_no}, ${item.quantity + 1})|">+</button>
      </div>

      <div class="item-right">
        <div class="item-subtotal">
          NT$ <span th:text="${#numbers.formatInteger(productMap.get(item.prod_no).prodPrice * item.quantity, 0, 'COMMA')}">0</span>
        </div>
        <form th:action="@{/cart/remove}" method="post">
          <input type="hidden" name="prodNo" th:value="${item.prod_no}">
          <button type="submit" class="btn-remove" onclick="return confirm('確定移除?')"><i class="fas fa-trash"></i></button>
        </form>
      </div>
    </div>

    <div class="cart-footer">
      <div class="cart-summary">
        <span class="summary-label">已選 <span id="checkedCount" style="color:#ff3333; font-weight:bold;">0</span> 項商品</span>
        <span class="summary-value">合計: <span style="color:#ff3333; font-size: 24px;">NT$ <span id="checkedTotal">0</span></span></span>
      </div>
      <div class="cart-actions">
        <form th:action="@{/cart/clear}" method="post" style="display:inline;">
          <button type="submit" class="btn btn-clear" onclick="return confirm('確定清空?')">清空購物車</button>
        </form>

        <form id="checkoutForm" th:action="@{/cart/checkout}" method="get" style="display:inline;">
          <input type="hidden" name="prodNos" id="selectedProdNos">
          <button type="button" class="btn btn-payment" onclick="goToCheckout()">
            <i class="fas fa-credit-card"></i> 前往結帳
          </button>
        </form>
      </div>
    </div>
  </div>

  <div th:if="${itemCount == 0}" class="empty-cart">
    <i class="fas fa-shopping-cart"></i>
    <h2>購物車是空的</h2>
    <a th:href="@{/shop}" class="btn-shop">去逛逛</a>
  </div>
</div>

<!-- ✅ 引入修正後的 JS -->
<script th:src="@{/js/front-end/cart-list.js}"></script>
<script th:src="@{/js/front-end/index.js}"></script>

</body>
</html>
