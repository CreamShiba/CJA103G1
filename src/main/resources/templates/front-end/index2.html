<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡爾夏汽車周邊平台</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/index2.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/front_sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">

</head>
<body>
<header th:replace="~{fragments/front_header :: frontHeader}"></header>

<div class="container">

<aside th:replace="~{fragments/front_sidebar :: frontSidebar}"></aside>
    <main style="flex: 1;">

        <div th:if="${currentSeller != null}"
             style="background: rgba(255, 51, 51, 0.1); border: 1px solid #ff3333; color: #ff3333; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center;">

            <div style="display: flex; align-items: center; gap: 12px;">
                <img th:src="${currentSeller.imagePath != null && currentSeller.imagePath != '' ? currentSeller.imagePath : 'https://ui-avatars.com/api/?name=' + (currentSeller.shopName != null && currentSeller.shopName != '' ? currentSeller.shopName : currentSeller.sellerName) + '&background=random'}"
                     alt="賣家頭像"
                     style="width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255, 51, 51, 0.5);">

                <span style="font-size: 15px; font-weight: 500; display: flex; align-items: center;">
            <i class="fas fa-store-alt" style="margin-right: 8px; font-size: 18px;"></i>
            您正在瀏覽
            <span th:text="${currentSeller.shopName != null && currentSeller.shopName != '' ? currentSeller.shopName : currentSeller.sellerName}"
                  style="font-weight: bold; margin: 0 5px; color: white; border-bottom: 1px dashed #ff3333; font-size: 1.1em;">
            </span>
            的專屬賣場
        </span>
            </div>

            <a th:href="@{/shop}"
               style="background: #ff3333; color: white; padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: bold; text-decoration: none; display: flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);">
                <i class="fas fa-home"></i> 返回商城首頁
            </a>
        </div>


        <div th:if="${productPage.totalElements == 0}"
             style="text-align: center; padding: 60px 20px; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px dashed #444; margin-top: 20px;">

            <div style="font-size: 50px; margin-bottom: 20px; opacity: 0.5;">🔍</div>
            <h3 style="color: #fff; margin-bottom: 10px;">找不到相關商品</h3>
            <p style="color: #aaa; font-size: 14px; margin-bottom: 25px;">
                我們找不到符合您搜尋條件的商品，請嘗試更換關鍵字或調整價格範圍。
            </p>

            <a th:href="@{/shop(carCategoryNo=${carCategoryNo},sellerNo=${sellerNo})}"
               style="display: inline-block; padding: 10px 25px; background: #333; color: white; border-radius: 30px; text-decoration: none; font-size: 14px; transition: 0.3s;">
                <i class="fas fa-undo"></i> 清除搜尋條件
            </a>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;">

            <div th:each="product : ${productPage.content}"
                 class="product-card-link"
                 style="text-decoration: none; color: inherit; cursor: pointer; position: relative;"
                 th:onclick="|window.location.href='@{/product/detail(prodNo=${product.prodNo})}'|">

                <div class="product-card">

                    <div class="product-img-container">
                        <img th:src="@{/product/displayMain(prodNo=${product.prodNo})}"
                             loading="lazy"
                             decoding="async"
                             class="product-img-skeleton"
                             alt="商品圖片"
                             onload="this.style.animation='none'; this.style.backgroundImage='none'; this.style.backgroundColor='transparent';">

                        <a th:href="@{/shop(productCategoryNo=${product.productCategory.productCategoryNo}, carCategoryNo=${product.carCategory != null ? product.carCategory.carCategoryNo : ''})}"
                           class="find-similar-btn"
                           onclick="event.stopPropagation();">
                            找相似
                        </a>
                    </div>

                    <div style="padding: 15px 20px 20px 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <h3 th:text="${product.prodName}"
                                style="font-size: 1rem; margin-bottom: 8px; color: #fff; font-weight: 500;">商品名稱</h3>

                            <div class="product-rating"
                                 th:with="avg=${product.ratingAmount > 0 ? (product.ratingStar * 1.0 / product.ratingAmount) : 0}">
                                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                    <i class="fas fa-star" th:if="${avg >= i}"></i>
                                    <i class="fas fa-star-half-alt" th:if="${avg < i and avg >= i - 0.5}"></i>
                                    <i class="far fa-star" style="color: #444;" th:if="${avg < i - 0.5}"></i>
                                </th:block>
                                <span class="rating-count" th:text="'(' + ${product.ratingAmount} + ')'"></span>
                            </div>
                        </div>

                        <span style="color: #ff3333; font-size: 1.1rem; font-weight: bold; display: block; margin-top: 10px;"
                              th:text="${'$' + #numbers.formatInteger(product.prodPrice, 1, 'COMMA')}">
                        </span>
                    </div>

                </div>
            </div>
        </div>

        <div class="pagination-area" th:if="${productPage.totalPages > 0}" style="margin-top: 40px; text-align: center;">

            <a th:if="${!productPage.first}"
               th:href="@{/shop(page=1, keyword=${keyword}, productCategoryNo=${productCategoryNo}, carCategoryNo=${carCategoryNo}, sellerNo=${sellerNo}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               class="page-btn" title="回到第一頁">
                <i class="fas fa-angle-double-left"></i>
            </a>

            <a th:if="${productPage.hasPrevious()}"
               th:href="@{/shop(page=${currentPage - 1}, keyword=${keyword}, productCategoryNo=${productCategoryNo}, carCategoryNo=${carCategoryNo}, sellerNo=${sellerNo}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               class="page-btn">
                <i class="fas fa-chevron-left"></i>
            </a>

            <span th:each="i : ${#numbers.sequence(1, productPage.totalPages)}">
                <a th:href="@{/shop(page=${i}, keyword=${keyword}, productCategoryNo=${productCategoryNo}, carCategoryNo=${carCategoryNo}, sellerNo=${sellerNo}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
                   th:text="${i}"
                   class="page-btn"
                   th:classappend="${currentPage == i} ? 'active'">1</a>
            </span>

            <a th:if="${productPage.hasNext()}"
               th:href="@{/shop(page=${currentPage + 1}, keyword=${keyword}, productCategoryNo=${productCategoryNo}, carCategoryNo=${carCategoryNo}, sellerNo=${sellerNo}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               class="page-btn">
                <i class="fas fa-chevron-right"></i>
            </a>

            <a th:if="${!productPage.last}"
               th:href="@{/shop(page=${productPage.totalPages}, keyword=${keyword}, productCategoryNo=${productCategoryNo}, carCategoryNo=${carCategoryNo}, sellerNo=${sellerNo}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               class="page-btn" title="跳到最後一頁">
                <i class="fas fa-angle-double-right"></i>
            </a>
        </div>
    </main>
</div>

<footer th:replace="~{/fragments/footer :: Footer}"></footer>

<div class="chat-btn"></div>

<script th:src="@{/js/front-end/index2.js}"></script>

</body>
</html>
