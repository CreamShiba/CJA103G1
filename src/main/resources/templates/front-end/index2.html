<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卡爾夏汽車百貨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/front-end/index2.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
</head>
<body>

<header>
    <div class="top-bar">
        <div>XXXXXXXXXXXXXXXXXXXXXXXXXX</div>
        <div class="top-icons">
            <div class="search-box">
                <form th:action="@{/product/shop}" method="get" style="display: flex; width: 100%; align-items: center;">
                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search..."
                           style="background: transparent; border: none; color: white; width: 100%; outline: none;">
                    <button type="submit" style="background: transparent; border: none; cursor: pointer; padding: 0;">
                        <span style="font-size: 16px;">🔍</span>
                    </button>
                </form>
            </div>
            <div class="user-dropdown-container">
                <span id="user-icon" style="cursor: pointer;">👤</span>
                <div id="user-dropdown" class="dropdown-menu">
                    <a href="#">登入</a> <a href="#">註冊</a>
                </div>
            </div>
            <span id="cart">🛒</span>
        </div>
    </div>

    <div class="main-header">
        <a th:href="@{/product/shop}" class="logo">卡爾夏</a>
        <nav class="nav-links">
            <a th:href="@{/product/shop}">商城</a>
            <a href="#">安裝區</a>
            <a href="#">論壇</a>
            <a href="#">公告</a>
            <a href="#">常見問題</a>

            <!-- 會員中心下拉選單 -->
            <div class="user-dropdown-container">
                <a href="javascript:void(0)" id="member-center-trigger">會員中心 ▾</a>
                <div id="member-dropdown" class="dropdown-menu">
                    <a href="#" onclick="navigateTo('coupons')">我的優惠券</a>
                    <a href="#" onclick="navigateTo('favorite')">我的收藏</a>
                    <a href="#" onclick="navigateTo('orderInfo')">訂單查詢</a>
                </div>
            </div>
        </nav>
    </div>
</header>

<div class="container">

    <aside>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Browse by</h3>
            <ul class="category-list" id="category-list">
                <li>
                    <a th:href="@{/product/shop}"
                       th:style="${productCategoryNo == null} ? 'color: #ff3333; font-weight: bold;' : ''">
                        所有商品
                    </a>
                </li>
                <li th:each="cat : ${categoryList}">
                    <a th:href="@{/product/shop(productCategoryNo=${cat.productCategoryNo})}"
                       th:text="${cat.productCategoryName}"
                       th:style="${productCategoryNo == cat.productCategoryNo} ? 'color: #ff3333; font-weight: bold;' : ''">
                        分類名稱
                    </a>
                </li>
            </ul>
        </div>
    </aside>

    <main style="flex: 1;">
        <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px;">

            <a th:each="product : ${productPage.content}"
               th:href="@{/product/detail(prodNo=${product.prodNo})}"
               class="product-card-link"
               style="text-decoration: none; color: inherit;">

                <div class="product-card"
                     style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; overflow: hidden; transition: 0.3s; height: 100%; padding-top: 15px; display: flex; flex-direction: column;">

                    <div style="width: 85%; height: 200px; margin: 0 auto; background: #000; border-radius: 8px; overflow: hidden;">
                        <img th:src="@{/product/displayMain(prodNo=${product.prodNo})}"
                             style="width: 100%; height: 100%; object-fit: contain; transition: 0.5s;">
                    </div>

                    <div style="padding: 15px 20px 20px 20px; text-align: center; flex-grow: 1; display: flex; flex-direction: column; justify-content: space-between;">
                        <div>
                            <h3 th:text="${product.prodName}"
                                style="font-size: 1rem; margin-bottom: 8px; color: #fff; font-weight: 500;">商品名稱</h3>

                            <div class="product-rating"
                                 th:with="avg=${product.ratingAmount > 0 ? (product.ratingStar * 1.0 / product.ratingAmount) : 0}">
                                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                    <i class="fas fa-star" th:if="${avg >= i}"></i>
                                    <i class="fas fa-star-half-alt" th:if="${avg < i and avg >= i - 0.5}"></i>
                                    <i class="far fa-star" style="color: #444;" th:if="${avg < i - 0.5}"></i>
                                </th:block>
                                <span class="rating-count" th:text="'(' + ${product.ratingAmount} + ')'"></span>
                            </div>
                        </div>

                        <span style="color: #ff3333; font-size: 1.1rem; font-weight: bold; display: block; margin-top: 10px;"
                              th:text="${'$' + #numbers.formatInteger(product.prodPrice, 1, 'COMMA')}">
                        </span>
                    </div>
                </div> </a>
        </div>

        <div class="pagination-area" th:if="${productPage.totalPages > 0}" style="margin-top: 40px; text-align: center;">

            <a th:if="${!productPage.first}"
               th:href="@{/product/shop(page=1)}"
               class="page-btn" title="回到第一頁">
                <i class="fas fa-angle-double-left"></i>
            </a>

            <a th:if="${productPage.hasPrevious()}"
               th:href="@{/product/shop(page=${currentPage - 1})}"
               class="page-btn">
                <i class="fas fa-chevron-left"></i>
            </a>

            <span th:each="i : ${#numbers.sequence(1, productPage.totalPages)}">
                <a th:href="@{/product/shop(page=${i})}"
                   th:text="${i}"
                   class="page-btn"
                   th:classappend="${currentPage == i} ? 'active'">1</a>
            </span>

            <a th:if="${productPage.hasNext()}"
               th:href="@{/product/shop(page=${currentPage + 1})}"
               class="page-btn">
                <i class="fas fa-chevron-right"></i>
            </a>

            <a th:if="${!productPage.last}"
               th:href="@{/product/shop(page=${productPage.totalPages})}"
               class="page-btn" title="跳到最後一頁">
                <i class="fas fa-angle-double-right"></i>
            </a>
        </div>
    </main>
</div>
