<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>結帳 - 卡爾夏汽車百貨</title>
  <link rel="stylesheet" th:href="@{/css/front-end/index.css}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/front-end/checkout.css}">
</head>
<body>

<header th:replace="~{front-end/index :: header}"></header>

<div class="checkout-main">
  <div class="checkout-steps">
    <div class="step"><div class="step-number">✓</div><span>購物車</span></div>
    <div class="step-line done"></div>
    <div class="step active"><div class="step-number">2</div><span>確認訂單</span></div>
    <div class="step-line"></div>
    <div class="step"><div class="step-number">3</div><span>完成付款</span></div>
  </div>

  <div class="checkout-container">
    <div class="checkout-left">
      <form id="checkout-form" th:action="@{/cart/process-payment}" method="post">

        <div class="checkout-section">
          <h2 class="section-title"><i class="fas fa-shopping-bag"></i> 訂購清單</h2>
          <div th:each="item : ${cartItems}" class="checkout-item" style="display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #333;">
            <div th:text="${productMap.get(item.prod_no)?.prodName}">商品名稱</div>
            <div style="color:#ff3333;">NT$ <span th:text="${#numbers.formatInteger((productMap.get(item.prod_no)?.prodPrice ?: 0) * item.quantity, 0, 'COMMA')}">0</span></div>
          </div>
        </div>

        <div class="checkout-section">
          <h2 class="section-title"><i class="fas fa-truck"></i> 配送資訊</h2>
          <div class="form-group">
            <label>收件人姓名 (ord_recipient) *</label>
            <input type="text" name="ord_recipient" placeholder="請輸入收件人姓名" required>
          </div>
          <div class="form-group">
            <label>收件人電話 *</label>
            <input type="tel" name="receiverPhone" placeholder="請輸入電話" required>
          </div>
          <div class="form-group">
            <label>收件地址 (ord_address) *</label>
            <input type="text" name="ord_address" id="ord_address" placeholder="請輸入完整地址" required>
          </div>
          <div class="form-group">
            <label>物流方式 (ord_ship_method) *</label>
            <select name="ord_ship_method" id="delivery-method" required onchange="updateShipping()">
              <option value="" disabled selected>--- 請選擇物流方式 ---</option>
              <option value="宅配">宅配到府 (NT$ 100)</option>
              <option value="超取">超商取貨 (NT$ 60)</option>
              <option value="自取">門市自取 (免運費)</option>
            </select>
          </div>
        </div>

        <div class="checkout-section">
          <h2 class="section-title"><i class="fas fa-credit-card"></i> 付款方式</h2>
          <div class="payment-methods">
            <div class="payment-option selected" id="pay-credit" onclick="selectPayment('信用卡')">
              <div class="pay-icon"><i class="fas fa-credit-card"></i></div>
              <div><span class="pay-label">信用卡支付</span><span class="pay-desc">支持多款信用卡</span></div>
            </div>
            <div class="payment-option" id="pay-atm" onclick="selectPayment('轉帳')">
              <div class="pay-icon"><i class="fas fa-university"></i></div>
              <div><span class="pay-label">網路銀行 / ATM 轉帳</span><span class="pay-desc">手動轉帳核帳</span></div>
            </div>
            <div class="payment-option" id="pay-convenience" onclick="selectPayment('超商代收')">
              <div class="pay-icon"><i class="fas fa-store"></i></div>
              <div><span class="pay-label">超商代收</span><span class="pay-desc">代碼繳費</span></div>
            </div>
          </div>
          <input type="hidden" name="ord_payment_method" id="ord_payment_method" value="信用卡">
          <input type="hidden" name="discount_price" id="discount_price" value="0">
          <input type="hidden" name="coupon_no" id="coupon_no" value="">
          <input type="hidden" name="prodNos" th:value="${prodNos}">
        </div>
      </form>
    </div>

    <div class="checkout-right">
      <div class="checkout-section">
        <h2 class="section-title"><i class="fas fa-file-invoice-dollar"></i> 訂單摘要</h2>
        <div class="coupon-box" style="display: block; margin-bottom: 20px;">
          <label style="display: block; margin-bottom: 8px; color: #ccc; font-size: 14px;">使用優惠券：</label>
          <select name="couponNo" id="couponSelect" form="checkout-form"
                  style="width: 100%; background: #000; color: #fff; border: 1px solid #660000; padding: 10px; border-radius: 4px;"
                  onchange="updateOrderTotal()">
            <option value="">--- 不使用優惠券 ---</option>
            <th:block th:each="mc : ${availableCoupons}">
              <option th:if="${mc.coupon != null}"
                      th:value="${mc.couponNo}"
                      th:data-discount="${mc.coupon.discountValue}"
                      th:text="${mc.coupon.couponTitle} + ' (折抵 NT$ ' + ${mc.coupon.discountValue} + ')'">
              </option>
            </th:block>
          </select>
        </div>
        <div id="coupon-msg" style="font-size:12px; margin-bottom:10px;"></div>

        <div class="summary-row">
          <span>商品原價 (origin_price)</span>
          <span>NT$ <span th:text="${#numbers.formatInteger(subtotal, 0, 'COMMA')}">0</span></span>
        </div>
        <div class="summary-row">
          <span>運費費率</span>
          <span id="display-shipping">NT$ 0</span>
        </div>
        <div class="summary-row" id="row-discount" style="color: #4CAF50;">
          <span>優惠券折抵</span>
          <span>- NT$ <span id="display-discount">0</span></span>
        </div>
        <div class="summary-row total">
          <span>實付金額 (ord_price)</span>
          <span class="amount-big">NT$ <span id="display-total">0</span></span>
        </div>
        <button type="button" class="btn-submit" onclick="showModal()">確認結帳</button>
      </div>
    </div>
  </div>
</div>

<div class="confirm-modal" id="confirmModal">
  <div style="background:#1a0000; padding:40px; border-radius:12px; border:1px solid #660000; text-align:center;">
    <h2 style="color:#fff">確認訂單內容？</h2>
    <div style="color:#ff3333; font-size:32px; font-weight:bold; margin:20px 0;">NT$ <span id="modal-amount">0</span></div>
    <div style="display:flex; gap:10px; justify-content:center;">
      <button onclick="document.getElementById('checkout-form').submit()" style="background:#ff3333; color:#fff; border:none; padding:10px 30px; border-radius:6px; cursor:pointer;">確認結帳</button>
      <button onclick="hideModal()" style="background:#333; color:#fff; border:none; padding:10px 30px; border-radius:6px; cursor:pointer;">取消</button>
    </div>
  </div>
</div>

<div class="summary-row">
  <span>商品小計</span>
  <span>NT$ <span id="display-subtotal" th:text="${subtotal}">0</span></span>
</div>

<script th:src="@{/js/front-end/checkout.js}"></script>
<script th:src="@{/js/front-end/index.js}"></script>
</body>
</html>
