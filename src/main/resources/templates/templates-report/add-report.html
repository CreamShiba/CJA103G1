<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>卡爾夏Karshop - 檢舉中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- 1. 基礎佈局 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #2a0000 40%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex; flex-direction: column;
        }

        /* --- 2. Header 修正：解決搜尋框雙重邊線 --- */
        header { background-color: #000; padding: 0 60px; width: 100%; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            height: 50px; border-bottom: 1px solid #1a1a1a;
        }
        .xxx-text { font-size: 13px; letter-spacing: 5px; font-weight: 300; color: #444; }

        .top-right { display: flex; align-items: center; gap: 20px; }

        /* 修正搜尋框：移除 input 的預設外框，只保留 div 的單一邊線 */
        .search-box {
            border: 1px solid #333; background: #000; padding: 4px 12px;
            display: flex; align-items: center; width: 260px; height: 34px;
            border-radius: 4px;
        }
        .search-box input {
            background: transparent; border: none; color: #fff;
            width: 100%; outline: none; font-size: 14px;
        }
        .search-box i { color: #40c4ff; cursor: pointer; font-size: 16px; margin-left: 8px; }

        .user-icon { color: #7b5dc1; font-size: 19px; cursor: pointer; }
        .cart-icon { color: #ccc; font-size: 19px; cursor: pointer; }

        .main-header { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .white-dot { width: 38px; height: 18px; background: white; border-radius: 12px; }
        .brand-name { font-size: 28px; font-weight: bold; letter-spacing: 8px; }

        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: white; text-decoration: none; font-size: 16px; font-weight: 500; }

        /* --- 3. 主佈局 --- */
        .main-layout { display: flex; padding: 60px; max-width: 1400px; margin: 0 auto; flex: 1; width: 100%; }
        aside { width: 240px; flex-shrink: 0; }
        .aside-title { font-size: 32px; font-weight: bold; border-left: 6px solid #cc0000; padding-left: 18px; margin-bottom: 40px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { color: #999; margin-bottom: 25px; font-size: 18px; display: flex; align-items: center; cursor: pointer; }
        .sidebar-menu li.active { color: white; font-weight: bold; }
        .sidebar-menu li::before { content: "•"; color: #777; margin-right: 15px; font-size: 22px; }

        /* --- 4. 檢舉表單 --- */
        .function-area { flex-grow: 1; padding-left: 60px; }
        .report-card { border: 1px solid #4a0000; background-color: rgba(0,0,0,0.5); padding: 50px; max-width: 950px; }
        .report-title { color: #cc0000; font-size: 36px; font-weight: 900; margin-bottom: 12px; }

        .field { margin-bottom: 25px; }
        .field label { display: block; margin-bottom: 12px; font-size: 15px; color: #eee; }
        input[type="text"], select, textarea { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 14px; border-radius: 4px; font-size: 15px; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: #cc0000; }

        .submit-btn { width: 100%; background: #cc0000; border: none; padding: 18px; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 18px; }
        .submit-btn:hover { background: #ff0000; }

        /* --- 5. Footer --- */
        .site-footer { background-color: #000; border-top: 1px solid #1a1a1a; padding: 80px 60px; width: 100%; margin-top: auto; }
        .footer-inner { max-width: 1400px; margin: 0 auto; display: flex; justify-content: space-between; }
        .f-col h4 { color: white; margin-bottom: 25px; font-size: 16px; }
        .f-col ul { list-style: none; }
        .f-col ul li { color: #aaa; margin-bottom: 15px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="xxx-text">XXXXXXXXXXXXXXXXXXXXXXXXXXXXX</div>
        <div class="top-right">
            <div class="search-box">
                <input type="text" placeholder="Search...">
                <i class="fas fa-search"></i>
            </div>
            <i class="fas fa-user user-icon"></i>
            <i class="fas fa-shopping-cart cart-icon"></i>
        </div>
    </div>
    <div class="main-header">
        <div class="logo-group"><div class="white-dot"></div><div class="brand-name">卡爾夏</div></div>
        <nav class="nav-links">
            <a href="#">商城</a><a href="#">安裝區</a><a href="#">論壇</a><a href="#">公告</a><a href="#">常見問題</a>
        </nav>
    </div>
</header>

<div class="main-layout">
    <aside>
        <div class="aside-title">Browse by</div>
        <ul class="sidebar-menu">
            <li class="active">檢舉中心</li><li>檢舉紀錄</li><li>申訴管理</li>
        </ul>
    </aside>

    <main class="function-area">
        <div class="report-card">
            <h1 class="report-title">REPORT CENTER</h1>
            <p style="color: #888; margin-bottom: 40px;">維護社群秩序，檢舉違規行為。</p>

            <form id="reportForm" action="/reports/submit" method="post">
                <div class="field">
                    <label>檢舉對象 (會員帳號/討論區文章ID)</label>
                    <input type="text" id="targetInput" name="reportsTarget" placeholder="請輸入檢舉對象">
                </div>
                <div class="field">
                    <label>檢舉類別</label>
                    <select id="typeSelect" name="reportsType">
                        <option value="">-- 請選擇類別 --</option>
                        <option value="言語攻擊">言語攻擊 / 謾罵</option>
                        <option value="廣告垃圾">廣告垃圾訊息</option>
                        <option value="惡意洗版">惡意洗版</option>
                        <option value="虛假資訊">虛假資訊</option>
                        <option value="其他">其他</option>
                    </select>
                </div>
                <div class="field">
                    <label>檢舉原因 (標題)</label>
                    <input type="text" id="reasonInput" name="reportsReason" placeholder="請輸入原因標題">
                </div>
                <div class="field">
                    <label>違規事實詳述</label>
                    <textarea id="descInput" name="reportsDescription" rows="6" placeholder="請詳細說明違規情況..."></textarea>
                </div>
                <button type="button" class="submit-btn" onclick="validateAndSubmit()">SUBMIT REPORT</button>
            </form>
        </div>
    </main>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="f-logo-area" style="display: flex; align-items: center; gap: 10px;">
            <div class="white-dot" style="width: 28px; height: 13px;"></div>
            <span style="font-size: 22px; font-weight: bold; letter-spacing: 2px;">卡爾夏</span>
        </div>
        <div class="f-col"><h4>Shop</h4><ul><li>Shop Parts</li><li>Wholesale</li></ul></div>
        <div class="f-col"><h4>The Company</h4><ul><li>About Us</li><li>FAQ</li></ul></div>
        <div class="f-col"><h4>Follow Us</h4><ul><li>Instagram</li></ul></div>
    </div>
</footer>

<script>
    function validateAndSubmit() {
        const target = document.getElementById('targetInput').value.trim();
        const type = document.getElementById('typeSelect').value;
        const reason = document.getElementById('reasonInput').value.trim();
        const desc = document.getElementById('descInput').value.trim();

        if (target === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請輸入檢舉對象！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (type === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請選擇檢舉類別！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (reason === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請填寫檢舉原因標題！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (desc === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請詳述違規事實描述！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        document.getElementById('reportForm').submit();
    }
</script>
</body>
</html>
