<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>卡爾夏 - 檢舉中心</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 基礎設定與背景 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #3a0000 40%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
        }

        /* --- 雙層 Header 修正 --- */
        header { background-color: #000; padding: 0 60px; }
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            height: 50px; border-bottom: 1px solid #333;
        }
        .xxx-brand { font-size: 13px; letter-spacing: 5px; color: #ccc; }
        .top-tools { display: flex; align-items: center; gap: 25px; }
        .search-box {
            border: 1px solid #555; background: #000; padding: 5px 12px;
            display: flex; align-items: center; width: 320px;
        }
        .search-box input { background: transparent; border: none; color: white; width: 100%; outline: none; }
        .search-box i { color: #40c4ff; }
        .user-icon { color: #7b5dc1; font-size: 18px; }
        .cart-icon { color: #ccc; font-size: 18px; }

        .main-header { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .white-dot { width: 35px; height: 16px; background: white; border-radius: 10px; }
        .brand-name { font-size: 26px; font-weight: bold; letter-spacing: 6px; }
        .nav-links { display: flex; gap: 35px; }
        .nav-links a { color: white; text-decoration: none; font-size: 15px; }

        /* --- 內容佈局 --- */
        .container { display: flex; padding: 50px 60px; max-width: 1450px; margin: 0 auto; }
        aside { width: 240px; flex-shrink: 0; }
        .aside-title { font-size: 28px; font-weight: bold; border-left: 5px solid #cc0000; padding-left: 15px; margin-bottom: 35px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { color: #aaa; margin-bottom: 22px; font-size: 16px; display: flex; align-items: center; }
        .sidebar-menu li::before { content: "•"; color: #777; margin-right: 12px; font-size: 18px; }
        .sidebar-menu li.active { color: white; font-weight: bold; }

        /* --- 檢舉功能主體 --- */
        .report-area { flex-grow: 1; padding-left: 60px; }
        .report-card { border: 1px solid #4a0000; background: rgba(0,0,0,0.5); padding: 50px; max-width: 800px; }
        .report-header { color: #cc0000; font-size: 32px; font-weight: 900; margin-bottom: 30px; letter-spacing: 2px; }

        .form-row { display: flex; gap: 25px; margin-bottom: 25px; }
        .field { flex: 1; }
        label { display: block; margin-bottom: 10px; font-size: 14px; }
        input, select, textarea { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 12px; border-radius: 4px; outline: none; }

        /* --- Footer 下半部 --- */
        footer {
            margin-top: 80px; padding: 80px 60px; border-top: 1px solid #222;
            display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr 1fr; gap: 40px;
        }
        .footer-logo-box { display: flex; align-items: center; gap: 10px; }
        .footer-col h4 { color: white; margin-bottom: 25px; font-size: 15px; }
        .footer-col ul li { color: #aaa; margin-bottom: 12px; font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div class="xxx-brand">XXXXXXXXXXXXXXXXXXXXXXXXXXXXX</div>
        <div class="top-tools">
            <div class="search-box">
                <input type="text" placeholder="Search...">
                <i class="fas fa-search"></i>
            </div>
            <i class="fas fa-user user-icon"></i>
            <i class="fas fa-shopping-cart cart-icon"></i>
        </div>
    </div>
    <div class="main-header">
        <div class="logo-group"><div class="white-dot"></div><div class="brand-name">卡爾夏</div></div>
        <nav class="nav-links">
            <a href="#">商城</a><a href="#">安裝區</a><a href="#">論壇</a><a href="#">公告</a><a href="#">常見問題</a>
        </nav>
    </div>
</header>

<div class="container">
    <aside>
        <div class="aside-title">Browse by</div>
        <ul class="sidebar-menu">
            <li class="active">檢舉中心</li>
            <li>預設欄位</li><li>預設欄位</li><li>預設欄位</li>
            <li>預設欄位</li><li>預設欄位</li><li>預設欄位</li><li>預設欄位</li>
        </ul>
    </aside>

    <main class="report-area">
        <div class="report-card">
            <h1 class="report-header">REPORT CENTER</h1>
            <form>
                <div class="form-row">
                    <div class="field">
                        <label>檢舉類型</label>
                        <select id="reportType" onchange="updateHint()">
                            <option value="PRODUCT">檢舉商品</option>
                            <option value="SELLER">檢舉賣家</option>
                            <option value="COMMENT">檢舉評論</option>
                            <option value="CHAT">檢舉聊天內容</option>
                            <option value="OTHER">其他</option>
                        </select>
                    </div>
                    <div class="field">
                        <label id="targetLabel">對象編號/ID</label>
                        <input type="text" id="targetInput" placeholder="請輸入商品編號">
                    </div>
                </div>
                <div class="field" style="margin-bottom: 25px;">
                    <label>詳細內容描述</label>
                    <textarea rows="6" placeholder="請詳細說明違規內容..."></textarea>
                </div>
                <button type="button" style="width: 100%; background: #cc0000; border: none; padding: 15px; color: white; font-weight: bold; cursor: pointer;">SUBMIT REPORT</button>
            </form>
        </div>
    </main>
</div>

<footer>
    <div class="footer-logo-box"><div class="white-dot" style="width:25px; height:12px;"></div><span style="font-size: 20px; font-weight: bold;">卡爾夏</span></div>
    <div class="footer-col"><h4>Shop</h4><ul><li>Shop Parts</li><li>Wholesale</li></ul></div>
    <div class="footer-col"><h4>The Company</h4><ul><li>About Us</li><li>FAQ</li></ul></div>
    <div class="footer-col"><h4>Contact Us</h4><ul><li>info@mysite.com</li></ul></div>
    <div class="footer-col"><h4>Follow Us</h4><ul><li>Instagram</li></ul></div>
</footer>

<script>
    function updateHint() {
        const type = document.getElementById('reportType').value;
        const label = document.getElementById('targetLabel');
        const input = document.getElementById('targetInput');
        const map = {
            'PRODUCT': '請輸入商品編號', 'SELLER': '請輸入賣家會員 ID',
            'COMMENT': '請輸入評論唯一碼', 'CHAT': '請輸入聊天紀錄 ID', 'OTHER': '請註明名稱或 ID'
        };
        label.innerText = type === 'OTHER' ? '檢舉對象名稱' : '對象編號/ID';
        input.placeholder = map[type];
    }
</script>
</body>
</html>
