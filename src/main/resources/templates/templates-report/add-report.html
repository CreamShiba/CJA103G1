<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢舉中心 - 卡爾夏汽車百貨</title>
    <style>
        /* --- 基礎設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #3a0000 40%, #000000 100%);
            color: #ffffff;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        a:hover {
            color: #ff3333;
        }

        ul {
            list-style: none;
        }

        /* --- 頂部導航 (Header) --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            font-size: 12px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-box {
            border: 1px solid #555;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            width: 150px;
            justify-content: space-between;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            display: inline-block;
            width: 30px;
            height: 15px;
            background: white;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 14px;
        }

        .nav-links a.active {
            color: #ff3333;
        }

        /* --- 主要內容區 --- */
        .container {
            display: flex;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* 左側側邊欄 */
        aside {
            width: 250px;
            flex-shrink: 0;
            padding-right: 40px;
        }

        .sidebar-section {
            margin-bottom: 40px;
        }

        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .category-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
        }

        .category-list li.active {
            color: #ff3333;
            font-weight: bold;
        }

        /* --- 檢舉表單區域 --- */
        .report-container {
            flex: 1;
            max-width: 1000px;
        }

        .report-card {
            background: transparent;
            border: none;
            padding: 0;
            box-shadow: none;
        }

        .report-title {
            font-size: 48px;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        .report-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .form-section {
            display: block;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 30px;
        }

        .form-group label {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .form-group input[type="text"],
        .form-group select {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input[type="text"]:focus,
        .form-group select:focus {
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            background-color: #222;
        }

        .form-group input[type="text"]::placeholder {
            color: #555;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group select option {
            background-color: #1a1a1a;
            color: #fff;
        }

        .textarea-group {
            margin-bottom: 30px;
        }

        .textarea-group label {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
            display: block;
            font-weight: normal;
        }

        .textarea-group textarea {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 16px;
            color: #fff;
            font-size: 14px;
            min-height: 180px;
            width: 100%;
            resize: vertical;
            outline: none;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        .textarea-group textarea:focus {
            border-color: #ff3333;
            box-shadow: 0 0 10px rgba(255, 51, 51, 0.3);
            background-color: #222;
        }

        .textarea-group textarea::placeholder {
            color: #555;
        }

        .submit-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.3);
        }

        .submit-btn:hover {
            background-color: #cc0000;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 51, 51, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* --- Footer --- */
        footer {
            margin-top: 100px;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 40px;
            font-size: 14px;
            color: #aaa;
        }

        .footer-logo {
            font-size: 20px;
            color: white;
            margin-bottom: 20px;
        }

        .footer-col h4 {
            color: white;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .footer-col ul li {
            margin-bottom: 10px;
        }

        /* 用戶下拉選單 */
        .user-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 30px;
            background-color: #1a1a1a;
            min-width: 120px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.5);
            z-index: 100;
            border: 1px solid #333;
            border-radius: 4px;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            color: #ccc;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            transition: 0.2s;
        }

        .dropdown-menu a:hover {
            background-color: #333;
            color: #ff3333;
        }

        /* 彈窗樣式 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border: 3px solid #ff9933;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ff9933;
            font-weight: bold;
        }

        .modal-title {
            color: #ff3333;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #fff;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .modal-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        .modal-btn:hover {
            background-color: #cc0000;
        }

        /* 隱藏元素 */
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

<header>
    <div class="top-bar">
        <div>XXXXXXXXXXXXXXXXXXXXXXXXXX</div>
        <div class="top-icons">
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search..."
                       style="background: transparent; border: none; color: white; width: 100%; outline: none;">
                <span>🔍</span>
            </div>
            <div class="user-dropdown-container">
                <span id="user-icon" style="cursor: pointer;">👤</span>
                <div id="user-dropdown" class="dropdown-menu">
                    <a href="#">登入</a> <a href="#">註冊</a>
                </div>
            </div>
            <span id="cart">🛒</span>
        </div>
    </div>

    <div class="main-header">
        <div class="logo">卡爾夏</div>
        <nav class="nav-links">
            <a href="#">商城</a> <a href="#">安裝區</a>
            <a href="#">論壇</a> <a href="#">公告</a><a href="#">常見問題</a>
        </nav>
    </div>
</header>

<div class="container">

    <aside>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Browse by</h3>
            <ul class="category-list">
                <li class="active">檢舉中心</li>
                <li>檢舉紀錄</li>
                <li>申訴管理</li>
            </ul>
        </div>
    </aside>

    <div class="report-container">
        <div class="report-card">
            <h1 class="report-title">REPORT CENTER</h1>
            <p class="report-subtitle">維護社群秩序，檢舉違規行為。</p>

            <form th:action="@{/reports/submit}" method="post" id="reportForm">
                <div class="form-section">
                    <!-- 檢舉對象 -->
                    <div class="form-group">
                        <label for="reportsTarget">檢舉對象 (會員帳號/文章編號)</label>
                        <input type="text" id="reportsTarget" name="reportsTarget"
                               placeholder="請輸入對象 ID">
                    </div>

                    <!-- 檢舉類別 -->
                    <div class="form-group">
                        <label for="reportsType">檢舉類別</label>
                        <select id="reportsType" name="reportsType">
                            <option value="">-- 請選擇類別 --</option>
                            <option value="商品">商品</option>
                            <option value="賣家">賣家</option>
                            <option value="評論">評論</option>
                            <option value="聊天">聊天</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>

                    <!-- 檢舉原因 (動態) -->
                    <div class="form-group" id="reasonSelectField">
                        <label for="reportsReason">檢舉原因</label>
                        <select id="reportsReason" name="reportsReason">
                            <option value="">-- 請先選擇類別 --</option>
                        </select>
                    </div>

                    <!-- 自定義檢舉原因 (選擇"其他"時顯示) -->
                    <div class="form-group hidden" id="otherReasonField">
                        <label for="otherReasonInput">自定義檢舉原因</label>
                        <input type="text" id="otherReasonInput"
                               placeholder="請手動輸入檢舉原因">
                    </div>

                    <!-- 問題詳細描述 -->
                    <div class="textarea-group">
                        <label for="reportsDescription">問題詳細描述</label>
                        <textarea id="reportsDescription" name="reportsDescription"
                                  placeholder="請詳細說明您遇到的問題..."></textarea>
                    </div>
                </div>

                <button type="button" class="submit-btn" id="submitBtn">SUBMIT REPORT</button>
            </form>
        </div>
    </div>

</div>

<!-- 彈窗 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <div class="modal-icon">!</div>
        <div class="modal-title">卡爾夏Karshop</div>
        <div class="modal-message" id="modalMessage">請填寫問題詳細描述！</div>
        <button class="modal-btn" onclick="closeModal()">OK</button>
    </div>
</div>

<footer>
    <div class="footer-col">
        <div class="footer-logo logo">卡爾夏</div>
    </div>
    <div class="footer-col">
        <h4>Shop</h4>
        <ul>
            <li>Shop Parts</li>
            <li>Wholesale</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>The Company</h4>
        <ul>
            <li>About Us</li>
            <li>FAQ</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>Contact Us</h4>
        <ul>
            <li>info@mysite.com</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>Follow Us</h4>
        <ul>
            <li>Instagram</li>
        </ul>
    </div>
</footer>

<script>
    // 用戶下拉選單
    document.getElementById('user-icon').addEventListener('click', function(e) {
        e.stopPropagation();
        document.getElementById('user-dropdown').classList.toggle('show');
    });

    document.addEventListener('click', function() {
        document.getElementById('user-dropdown').classList.remove('show');
    });

    // 檢舉原因資料
    const reasonData = {
        "商品": ["山寨品/高仿", "商品敘述與實物不符", "商品有瑕疵"],
        "賣家": ["態度不佳", "出貨速度慢", "疑似詐騙行為"],
        "評論": ["謾罵/人身攻擊", "評論不實", "惡意洗版", "侵害個人隱私"],
        "聊天": ["騷擾行為", "言語汙辱", "傳送惡意連結", "詐騙", "洗版"]
    };

    // 檢舉類別變更時更新檢舉原因
    document.getElementById('reportsType').addEventListener('change', function() {
        const type = this.value;
        const reasonSelect = document.getElementById('reportsReason');
        const reasonField = document.getElementById('reasonSelectField');
        const otherField = document.getElementById('otherReasonField');

        // 清空選單
        reasonSelect.innerHTML = '<option value="">-- 請選擇檢舉原因 --</option>';

        if (type === "其他") {
            // 選擇"其他"：隱藏原因選單，顯示自定義輸入框
            reasonField.classList.add('hidden');
            otherField.classList.remove('hidden');
        } else if (type && reasonData[type]) {
            // 選擇正常類別：顯示對應的原因選項
            reasonField.classList.remove('hidden');
            otherField.classList.add('hidden');

            reasonData[type].forEach(reason => {
                const option = document.createElement('option');
                option.value = reason;
                option.textContent = reason;
                reasonSelect.appendChild(option);
            });
        } else {
            // 未選擇：顯示空的原因選單
            reasonField.classList.remove('hidden');
            otherField.classList.add('hidden');
        }
    });

    // 表單驗證
    document.getElementById('submitBtn').addEventListener('click', function(e) {
        e.preventDefault();

        const target = document.getElementById('reportsTarget').value.trim();
        const type = document.getElementById('reportsType').value;
        const reason = document.getElementById('reportsReason').value;
        const otherReason = document.getElementById('otherReasonInput').value.trim();
        const description = document.getElementById('reportsDescription').value.trim();

        // 1. 檢查檢舉對象
        if (!target) {
            showModal('請輸入檢舉對象！');
            return;
        }

        // 2. 檢查檢舉類別
        if (!type) {
            showModal('請選擇檢舉類別！');
            return;
        }

        // 3. 檢查檢舉原因
        if (type !== "其他" && !reason) {
            showModal('請選擇檢舉原因！');
            return;
        }

        // 4. 檢查自定義原因（如果選擇"其他"）
        if (type === "其他" && !otherReason) {
            showModal('請填寫自定義檢舉原因！');
            return;
        }

        // 5. 檢查問題描述
        if (!description) {
            showModal('請填寫問題描述！');
            return;
        }

        // 如果選擇"其他"，將自定義原因填入 reportsReason 欄位
        if (type === "其他") {
            document.getElementById('reportsReason').value = otherReason;
        }

        // 所有驗證通過，提交表單
        document.getElementById('reportForm').submit();
    });

    // 顯示彈窗
    function showModal(message) {
        document.getElementById('modalMessage').textContent = message;
        document.getElementById('modalOverlay').classList.add('show');
    }

    // 關閉彈窗
    function closeModal() {
        document.getElementById('modalOverlay').classList.remove('show');
    }

    // 點擊彈窗外部關閉
    document.getElementById('modalOverlay').addEventListener('click', function(e) {
        if (e.target === this) {
            closeModal();
        }
    });
</script>

</body>
</html>
