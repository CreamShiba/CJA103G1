<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>檢舉案件處理 - 卡爾夏 Admin</title>
</head>
<body>
<div class="app-container">
    <div class="case-card" th:if="${report != null}">
        <div class="info-row">
            <div class="info-label">檢舉編號：</div>
            <div class="info-text" th:text="${report.reportNo}">1</div>
        </div>
        <div class="info-row">
            <div class="info-label">檢舉類型：</div>
            <div class="info-text" th:text="${report.reportType}">類型內容</div>
        </div>

        <textarea id="replyMsg"
                  th:text="${report.response == '尚未回覆'} ? '' : ${report.response}"
                  th:readonly="${report.status == '已結案'}"></textarea>

        <div class="btn-group">
            <button th:if="${report.status != '已結案'}" class="btn-send" onclick="sendReply()">送出處理</button>
        </div>
    </div>

    <div th:if="${report == null}">
        <p style="color: red; padding: 40px;">系統錯誤：找不到該案件資料。</p>
    </div>
</div>

<script th:inline="javascript">
    /* 使用更嚴謹的 Thymeleaf 變數宣告方式 */
    function sendReply() {
        const reply = document.getElementById('replyMsg').value;
        if (!reply.trim()) { alert('請輸入回覆內容'); return; }

        // 💡 修正 IDE 報錯的寫法：將變數放入引號內，Thymeleaf 會自動替換
        const id = /*[[${report.reportNo}]]*/ 0;

        const params = new URLSearchParams({ id: id, response: reply, status: '已結案' });
        fetch('/reports/api/handle', { method: 'POST', body: params })
            .then(res => res.text())
            .then(msg => {
                if (msg === 'success') {
                    window.location.href = '/reports/admin/list?status=已結案';
                }
            });
    }
</script>
</body>
</html>
