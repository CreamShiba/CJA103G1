<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>卡爾夏Karshop - 檢舉成功</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #050000;
      background-image: linear-gradient(to bottom, #000000 0%, #2a0000 40%, #000000 100%);
      color: #ffffff;
      height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }

    .success-card {
      border: 1px solid #cc0000;
      background-color: #111;
      padding: 60px;
      text-align: center;
      max-width: 800px;
      width: 90%;
      box-shadow: 0 15px 40px rgba(0,0,0,0.8);
    }

    .check-icon { color: #cc0000; font-size: 80px; margin-bottom: 30px; }
    .title { font-size: 48px; font-weight: 900; letter-spacing: 8px; margin-bottom: 30px; color: #ffffff; }
    .message { font-size: 18px; line-height: 1.8; color: #ffffff; margin-bottom: 50px; font-weight: 300; }

    .info-group { margin-bottom: 40px; border-top: 1px solid #333; padding-top: 30px; }
    .info-label { display: block; color: #888; font-size: 16px; margin-bottom: 10px; letter-spacing: 2px; }
    .info-value { display: block; color: #cc0000; font-size: 26px; font-weight: bold; }

    .return-btn {
      background-color: #cc0000; color: white; border: none; padding: 16px 40px;
      font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s;
      text-decoration: none; display: inline-block; border-radius: 4px;
    }
    .return-btn:hover { background-color: #ff0000; box-shadow: 0 0 15px rgba(255, 0, 0, 0.4); }
  </style>
</head>
<body>

<div class="success-card">
  <div class="check-icon"><i class="fas fa-check-circle"></i></div>
  <h1 class="title">提交成功</h1>

  <p class="message">
    您的檢舉案件已成功送出。<br>
    管理員將於 24 小時內核實相關事實並進行處理。
  </p>

  <div class="info-group">
    <span class="info-label">檢舉對象</span>
    <span class="info-value" th:text="${target}">12345</span>
  </div>

  <a th:href="@{/reports/add}" class="return-btn">返回檢舉中心 RETURN</a>
</div>

</body>
</html>
