<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>申訴服務 - 卡爾夏汽車百貨</title>
    <style>
        /* --- 這裡保留妳原本所有的 CSS 樣式，不做任何刪減 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #3a0000 40%, #000000 100%);
            color: #ffffff;
            line-height: 1.5;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        a:hover {
            color: #ff3333;
        }

        ul {
            list-style: none;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            font-size: 12px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .search-box {
            border: 1px solid #555;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            width: 150px;
            justify-content: space-between;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            display: inline-block;
            width: 30px;
            height: 15px;
            background: white;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 14px;
            align-items: center;
        }

        .container {
            display: flex;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
        }

        aside {
            width: 250px;
            flex-shrink: 0;
            padding-right: 40px;
        }

        .sidebar-section {
            margin-bottom: 40px;
        }

        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .category-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-list li:hover {
            color: #ff3333;
        }

        .category-list li.active {
            color: #ff3333;
            font-weight: bold;
        }

        .appeal-container {
            flex: 1;
            max-width: 1000px;
        }

        .appeal-card {
            background: rgba(10, 10, 10, 0.6);
            border: 1px solid rgba(255, 51, 51, 0.3);
            border-radius: 8px;
            padding: 50px;
            box-shadow: 0 0 30px rgba(255, 51, 51, 0.15);
            backdrop-filter: blur(10px);
        }

        .appeal-title {
            font-size: 48px;
            font-weight: bold;
            color: #ff3333;
            margin-bottom: 15px;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 20px;
        }

        .appeal-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 120px;
            height: 3px;
            background: linear-gradient(90deg, #ff3333, transparent);
        }

        .appeal-subtitle {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 0.4fr 0.6fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            color: #fff;
            margin-bottom: 10px;
            font-weight: normal;
        }

        .form-group input[type="text"],
        .form-group select {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 4px;
            transition: background-color 0.2s ease;
        }

        .checkbox-item:hover {
            background-color: rgba(255, 51, 51, 0.1);
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
            accent-color: #ff3333;
        }

        .checkbox-item label {
            font-size: 14px;
            color: #ddd;
            cursor: pointer;
            margin: 0;
        }

        .other-input-container {
            margin-top: 10px;
            display: none;
        }

        .other-input-container.show {
            display: block;
        }

        .other-input-container input {
            width: 100%;
            background-color: #0a0a0a;
            border: 1px solid #444;
            padding: 10px 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .custom-upload-btn {
            background-color: #ff3333;
            color: white;
            padding: 10px 30px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
            transition: 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
            text-align: center;
            margin-top: 15px;
        }

        #imagePreview {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .preview-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border: 2px solid #ff3333;
            border-radius: 8px;
        }

        .textarea-group {
            margin-bottom: 30px;
        }

        .textarea-group textarea {
            background-color: #1a1a1a;
            border: 1px solid #333;
            padding: 16px;
            color: #fff;
            font-size: 14px;
            min-height: 180px;
            width: 100%;
            resize: vertical;
            outline: none;
            font-family: inherit;
        }

        .submit-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
        }

        footer {
            margin-top: 100px;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 40px;
            font-size: 14px;
            color: #aaa;
            background-color: rgba(0, 0, 0, 0.8);
            border-top: 1px solid #333;
        }

        .footer-logo {
            font-size: 20px;
            color: white;
            margin-bottom: 20px;
        }

        .footer-col h4 {
            color: white;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .user-dropdown-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background-color: #1a1a1a;
            min-width: 150px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.5);
            z-index: 100;
            border: 1px solid #333;
            border-radius: 4px;
            margin-top: 10px;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            color: #ccc;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            font-size: 13px;
            transition: 0.2s;
            text-align: left;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background-color: #1a1a1a;
            border: 2px solid #333;
            border-radius: 8px;
            padding: 40px;
            max-width: 500px;
            text-align: center;
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            border: 3px solid #ff9933;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: #ff9933;
            font-weight: bold;
        }

        .modal-title {
            color: #ff3333;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .modal-message {
            color: #fff;
            font-size: 16px;
            margin-bottom: 30px;
        }

        .modal-btn {
            background-color: #ff3333;
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
        }
    </style>
</head>

<body>

    <header th:replace="fragments/front_header :: frontHeader"></header>

    <div class="container">
        <aside>
            <div class="sidebar-section">
                <h3 class="sidebar-title">Browse by</h3>
                <ul class="category-list">
                    <li class="active" onclick="location.href='/appeals/add'">提交申訴</li>
                    <li onclick="location.href='/reports/add'">提交檢舉</li>
                    <li onclick="location.href='/appeals/history'">申訴紀錄</li>
                    <li onclick="location.href='/reports/history'">檢舉紀錄</li>
                </ul>
            </div>
        </aside>

        <div class="appeal-container">
            <div class="appeal-card">
                <h1 id="page-title" class="appeal-title">INSTALLATION APPEAL SERVICE</h1>
                <p id="page-subtitle" class="appeal-subtitle">如果您在安裝服務中有任何問題,請填寫下方表單。</p>

                <form th:action="@{/appeals/submit}" method="post" id="appealForm" enctype="multipart/form-data">
                    <div class="form-section">

                        <div class="form-group" style="margin-bottom: 25px;">
                            <label>請選擇申訴類型</label>
                            <select id="appealType" name="appealType">
                                <option value="install">技師安裝服務 (Installation)</option>
                                <option value="product">商城商品訂單 (Product Order)</option>
                            </select>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label id="orderLabel">請選擇安裝訂單編號</label>

                                <select id="installOrderSelect" name="orderNo">
                                    <option value="">-- 請選擇您的安裝訂單 --</option>
                                    <option th:each="io : ${installOrders}" th:value="${io.installOrderNo}"
                                        th:text="'單號：' + ${io.installOrderNo} + ' (日期：' + ${io.appointDate} + ')'">
                                    </option>
                                </select>

                                <select id="productOrderSelect" name="orderNo" style="display: none;" disabled>
                                    <option value="">-- 請選擇您的商品訂單 --</option>
                                    <option th:each="po : ${productOrders}" th:value="${po.ordNo}"
                                        th:text="'單號：' + ${po.ordNo} + ' (狀態：' + ${po.ordStatus} + ')'"></option>
                                </select>

                                <div class="upload-section" style="margin-top: 30px;">
                                    <span class="upload-title">上傳圖片</span>
                                    <div class="upload-align-row">
                                        <label for="imageFiles" class="custom-upload-btn">選擇檔案</label>
                                        <input type="file" id="imageFiles" name="images" multiple accept="image/*"
                                            style="display: none;">
                                    </div>
                                    <div id="imagePreview"></div>
                                </div>
                            </div>

                            <div class="form-group">
                                <label>申訴類別 (必選)</label>
                                <div class="checkbox-group" id="category-container"></div>
                            </div>
                        </div>

                        <div class="textarea-group">
                            <label for="description">問題詳細描述</label>
                            <textarea id="description" name="description" placeholder="請詳細說明您遇到的問題..."></textarea>
                        </div>
                    </div>
                    <button type="button" class="submit-btn" id="submitBtn">SUBMIT APPEAL</button>
                </form>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-icon">!</div>
            <div class="modal-title">卡爾夏Karshop</div>
            <div class="modal-message" id="modalMessage">請填寫內容！</div>
            <button class="modal-btn" onclick="closeModal()">OK</button>
        </div>
    </div>

    <footer>
        <div class="footer-col">
            <div class="footer-logo logo">卡爾夏</div>
        </div>
        <div class="footer-col">
            <h4>Shop</h4>
            <ul>
                <li>Shop Parts</li>
                <li>Wholesale</li>
            </ul>
        </div>
        <div class="footer-col">
            <h4>The Company</h4>
            <ul>
                <li>About Us</li>
                <li>FAQ</li>
            </ul>
        </div>
        <div class="footer-col">
            <h4>Contact Us</h4>
            <ul>
                <li>info@mysite.com</li>
            </ul>
        </div>
        <div class="footer-col">
            <h4>Follow Us</h4>
            <ul>
                <li>Instagram</li>
            </ul>
        </div>
    </footer>

    <script th:inline="javascript">
        const categories = {
            install: ["技師態度不佳", "技師遲到/早退", "商品安裝未落實", "車體受損", "與預期功能不符", "規格安裝錯誤", "施工時程嚴重拖延", "預約場地不符", "未經許可動用車輛", "其他"],
            product: ["商品破損/瑕疵", "寄錯商品", "商品與描述不符", "零件缺少", "物流運送問題", "保固期爭議", "仿冒品疑慮", "重複扣款", "商品效期問題", "其他"]
        };

        window.onload = function () {
            initUserDropdown();
            updateCategoryList('install');
        };

        // 💡 切換申訴類型：同步切換對應的訂單選單
        document.getElementById('appealType').addEventListener('change', function () {
            const type = this.value;
            const label = document.getElementById('orderLabel');
            const title = document.getElementById('page-title');
            const subtitle = document.getElementById('page-subtitle');
            const installSelect = document.getElementById('installOrderSelect');
            const productSelect = document.getElementById('productOrderSelect');

            if (type === 'install') {
                label.innerText = '請選擇安裝訂單編號';
                title.innerText = 'INSTALLATION APPEAL SERVICE';
                subtitle.innerText = '如果您在安裝服務中有任何問題,請填寫下方表單。';
                // 顯示安裝，隱藏商品
                installSelect.style.display = 'block'; installSelect.disabled = false;
                productSelect.style.display = 'none'; productSelect.disabled = true;
            } else {
                label.innerText = '請選擇商品訂單編號';
                title.innerText = 'PRODUCT APPEAL SERVICE';
                subtitle.innerText = '如果您對購買的商品有任何疑問,請填寫下方表單。';
                // 顯示商品，隱藏安裝
                installSelect.style.display = 'none'; installSelect.disabled = true;
                productSelect.style.display = 'block'; productSelect.disabled = false;
            }
            updateCategoryList(type);
        });

        function updateCategoryList(type) {
            const container = document.getElementById('category-container');
            container.innerHTML = '';
            categories[type].forEach((item, index) => {
                const isOther = item === "其他";
                const id = `type${index}`;
                const html = `
                <div class="checkbox-item">
                    <input type="checkbox" id="${id}" name="type" value="${item}" ${isOther ? 'onchange="toggleOtherInput(this)"' : ''}>
                    <label for="${id}">${item}</label>
                </div>
            `;
                container.insertAdjacentHTML('beforeend', html);
            });
            container.insertAdjacentHTML('beforeend', `<div class="other-input-container" id="otherInputContainer"><input type="text" id="otherInput" name="otherDescription" placeholder="請描述其他問題..."></div>`);
        }

        function toggleOtherInput(checkbox) {
            const otherContainer = document.getElementById('otherInputContainer');
            otherContainer.classList.toggle('show', checkbox.checked);
            if (!checkbox.checked) document.getElementById('otherInput').value = '';
        }

        // --- 以下保留妳原本的所有功能邏輯 ---
        function initUserDropdown() {
            const userIcon = document.getElementById('user-icon');
            const userDropdown = document.getElementById('user-dropdown');
            const memberTrigger = document.getElementById('member-center-trigger');
            const memberDropdown = document.getElementById('member-dropdown');
            const forumTrigger = document.getElementById('forum-center-trigger');
            const forumDropdown = document.getElementById('forum-dropdown');

            if (userIcon) userIcon.onclick = (e) => { e.stopPropagation(); userDropdown.classList.toggle('show'); if (memberDropdown) memberDropdown.classList.remove('show'); if (forumDropdown) forumDropdown.classList.remove('show'); };
            if (memberTrigger) memberTrigger.onclick = (e) => { e.preventDefault(); e.stopPropagation(); memberDropdown.classList.toggle('show'); if (userDropdown) userDropdown.classList.remove('show'); if (forumDropdown) forumDropdown.classList.remove('show'); };
            if (forumTrigger) forumTrigger.onclick = (e) => { e.preventDefault(); e.stopPropagation(); forumDropdown.classList.toggle('show'); if (userDropdown) userDropdown.classList.remove('show'); if (memberDropdown) memberDropdown.classList.remove('show'); };
            document.onclick = () => { if (userDropdown) userDropdown.classList.remove('show'); if (memberDropdown) memberDropdown.classList.remove('show'); if (forumDropdown) forumDropdown.classList.remove('show'); };
        }

        document.getElementById('imageFiles').addEventListener('change', function (e) {
            const preview = document.getElementById('imagePreview');
            preview.innerHTML = '';
            Array.from(e.target.files).forEach(file => {
                const reader = new FileReader();
                reader.onload = (event) => {
                    const img = document.createElement('img');
                    img.src = event.target.result; img.classList.add('preview-img');
                    preview.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        });

        document.getElementById('submitBtn').addEventListener('click', function () {
            // 取得當前可見的選單值
            const type = document.getElementById('appealType').value;
            const orderNo = (type === 'install') ? document.getElementById('installOrderSelect').value : document.getElementById('productOrderSelect').value;
            const checkboxes = document.querySelectorAll('input[name="type"]:checked');
            const description = document.getElementById('description').value.trim();

            if (!orderNo) { showModal('請選擇一筆訂單！'); return; }
            if (checkboxes.length === 0) { showModal('請至少選擇一個類別！'); return; }
            if (Array.from(checkboxes).some(cb => cb.value === "其他") && !document.getElementById('otherInput').value.trim()) { showModal('請描述其他問題！'); return; }
            if (!description) { showModal('請填寫問題詳細描述！'); return; }

            document.getElementById('appealForm').submit();
        });

        function showModal(message) { document.getElementById('modalMessage').textContent = message; document.getElementById('modalOverlay').classList.add('show'); }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('show'); }
    </script>
</body>

</html>
