<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>卡爾夏Karshop - 提交安裝申訴</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* --- 1. 基礎佈局 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #2a0000 40%, #000000 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column; /* 讓頁尾能在底部橫向排開 */
        }

        /* --- 2. Header --- */
        header { background-color: #000; padding: 0 60px; width: 100%; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; height: 50px; border-bottom: 1px solid #1a1a1a; }
        .main-header { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo-group { display: flex; align-items: center; gap: 15px; }
        .white-dot { width: 38px; height: 18px; background: white; border-radius: 12px; }
        .brand-name { font-size: 28px; font-weight: bold; letter-spacing: 8px; }
        .nav-links { display: flex; gap: 40px; }
        .nav-links a { color: white; text-decoration: none; font-size: 16px; font-weight: 500; }

        /* --- 3. 主內容區 --- */
        .main-layout { display: flex; padding: 60px; max-width: 1400px; margin: 0 auto; flex: 1; width: 100%; }
        aside { width: 240px; flex-shrink: 0; }
        .aside-title { font-size: 32px; font-weight: bold; border-left: 6px solid #cc0000; padding-left: 18px; margin-bottom: 40px; }
        .sidebar-menu { list-style: none; }
        .sidebar-menu li { color: #999; margin-bottom: 25px; font-size: 18px; display: flex; align-items: center; }
        .sidebar-menu li.active { color: white; font-weight: bold; }

        .function-area { flex-grow: 1; padding-left: 60px; }
        .appeal-card { border: 1px solid #4a0000; background-color: rgba(0,0,0,0.5); padding: 50px; max-width: 950px; }
        .appeal-title { color: #cc0000; font-size: 36px; font-weight: 900; margin-bottom: 12px; }

        /* --- 4. 表單與選項樣式 --- */
        .form-row { display: flex; gap: 30px; margin-bottom: 25px; }
        .field { flex: 1; margin-bottom: 20px; }
        .field label { display: block; margin-bottom: 12px; font-size: 15px; color: #eee; }

        .checkbox-group {
            background: #111; border: 1px solid #333; padding: 20px; border-radius: 4px;
            display: flex; flex-direction: column; gap: 12px;
            max-height: none; overflow-y: visible; /* 確保選項不縮減且不產生內部捲軸 */
        }
        .checkbox-item { display: flex; align-items: center; cursor: pointer; font-size: 15px; color: #ccc; }
        .checkbox-item input { width: 18px; height: 18px; margin-right: 12px; accent-color: #cc0000; }

        input[type="text"], textarea { width: 100%; background: #111; border: 1px solid #333; color: white; padding: 14px; border-radius: 4px; font-size: 15px; }
        .submit-btn { width: 100%; background: #cc0000; border: none; padding: 18px; color: white; font-weight: bold; cursor: pointer; border-radius: 4px; font-size: 18px; margin-top: 20px; }

        /* --- 5. Footer 徹底修正 --- */
        .site-footer {
            background-color: #000;
            border-top: 1px solid #1a1a1a;
            padding: 80px 60px;
            width: 100%; /* 確保寬度撐滿 */
            margin-top: auto; /* 推到最底部 */
        }
        .footer-inner {
            max-width: 1400px;
            margin: 0 auto;
            display: flex; /* 關鍵：強制橫向排列 */
            justify-content: space-between;
            align-items: flex-start;
        }
        .f-col h4 { color: white; margin-bottom: 25px; font-size: 16px; }
        .f-col ul { list-style: none; }
        .f-col ul li { color: #aaa; margin-bottom: 15px; font-size: 14px; }

        .swal2-popup { background-color: #1a1a1a !important; color: #fff !important; border: 1px solid #4a0000 !important; }
        .swal2-title { color: #cc0000 !important; }
    </style>
</head>
<body>

<header>
    <div class="top-bar"><div class="xxx-text">XXXXXXXXXXXXXXXXXXXXXXXXXXXXX</div></div>
    <div class="main-header">
        <div class="logo-group"><div class="white-dot"></div><div class="brand-name">卡爾夏</div></div>
        <nav class="nav-links"><a href="#">商城</a><a href="#">安裝區</a><a href="#">論壇</a><a href="#">公告</a><a href="#">常見問題</a></nav>
    </div>
</header>

<div class="main-layout">
    <aside>
        <div class="aside-title">Browse by</div>
        <ul class="sidebar-menu">
            <li class="active">提交申訴</li>
            <li>我的訂單</li><li>技師評價</li><li>服務紀錄</li>
        </ul>
    </aside>

    <main class="function-area">
        <div class="appeal-card">
            <h1 class="appeal-title">INSTALLATION APPEAL SERVICE</h1>
            <p class="appeal-desc">如果您在安裝服務中有任何問題，請填寫下方表單。</p>

            <form id="appealForm" action="/appeals/submit" method="post">
                <div class="form-row">
                    <div class="field" style="flex: 0.4;">
                        <label>安裝訂單編號</label>
                        <input type="text" id="orderNoInput" name="installOrderNo" placeholder="請輸入編號">
                    </div>

                    <div class="field" style="flex: 0.6;">
                        <label>申訴類別 (必選)</label>
                        <div class="checkbox-group" id="categoryGroup">
                            <label class="checkbox-item"><input type="checkbox" name="type" value="技師態度不佳"> 技師態度不佳</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="技師遲到"> 技師遲到 / 早退</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="商品安裝未落實"> 商品安裝未落實</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="車體受損"> 車體受損</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="功能不符"> 與預期功能不符</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="規格安裝錯誤"> 規格安裝錯誤</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="施工時程嚴重拖延"> 施工時程嚴重拖延</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="預約場地不符"> 預約場地不符</label>
                            <label class="checkbox-item"><input type="checkbox" name="type" value="未經許可動用車輛"> 未經許可動用車輛</label>
                            <label class="checkbox-item">
                                <input type="checkbox" id="otherTrigger" name="type" value="其他" onchange="toggleOther()"> 其他
                            </label>
                        </div>
                    </div>
                </div>

                <div id="otherInputRow" class="field" style="display: none;">
                    <label>請詳述其他原因</label>
                    <input type="text" id="otherDetailInput" placeholder="在此輸入原因...">
                </div>

                <div class="field">
                    <label>問題詳細描述</label>
                    <textarea id="descInput" name="description" rows="6" placeholder="請詳細說明您遇到的問題..."></textarea>
                </div>

                <button type="button" class="submit-btn" onclick="validateAndSubmit()">SUBMIT APPEAL</button>
            </form>
        </div>
    </main>
</div>

<footer class="site-footer">
    <div class="footer-inner">
        <div class="f-logo-area" style="display: flex; align-items: center; gap: 10px;">
            <div class="white-dot" style="width: 28px; height: 13px;"></div>
            <span style="font-size: 22px; font-weight: bold; letter-spacing: 2px;">卡爾夏</span>
        </div>
        <div class="f-col"><h4>Shop</h4><ul><li>Shop Parts</li><li>Wholesale</li></ul></div>
        <div class="f-col"><h4>The Company</h4><ul><li>About Us</li><li>FAQ</li></ul></div>
        <div class="f-col"><h4>Contact Us</h4><ul><li>info@mysite.com</li></ul></div>
        <div class="f-col"><h4>Follow Us</h4><ul><li>Instagram</li></ul></div>
    </div>
</footer>

<script>
    function toggleOther() {
        const otherTrigger = document.getElementById('otherTrigger');
        const otherRow = document.getElementById('otherInputRow');
        otherRow.style.display = otherTrigger.checked ? 'block' : 'none';
    }

    function validateAndSubmit() {
        const orderNo = document.getElementById('orderNoInput').value.trim();
        const desc = document.getElementById('descInput').value.trim();
        const otherTrigger = document.getElementById('otherTrigger');
        const otherDetail = document.getElementById('otherDetailInput').value.trim();
        const checkboxes = document.querySelectorAll('input[name="type"]');
        let isChecked = false;

        checkboxes.forEach(cb => { if (cb.checked) isChecked = true; });

        if (orderNo === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請填寫安裝訂單編號！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (!isChecked) {
            Swal.fire({ title: '卡爾夏Karshop', text: '請至少勾選一個申訴類別！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (otherTrigger.checked && otherDetail === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請填寫要描述其他原因！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        if (desc === "") {
            Swal.fire({ title: '卡爾夏Karshop', text: '請填寫問題詳細描述！', icon: 'warning', confirmButtonColor: '#cc0000' });
            return;
        }
        document.getElementById('appealForm').submit();
    }
</script>
</body>
</html>
