<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢舉管理 - Autopile Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 你的 CSS 完全保留 --- */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: #f5f7fa; color: #333; height: 100vh; overflow: hidden; }
        .app-container { display: flex; height: 100%; width: 100%; }
        .sidebar { width: 260px; min-width: 260px; background-color: #ffffff; border-right: 1px solid #e1e4e8; display: flex; flex-direction: column; z-index: 10; height: 100vh; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; gap: 10px; }
        .logo-icon { width: 24px; height: 12px; background-color: #0066cc; border-radius: 4px; }
        .sidebar-header h2 { font-size: 18px; font-weight: bold; color: #1a1a1a; }
        .badge { font-size: 10px; background: #e6f0ff; color: #0066cc; padding: 2px 6px; border-radius: 4px; vertical-align: middle; }
        .sidebar-nav { flex-grow: 1; overflow-y: auto; padding-top: 20px; }
        .menu-item { list-style: none; }
        .menu-item > a { display: flex; align-items: center; padding: 12px 24px; color: #555; text-decoration: none; font-size: 15px; justify-content: space-between; transition: 0.2s; cursor: pointer; }
        .menu-item > a:hover { background-color: #f0f7ff; color: #0066cc; }
        .menu-item > a i:first-child { margin-right: 10px; width: 20px; text-align: center; }
        .menu-item .arrow { font-size: 12px; transition: transform 0.2s; }
        .menu-item.open > a .arrow { transform: rotate(180deg); }
        .submenu, .sub-submenu { list-style: none; background-color: #fafafa; display: none; }
        .has-submenu.open > .submenu, .has-sub-item.open > .sub-submenu { display: block; }
        .submenu li a { padding: 12px 24px 12px 58px; font-size: 14px; display: block; color: #555; text-decoration: none; transition: 0.2s; }
        .submenu li a:hover { background-color: #f0f0f0; }
        .sub-submenu li a { padding: 10px 24px 10px 80px; font-size: 13px; color: #777; display: block; text-decoration: none; transition: 0.2s; }
        .sub-submenu li a:hover { background-color: #e8e8e8; }
        .active { background-color: #e0f2f1 !important; color: #00796b !important; font-weight: bold; border-right: 3px solid #00796b; }
        .main-content { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .top-bar { background-color: white; padding: 15px 40px; border-bottom: 1px solid #e1e4e8; display: flex; justify-content: space-between; align-items: center; }
        .page-title { font-size: 20px; color: #00796b; font-weight: bold; }
        .user-profile { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 36px; height: 36px; background-color: #333; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
        .content-area { flex-grow: 1; overflow-y: auto; padding: 30px 40px; }
        .table-container { background-color: white; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05); overflow: hidden; }
        .report-table { width: 100%; border-collapse: collapse; }
        .report-table th { padding: 16px; text-align: left; font-weight: 600; color: #00796b; font-size: 15px; border-bottom: 2px solid #e0f2f1; background-color: #f8f9fa; }
        .report-table td { padding: 16px; border-bottom: 1px solid #f0f0f0; font-size: 14px; }

        /* 💡 狀態標籤顏色區分 */
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; background-color: #e0f2f1; color: #00796b; }
        .status-processing { background-color: #fff3e0; color: #e65100; } /* 處理中: 橘色 */
        .status-closed { background-color: #e8f5e9; color: #2e7d32; }     /* 已結案: 綠色 */
        .status-rejected { background-color: #ffebee; color: #c62828; }   /* 駁回: 紅色 */

        .btn-action { background-color: #00796b; color: white; border: none; padding: 8px 20px; border-radius: 4px; font-size: 14px; cursor: pointer; text-decoration: none; display: inline-block; transition: 0.2s; }
        .btn-action:hover { background-color: #00695c; }
        .pagination-container { display: flex; justify-content: center; align-items: center; gap: 15px; padding: 20px; background: white; border-top: 1px solid #eee; }
        .btn-page { background-color: #f8f9fa; border: 1px solid #dee2e6; padding: 6px 12px; border-radius: 4px; cursor: pointer; transition: 0.2s; font-size: 13px; text-decoration: none; color: inherit; }
        .btn-page:hover:not(.disabled) { background-color: #e9ecef; }
        .btn-page.disabled { opacity: 0.5; cursor: not-allowed; pointer-events: none; }
        .page-info { font-size: 14px; color: #666; }
        .sidebar-footer { padding: 20px; border-top: 1px solid #eee; margin-top: auto; }
        .sidebar-footer a { color: #d9534f; text-decoration: none; font-size: 14px; }
        .reason-text { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .time-text { color: #666; font-size: 13px; white-space: nowrap; }
    </style>
</head>
<body>

<div class="app-container">
    <aside class="sidebar">
        <div class="sidebar-header"><div class="logo-icon"></div><h2>卡爾夏 <span class="badge">ADMIN</span></h2></div>
        <nav class="sidebar-nav">
            <ul>
                <li class="menu-item has-submenu"><a class="submenu-toggle"><span><i class="fas fa-users-cog"></i> 自訂</span><i class="fas fa-chevron-down arrow"></i></a><ul class="submenu"><li><a href="#">功能 A</a></li></ul></li>
                <li class="menu-item has-submenu"><a class="submenu-toggle"><span><i class="fas fa-users-cog"></i> 自訂</span><i class="fas fa-chevron-down arrow"></i></a><ul class="submenu"><li><a href="#">功能 B</a></li></ul></li>

                <li class="menu-item has-submenu">
                    <a class="submenu-toggle"><span><i class="fas fa-user-shield"></i> 帳號管理</span><i class="fas fa-chevron-down arrow"></i></a>
                    <ul class="submenu">
                        <li><a href="#">會員帳號管理</a></li>
                        <li><a href="#">管理員帳號管理</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu open">
                    <a class="submenu-toggle"><span><i class="fas fa-exclamation-circle"></i> 申訴/檢舉管理</span><i class="fas fa-chevron-down arrow"></i></a>
                    <ul class="submenu">
                        <li class="menu-item has-sub-item">
                            <a class="sub-toggle"><span>申訴總覽報表</span> <i class="fas fa-chevron-down arrow"></i></a>
                            <ul class="sub-submenu">
                                <li><a th:href="@{/appeals/admin/list(status='PENDING')}">尚未處理</a></li>
                                <li><a th:href="@{/appeals/admin/list(status='已結案')}">已結案</a></li>
                            </ul>
                        </li>
                        <li class="menu-item has-sub-item open">
                            <a class="sub-toggle"><span>檢舉總覽報表</span> <i class="fas fa-chevron-down arrow"></i></a>
                            <ul class="sub-submenu">
                                <li>
                                    <a th:href="@{/reports/admin/list(status='待處理')}"
                                       th:classappend="${currentStatus == '待處理' ? 'active' : ''}">尚未處理</a>
                                </li>
                                <li>
                                    <a th:href="@{/reports/admin/list(status='已結案')}"
                                       th:classappend="${currentStatus == '已結案' ? 'active' : ''}">已結案</a>
                                </li>
                            </ul>
                        </li>
                    </ul>
                </li>

                <li class="menu-item has-submenu"><a class="submenu-toggle"><span><i class="fas fa-tools"></i> 自訂</span><i class="fas fa-chevron-down arrow"></i></a><ul class="submenu"><li><a href="#">功能 C</a></li></ul></li>
                <li class="menu-item"><a href="#"><span><i class="fas fa-star"></i> 自訂</span></a></li>
                <li class="menu-item"><a href="#"><span><i class="fas fa-headset"></i> 自訂</span></a></li>
            </ul>
        </nav>
        <div class="sidebar-footer"><a href="#">登出 (Logout)</a></div>
    </aside>

    <main class="main-content">
        <header class="top-bar">
            <h2 class="page-title">檢舉管理系統</h2>
            <div class="user-profile"><span>Admin</span><div class="avatar"><i class="fas fa-user"></i></div></div>
        </header>

        <div class="content-area">
            <div class="table-container">
                <table class="report-table">
                    <thead>
                    <tr>
                        <th>編號</th>
                        <th>檢舉類型</th>
                        <th>檢舉原因</th>
                        <th>狀態</th>
                        <th>檢舉時間</th>
                        <th>案件管理</th>
                    </tr>
                    </thead>
                    <tbody id="reportTableBody">
                    <tr th:each="report : ${reportPage.content}">
                        <td th:text="${report.reportsNo}"></td>
                        <td th:text="${report.reportsType}"></td>
                        <td>
                            <div class="reason-text"
                                 th:title="${report.reportsReason}"
                                 th:text="${#strings.length(report.reportsReason) > 20 ? #strings.substring(report.reportsReason,0,20) + '...' : report.reportsReason}">
                            </div>
                        </td>
                        <td>
                            <span class="status-badge"
                                  th:classappend="${report.status == '處理中' ? 'status-processing' : (report.status == '已處理' || report.status == '已結案' ? 'status-closed' : (report.status == '駁回' ? 'status-rejected' : ''))}"
                                  th:text="${report.status}">
                            </span>
                        </td>
                        <td class="time-text" th:text="${#temporals.format(report.reportsTimestamp, 'yyyy-MM-dd HH:mm')}"></td>
                        <td>
                            <a th:href="@{/reports/admin/handle(id=${report.reportsNo})}"
                               class="btn-action"
                               th:style="${(report.status == '已結案' || report.status == '已處理' || report.status == '駁回') ? 'background-color: #6c757d;' : ''}"
                               th:text="${(report.status == '已結案' || report.status == '已處理' || report.status == '駁回') ? '查看' : '處理案件'}"></a>
                        </td>
                    </tr>
                    <tr th:if="${reportPage.totalElements == 0}">
                        <td colspan="6" style="text-align: center; padding: 40px; color: #999;">目前沒有檢舉資料</td>
                    </tr>
                    </tbody>
                </table>

                <div class="pagination-container" th:if="${reportPage.totalPages > 1}">
                    <a th:href="@{/reports/admin/list(status=${currentStatus}, page=${currentPage - 1})}"
                       class="btn-page"
                       th:classappend="${!reportPage.hasPrevious() ? 'disabled' : ''}">上一頁</a>

                    <span class="page-info">
                        第 <span th:text="${currentPage + 1}"></span> 頁 /
                        共 <span th:text="${reportPage.totalPages}"></span> 頁
                        (共 <span th:text="${reportPage.totalElements}"></span> 筆資料)
                    </span>

                    <a th:href="@{/reports/admin/list(status=${currentStatus}, page=${currentPage + 1})}"
                       class="btn-page"
                       th:classappend="${!reportPage.hasNext() ? 'disabled' : ''}">下一頁</a>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    document.querySelectorAll('.submenu-toggle, .sub-toggle').forEach(toggle => {
        toggle.addEventListener('click', function(e) {
            if (e.currentTarget.tagName === 'A' && e.currentTarget.getAttribute('href') !== null && e.currentTarget.getAttribute('href') !== '#') {
                return;
            }
            e.preventDefault();
            this.parentElement.classList.toggle('open');
        });
    });
</script>
</body>
</html>
