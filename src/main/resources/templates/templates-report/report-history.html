<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>檢舉紀錄 - 卡爾夏汽車百貨</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* --- 基礎設定 --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #050000;
            background-image: linear-gradient(to bottom, #000000 0%, #3a0000 40%, #000000 100%);
            color: #ffffff;
            line-height: 1.5;
            min-height: 100vh;
        }

        a {
            text-decoration: none;
            color: inherit;
            transition: 0.3s;
        }

        a:hover {
            color: #ff3333;
        }

        ul {
            list-style: none;
        }

        /* --- 頂部導航 --- */
        /* 💡 確保 Header 層級最高，且內部的圖示容器有相對定位參考 */
        header {
            position: relative;
            z-index: 1000;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 40px;
            font-size: 12px;
            color: #ccc;
            border-bottom: 1px solid #333;
        }

        .top-icons {
            display: flex;
            gap: 20px;
            align-items: center;
            position: relative; /* 💡 讓選單能以這組圖示為基準定位 */
        }

        .search-box {
            border: 1px solid #555;
            padding: 5px 10px;
            display: flex;
            align-items: center;
            width: 150px;
            justify-content: space-between;
        }

        .main-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo::before {
            content: '';
            display: inline-block;
            width: 30px;
            height: 15px;
            background: white;
            border-radius: 10px;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            font-size: 14px;
            align-items: center;
        }

        /* --- 主要內容區佈局 --- */
        .container {
            display: flex;
            padding: 40px;
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        aside {
            width: 250px;
            flex-shrink: 0;
            padding-right: 40px;
        }

        .sidebar-title {
            font-size: 18px;
            margin-bottom: 20px;
            color: #ddd;
        }

        .category-list li {
            margin-bottom: 12px;
            font-size: 14px;
            color: #aaa;
            cursor: pointer;
            transition: 0.3s;
        }

        .category-list li.active {
            color: #ff3333;
            font-weight: bold;
        }

        /* --- 檢舉紀錄卡片區塊 --- */
        .history-card {
            flex: 1;
            background: rgba(15, 0, 0, 0.5);
            border-left: 4px solid #ff3333;
            border-top: 1px solid rgba(255, 51, 51, 0.2);
            border-right: 1px solid rgba(255, 51, 51, 0.2);
            border-bottom: 1px solid rgba(255, 51, 51, 0.2);
            padding: 45px;
            backdrop-filter: blur(5px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
        }

        .history-title {
            font-size: 52px;
            font-weight: 800;
            color: #ff3333;
            margin-bottom: 10px;
            letter-spacing: 5px;
            text-shadow: 2px 2px 0px rgba(0, 0, 0, 1);
        }

        .history-subtitle {
            font-size: 13px;
            color: #999;
            margin-bottom: 40px;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-subtitle::before {
            content: '|';
            color: #ff3333;
            font-weight: bold;
        }

        .history-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
            table-layout: fixed;
        }

        .history-table th {
            padding: 10px 15px;
            color: #ff3333;
            font-size: 15px;
            font-weight: bold;
            text-align: left;
            border-bottom: 1px solid #ff3333;
        }

        .history-table td {
            padding: 20px 15px;
            background: rgba(255, 255, 255, 0.03);
            border-top: 1px solid rgba(255, 51, 51, 0.1);
            border-bottom: 1px solid rgba(255, 51, 51, 0.1);
            color: #eee;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-table td:first-child {
            border-left: 1px solid rgba(255, 51, 51, 0.1);
        }

        .history-table td:last-child {
            border-right: 1px solid rgba(255, 51, 51, 0.1);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 12px;
            display: inline-block;
            text-align: center;
            min-width: 60px;
        }

        .status-pending {
            background: #444;
            color: #aaa;
        }

        .status-closed {
            background: #008000;
            color: #fff;
            box-shadow: 0 0 10px rgba(0, 128, 0, 0.3);
        }

        .view-btn {
            background-color: transparent;
            color: #ff3333;
            border: 1px solid #ff3333;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            display: inline-block;
            border-radius: 2px;
        }

        .view-btn:hover:not(.disabled) {
            background-color: #ff3333;
            color: white;
            box-shadow: 0 0 15px rgba(255, 51, 51, 0.4);
        }

        .view-btn.disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
            pointer-events: none;
            opacity: 0.5;
        }

        /* 💡 新增：分頁容器樣式 */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-top: 30px;
            padding-bottom: 20px;
        }

        .page-info {
            font-size: 14px;
            color: #ddd;
            font-family: 'Arial', sans-serif;
        }

        /* 💡 修正：下拉選單定位與 z-index */
        .dropdown-menu {
            display: none;
            position: absolute;
            right: 0; /* 💡 對齊父層右側 */
            top: 100%;
            background-color: #1a1a1a;
            min-width: 150px;
            border: 1px solid #333;
            z-index: 2000;
            margin-top: 15px; /* 💡 稍微拉開距離 */
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-menu a {
            color: #ccc;
            padding: 12px 16px;
            display: block;
            font-size: 13px;
        }

        .dropdown-menu a:hover {
            background-color: #333;
            color: #ff3333;
        }

        footer {
            margin-top: 100px;
            padding: 60px 40px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 40px;
            font-size: 14px;
            color: #555;
        }
    </style>
</head>

<body>

<header th:replace="fragments/front_header :: frontHeader"></header>

<div class="container">
    <aside>
        <div class="sidebar-section">
            <h3 class="sidebar-title">Browse by</h3>
            <ul class="category-list">
                <li onclick="location.href='/appeals/add'">提交申訴</li>
                <li onclick="location.href='/reports/add'">提交檢舉</li>
                <li onclick="location.href='/appeals/history'">申訴紀錄</li>
                <li class="active" onclick="location.href='/reports/history'">檢舉紀錄</li>
            </ul>
        </div>
    </aside>

    <div class="history-card">
        <h1 class="history-title">REPORT LOGS</h1>
        <p class="history-subtitle">系統正在追蹤處理進度。結果將發送至您的 Email。</p>

        <table class="history-table">
            <thead>
            <tr>
                <th style="width: 10%;">編號</th>
                <th style="width: 20%;">檢舉對象</th>
                <th style="width: 15%;">類型</th>
                <th style="width: 25%;">檢舉時間</th>
                <th style="width: 15%;">狀態</th>
                <th style="width: 15%;">檢視</th>
            </tr>
            </thead>
            <tbody id="reportLogBody">
            <tr th:each="report : ${reports}">
                <td th:text="${report.reportsNo}"></td>
                <td th:text="${report.reportsTarget != null ? report.reportsTarget : 'N/A'}"></td>
                <td th:text="${report.reportsType != null ? report.reportsType : '未分類'}"></td>
                <td th:text="${#temporals.format(report.reportsTimestamp, 'yyyy-MM-dd HH:mm')}"></td>
                <td>
                    <span
                            th:class="${report.status == '已處理' || report.status == '已結案' ? 'status-badge status-closed' : 'status-badge status-pending'}"
                            th:text="${report.status}">
                    </span>
                </td>
                <td>
                    <a th:href="@{/reports/history/detail(id=${report.reportsNo})}" class="view-btn">查看案件</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(reports)}">
                <td colspan="6" style="text-align:center; padding: 80px; color: #444;">DATABASE EMPTY / 無檢舉紀錄
                </td>
            </tr>
            </tbody>
        </table>

        <div class="pagination-container" id="paginationControls">
        </div>
    </div>
</div>

<footer>
    <div class="footer-col">
        <div class="logo">卡爾夏</div>
    </div>
    <div class="footer-col">
        <h4>Shop</h4>
        <ul>
            <li>Parts</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>Company</h4>
        <ul>
            <li>About Us</li>
            <li>FAQ</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>Contact</h4>
        <ul>
            <li>Email</li>
        </ul>
    </div>
    <div class="footer-col">
        <h4>Follow</h4>
        <ul>
            <li>Instagram</li>
        </ul>
    </div>
</footer>

<script th:inline="javascript">
    // 💡 僅保留下拉選單等基礎交互 JS
    document.addEventListener('DOMContentLoaded', function () {
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');
        const memberTrigger = document.getElementById('member-center-trigger');
        const memberDropdown = document.getElementById('member-dropdown');
        const forumTrigger = document.getElementById('forum-center-trigger');
        const forumDropdown = document.getElementById('forum-dropdown');

        if (userIcon) {
            userIcon.addEventListener('click', function (e) {
                e.preventDefault(); // 💡 防止點擊穿透或預設跳轉
                e.stopPropagation();
                if (userDropdown) userDropdown.classList.toggle('show');
                if (memberDropdown) memberDropdown.classList.remove('show');
                if (forumDropdown) forumDropdown.classList.remove('show');
            });
        }

        if (memberTrigger) {
            memberTrigger.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                if (memberDropdown) memberDropdown.classList.toggle('show');
                if (userDropdown) userDropdown.classList.remove('show');
                if (forumDropdown) forumDropdown.classList.remove('show');
            });
        }

        // ✅ 點擊「論壇」時跳轉，下拉選單行為在點擊文字外的區域關閉
        if (forumTrigger) {
            forumTrigger.addEventListener('click', function (e) {
                // 如果是直接點擊主連結，執行跳轉
                window.location.href = '/forum';

                e.stopPropagation();
                if (forumDropdown) forumDropdown.classList.toggle('show');
                if (userDropdown) userDropdown.classList.remove('show');
                if (memberDropdown) memberDropdown.classList.remove('show');
            });
        }

        document.addEventListener('click', function (e) {
            if (userDropdown) userDropdown.classList.remove('show');
            if (memberDropdown) memberDropdown.classList.remove('show');
            if (forumDropdown) forumDropdown.classList.remove('show');
        });
    });
</script>
</body>

</html>
