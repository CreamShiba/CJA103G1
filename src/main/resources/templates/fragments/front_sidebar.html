<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<aside th:fragment="frontSidebar">

    <div class="sidebar-section" th:if="${not #lists.isEmpty(myCars)}">
        <h3 class="sidebar-title" style="color: #00e676; display: flex; align-items: center; gap: 8px;">
            <i class="fas fa-warehouse"></i> 我的車庫
        </h3>

        <ul class="category-list">
            <li th:each="memberCar : ${myCars}">
                <a th:href="@{/shop(carCategoryNo=${memberCar.carCategory.carCategoryNo}, keyword=${keyword}, sellerNo=${sellerNo})}"
                   th:style="${carCategoryNo == memberCar.carCategory.carCategoryNo} ? 'color: #00e676; font-weight: bold; border-left: 3px solid #00e676; padding-left: 8px;' : ''">

                    <i class="fas fa-car" style="margin-right: 5px;"></i>
                    <span th:text="${memberCar.carCategory.FullName}"></span>
                </a>
            </li>
        </ul>

        <div th:if="${carCategoryNo != null}" style="margin-top: 10px; padding-left: 10px;">
            <a th:href="@{/shop(keyword=${keyword}, sellerNo=${sellerNo})}"
               style="font-size: 13px; color: #ff5252; text-decoration: none; display: flex; align-items: center; gap: 5px;">
                <i class="fas fa-times-circle"></i> 清除車款篩選
            </a>
        </div>

        <div style="border-bottom: 1px solid #333; margin: 15px 0;"></div>
    </div>

    <div class="sidebar-section">
        <h3 class="sidebar-title">Categories</h3>
        <ul class="category-list">

            <li>
                <a th:href="@{/shop(sellerNo=${sellerNo})}"
                   th:style="${productCategoryNo == null && keyword == null} ? 'color: #ff3333; font-weight: bold;' : ''">
                    所有商品
                </a>
            </li>

            <li th:each="cat : ${categoryList}">
                <a th:href="@{/shop(productCategoryNo=${cat.productCategoryNo}, carCategoryNo=${carCategoryNo}, keyword=${keyword}, minPrice=${minPrice}, maxPrice=${maxPrice}, sellerNo=${sellerNo})}"
                   th:text="${cat.productCategoryName}"
                   th:style="${productCategoryNo == cat.productCategoryNo} ? 'color: #ff3333; font-weight: bold;' : ''">
                    分類名稱
                </a>
            </li>
        </ul>
    </div>

    <div class="sidebar-section">
        <h3 class="sidebar-title">Price Range</h3>

        <form th:action="@{/shop}" method="get">

            <input type="hidden" name="keyword" th:value="${keyword}" th:if="${keyword != null}">
            <input type="hidden" name="productCategoryNo" th:value="${productCategoryNo}" th:if="${productCategoryNo != null}">
            <input type="hidden" name="carCategoryNo" th:value="${carCategoryNo}" th:if="${carCategoryNo != null}">
            <input type="hidden" name="sellerNo" th:value="${sellerNo}" th:if="${sellerNo != null}">

            <div class="price-input-group">
                <input type="number" name="minPrice" th:value="${minPrice}" placeholder="$ Min" min="0" class="price-input">
                <span style="color: #666;">-</span>
                <input type="number" name="maxPrice" th:value="${maxPrice}" placeholder="$ Max" min="0" class="price-input">
            </div>

            <button type="submit" class="btn-apply">APPLY</button>
        </form>
    </div>
</aside>

</body>
</html>
