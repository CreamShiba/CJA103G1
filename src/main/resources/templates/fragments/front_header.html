<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>

<header th:fragment="frontHeader">

    <div class="top-bar">
        <div class="seller-entry">
            <a th:href="@{/product/dashboard}" style="color: white; text-decoration: none; font-size: 14px;">
                <i class="fas fa-store"></i> 賣家中心
            </a>
            <span style="margin: 0 10px; color: #666;">|</span>
            <a href="#" style="color: white; text-decoration: none; font-size: 14px;">下載 App</a>
        </div>
        <div class="top-icons">
            <div class="search-box">
                <form th:action="@{/shop}" method="get" style="display: flex; width: 100%; align-items: center;">

                    <input type="text" name="keyword" th:value="${keyword}" placeholder="Search..."
                           style="background: transparent; border: none; color: white; width: 100%; outline: none;">

                    <input type="hidden" name="carCategoryNo" th:value="${carCategoryNo}" th:if="${carCategoryNo != null}">

                    <input type="hidden" name="sellerNo" th:value="${sellerNo}" th:if="${sellerNo != null}">

                    <input type="hidden" name="productCategoryNo" th:value="${productCategoryNo}" th:if="${productCategoryNo != null}">

                    <button type="submit" style="background: transparent; border: none; cursor: pointer; padding: 0;">
                        <span style="font-size: 16px;">🔍</span>
                    </button>
                </form>
            </div>

            <div class="user-dropdown-container">
                <span id="user-icon" style="cursor: pointer;">👤</span>
                <div id="user-dropdown" class="dropdown-menu">

                    <th:block th:if="${session.member == null}">
                        <a th:href="@{/members/login}">登入</a>
                        <a th:href="@{/members/register}">註冊</a>
                    </th:block>

                    <th:block th:if="${session.member != null}">
							<span style="display:block; padding: 12px 16px; color: #888; font-size: 14px; border-bottom: 1px solid #333;"
                                  th:text="'Hi, ' + ${session.member.memUsername}">
								Hi, 會員
							</span>

                        <a th:href="@{/members/view}">編輯個人資料</a>
                        <a th:href="@{/pages/my-coupons}">我的優惠券</a>
                        <a th:href="@{/favorite/list-page}">我的收藏</a>
                        <a th:href="@{/pages/my-orders}">訂單查詢</a>
                        <a th:href="@{/appeals/add}">申訴/檢舉</a>
                        <form th:action="@{/members/logout}" method="post" id="logoutForm">
                            <a href="#" onclick="document.getElementById('logoutForm').submit(); return false;">
                                登出 (Logout)
                            </a>
                        </form>
                    </th:block>
                </div>
            </div>

            <span id="cart" style="cursor: pointer;">🛒</span>
        </div>
    </div>

    <div class="main-header">
        <a th:href="@{/shop}" class="logo">卡爾夏</a>
        <nav class="nav-links">
            <a th:href="@{/shop}">商城</a>
            <a th:href="@{/installation/home}">安裝區</a>
            <div class="user-dropdown-container">
                <a href="javascript:void(0)" id="forum-center-trigger">論壇 ▾</a>
                <div id="forum-dropdown" class="dropdown-menu">
                    <a th:href="@{/forum}">論壇首頁</a>
                    <a th:href="@{/chat}" style="color: #ff3333">私訊中心</a>
                </div>
            </div>
            <a th:href="@{/announcement}">公告</a>
            <a th:href="@{/faq}">常見問題</a>
        </nav>
    </div>
</header>

</body>
</html>
