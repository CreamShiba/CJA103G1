<!DOCTYPE html>
<html lang="zh-TW" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
</head>

<body>

    <aside class="sidebar" th:fragment="adminSidebar(activePage)">
        <div class="sidebar-header">
            <div class="logo-icon"></div>
            <h2>卡爾夏 <span class="badge">ADMIN</span></h2>
        </div>

        <nav class="sidebar-nav">
            <ul>
                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu" th:classappend="${activePage == 'sellers'} ? 'open' : ''">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 帳號管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">會員帳號管理</a></li>
                        <li>
                            <a th:href="@{/admin/sellers}" th:classappend="${activePage == 'sellers'} ? 'active' : ''">
                                賣家帳號管理
                            </a>
                        </li>
                        <li><a href="#">管理員帳號管理</a></li>
                    </ul>
                </li>

                <li class="menu-item has-submenu" th:classappend="${activePage == 'productAudit'} ? 'open' : ''">

                    <a class="submenu-toggle">
                        <span><i class="fas fa-boxes"></i> 商品管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a th:href="@{/admin/products/audit}"
                                th:classappend="${activePage == 'productAudit'} ? 'active' : ''">
                                重新上架審核
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="menu-item has-submenu" th:classappend="${activePage == 'orders'} ? 'open' : ''">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-clipboard-list"></i> 商城訂單管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li>
                            <a th:href="@{/admin/orders}" th:classappend="${activePage == 'orders'} ? 'active' : ''">
                                訂單列表 & 撥款
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="menu-item has-submenu" th:classappend="${activePage == 'installation'} ? 'open' : ''">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-tools"></i> 安裝服務管理</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li>
                            <a th:href="@{/admin/dashboard(tab='technicians')}"
                                th:classappend="${activePage == 'installation' && currentTab == 'technicians'} ? 'active' : ''">
                                技師管理
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/admin/dashboard(tab='locations')}"
                                th:classappend="${activePage == 'installation' && currentTab == 'locations'} ? 'active' : ''">
                                場地管理
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/admin/dashboard(tab='payout')}"
                                th:classappend="${activePage == 'installation' && currentTab == 'payout'} ? 'active' : ''">
                                訂單撥款
                            </a>
                        </li>
                        <li>
                            <a th:href="@{/admin/dashboard(tab='services')}"
                                th:classappend="${activePage == 'installation' && currentTab == 'services'} ? 'active' : ''">
                                服務項目
                            </a>
                        </li>
                    </ul>
                </li>
                <li class="menu-item has-submenu" th:classappend="${activePage == 'reports'} ? 'open' : ''">

                    <a class="submenu-toggle">
                        <span><i class="fas fa-exclamation-triangle"></i> 檢舉審核</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>

                    <ul class="submenu">
                        <li>
                            <a th:href="@{/admin/reports}" th:classappend="${activePage == 'reports'} ? 'active' : ''">
                                商品檢舉管理
                            </a>
                        </li>
                    </ul>
                </li>

                <li class="menu-item has-submenu">
                    <a class="submenu-toggle">
                        <span><i class="fas fa-users-cog"></i> 自訂</span>
                        <i class="fas fa-chevron-down arrow"></i>
                    </a>
                    <ul class="submenu">
                        <li><a href="#">自訂</a></li>
                        <li><a href="#">自訂</a></li>
                    </ul>
                </li>

                <li class="menu-item">
                    <a href="#"><i class="fas fa-star"></i> 自訂</a>
                </li>
                <li class="menu-item">
                    <a href="#"><i class="fas fa-headset"></i> 自訂</a>
                </li>
            </ul>
        </nav>

        <div class="sidebar-footer">
            <a href="#">登出 (Logout)</a>
        </div>

    </aside>

</body>

</html>
