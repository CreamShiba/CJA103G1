<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>KarShop | 提交安裝申訴</title>
    <link rel="stylesheet" th:href="@{/front-end/css/index.css}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #000000; color: #ffffff; font-family: 'Arial', sans-serif; }
        .buyer-sidebar { width: 250px; background-color: #5a0000; min-height: 100vh; position: fixed; padding: 20px; }
        .sidebar-item { padding: 12px; color: white; text-decoration: none; display: block; border-bottom: 1px solid #7a0000; }
        .sidebar-item:hover { background-color: #8b0000; }
        .main-content { margin-left: 270px; padding: 50px 20px; }
        .appeal-card { background-color: #111; border: 2px solid #8b0000; border-radius: 0; padding: 40px; }
        .btn-submit { background-color: #8b0000; border: none; border-radius: 0; padding: 15px; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background-color: #ff0000; transform: scale(1.02); }
        .form-control { background-color: #222; border: 1px solid #444; color: white; border-radius: 0; }
        .form-control:focus { background-color: #2a2a2a; border-color: #8b0000; color: white; box-shadow: none; }
        label { color: #8b0000; text-transform: uppercase; font-size: 0.8em; letter-spacing: 1px; }
    </style>
</head>
<body>

<div class="buyer-sidebar">
    <div class="mb-4 text-center">
        <h4 style="font-weight: 900;">買家狀態</h4>
        <p style="font-size: 0.7em;">ID1234</p>
    </div>
    <a href="#" class="sidebar-item">買家資訊設定</a>
    <a href="#" class="sidebar-item">我的商品訂單</a>
    <a href="/appeals/add" class="sidebar-item" style="background-color: #8b0000;">我的安裝訂單 (申訴)</a>
    <a href="#" class="sidebar-item">我的收藏</a>
    <div class="mt-5">
        <a href="#" class="sidebar-item" style="border: none; color: #aaa;">登出</a>
    </div>
</div>

<main class="main-content">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="appeal-card">
                    <h1 class="mb-2" style="font-weight: 900;">提交申訴 <span style="color: #8b0000;">/</span> SERVICE APPEAL</h1>
                    <p class="text-muted mb-5">對技師安裝不滿意？請詳細填寫下方資訊，專員將立即介入調查。</p>

                    <form th:action="@{/appeals/submit}" method="post">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <label class="mb-2">安裝訂單編號 ORDER NO.</label>
                                <input type="number" name="installOrderNo" class="form-control" placeholder="請輸入編號" required>
                            </div>
                            <div class="col-md-6">
                                <label class="mb-2">您的會員編號 MEMBER ID</label>
                                <input type="number" name="memberNo" class="form-control" placeholder="請輸入編號" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="mb-2">目標技師編號 TECHNICIAN ID</label>
                            <input type="number" name="targetMemberNo" class="form-control" placeholder="請輸入技師編號" required>
                        </div>

                        <div class="mb-4">
                            <label class="mb-2">申訴原因描述 DESCRIPTION</label>
                            <textarea name="description" class="form-control" rows="6" placeholder="請描述發生什麼事..." required></textarea>
                        </div>

                        <input type="hidden" name="admNo" value="1">

                        <button type="submit" class="btn btn-submit">確認發送申訴單 SEND APPEAL</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

</body>
</html>
