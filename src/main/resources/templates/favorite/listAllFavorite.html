<script>


    document.addEventListener('DOMContentLoaded', function() {
        initUserDropdown();
    });

    // 初始化下拉選單
    function initUserDropdown() {
        // 處理右上角使用者圖示
        const userIcon = document.getElementById('user-icon');
        const userDropdown = document.getElementById('user-dropdown');
        const memberTrigger = document.getElementById('member-center-trigger');
        const memberDropdown = document.getElementById('member-dropdown');

        if (userIcon && userDropdown) {
            userIcon.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                userDropdown.classList.toggle('show');

                // 關閉其他下拉選單
                if (memberDropdown) {
                    memberDropdown.classList.remove('show');
                }
            });
        }

        // 處理導航列中的「會員中心」
        if (memberTrigger && memberDropdown) {
            memberTrigger.onclick = function(e) {
                e.preventDefault();
                e.stopPropagation();

                memberDropdown.classList.toggle('show');
                userDropdown.classList.remove('show');
            };
        }

        // 全域點擊監聽：點擊選單以外區域時關閉
        document.addEventListener('click', function(event) {
            const isUserIcon = event.target.closest('#user-icon');
            const isMemberTrigger = event.target.closest('#member-center-trigger');
            const isUserDropdown = event.target.closest('#user-dropdown');
            const isMemberDropdown = event.target.closest('#member-dropdown');

            if (!isUserIcon && !isUserDropdown) {
                userDropdown.classList.remove('show');
            }

            if (!isMemberTrigger && !isMemberDropdown) {
                memberDropdown.classList.remove('show');
            }
        });
    }
    // 導航功能
    function navigateTo(page) {
        const routes = {
            'home': '/pages/front-end/index',
            'shop': '/shop',
            'installation': '/installation',
            'forum': '/forum',
            'notice': '/notice',
            'faq': '/faq',
            'category1': '/category/category1',
            'category2': '/category/category2',
            'category3': '/category/category3',
            'category4': '/category/category4',
            'category5': '/category/category5',
            'coupons': '/pages/my-coupons',
            'favorite':'/favorite/list-page'
        };

        if (routes[page]) {
            window.location.href = routes[page];
        }
    }
    // 標籤頁切換
    function switchTab(tab, element) {
        // 隱藏所有區域
        document.getElementById('products-section').style.display = 'none';
        document.getElementById('stores-section').style.display = 'none';

        // 移除所有按鈕的 active 狀態
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.remove('active');
        });

        // 顯示選中區域並激活按鈕
        if (tab === 'products') {
            document.getElementById('products-section').style.display = 'block';
        } else {
            document.getElementById('stores-section').style.display = 'block';
        }
        element.classList.add('active');
    }

    // 刪除商品收藏
    function deleteProduct(prodNo) {
        if (!confirm('確定要取消收藏這個商品嗎？')) return;

        const params = new URLSearchParams();
        params.append('prodNo', prodNo);

        fetch('/favorite/deleteAjax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const row = document.getElementById('prod-row-' + prodNo);
                    if (row) {
                        row.style.opacity = '0';
                        setTimeout(() => row.remove(), 300);
                    }

                    // 檢查是否還有商品
                    const tbody = document.getElementById('product-table-body');
                    if (tbody && tbody.children.length === 0) {
                        location.reload();
                    }
                } else {
                    alert('取消失敗：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請稍後重試');
            });
    }

    // 刪除賣場收藏
    function deleteStore(sellerNo) {
        if (!confirm('確定要取消收藏這個賣場嗎？')) return;

        const params = new URLSearchParams();
        params.append('sellerNo', sellerNo);

        fetch('/favoriteStore/deleteAjax', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params
        })
            .then(res => res.json())
            .then(data => {
                if (data.status === 'success') {
                    const row = document.getElementById('store-row-' + sellerNo);
                    if (row) {
                        row.style.opacity = '0';
                        setTimeout(() => row.remove(), 300);
                    }

                    // 檢查是否還有賣場
                    const tbody = document.getElementById('store-table-body');
                    if (tbody && tbody.children.length === 0) {
                        location.reload();
                    }
                } else {
                    alert('取消失敗：' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('發生錯誤，請稍後重試');
            });
    }
</script>
